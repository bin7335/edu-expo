<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- csp:auto --><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><!-- /csp:auto -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>순서 기억 패드 - 별빛 통신 기지 기억력 게임</title>
<meta name="description" content="불빛과 도레미솔 소리가 켜진 순서를 기억해 그대로 누르는 기억력 단계 도전 게임. 4색 보통·6색 어려움, 최고 단계 기록, 소리 끄기.">
<style>
:root{--ink:#eef2ff;--sub:#a9b4e8;--panel:#161c4a;--line:#2b3577;--acc:#ffd84d}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;
background:radial-gradient(1.5px 1.5px at 12% 20%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 72% 12%,#fff9 50%,transparent 51%),radial-gradient(2px 2px at 40% 80%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 64%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 25% 55%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 40%,#fff5 50%,transparent 51%),linear-gradient(160deg,#0b1030,#1b1150 60%,#0b1a3d);background-attachment:fixed}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#2ec5ff);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 0 #3a2a8f}
h1{margin:0;font-size:26px;letter-spacing:-.5px}
header small{display:block;color:var(--sub);font-size:14px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;font:inherit;font-weight:800;font-size:16px;padding:10px 16px;border-radius:14px;cursor:pointer;background:#252e6e;color:var(--ink);box-shadow:0 4px 0 #11163d;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #11163d}
.btn.on{background:#ffd84d;color:#2a2060;box-shadow:0 4px 0 #b08d12}
.btn.big{font-size:22px;padding:16px 22px;width:100%;background:linear-gradient(135deg,#ff6b8b,#ff9f43);color:#fff;box-shadow:0 6px 0 #a83a52}
.btn.big:active{box-shadow:0 2px 0 #a83a52}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;padding:6px 20px 10px}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;perspective:900px}
.hub{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:6px 18px;font-weight:800;font-size:18px}
.hub b{color:var(--acc);font-size:24px}
#pads{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;width:min(100%,540px);aspect-ratio:1/1;max-height:calc(100vh - 170px);transform:rotateX(14deg);transform-origin:50% 60%;padding:6px}
#pads.hard{grid-template-columns:repeat(3,1fr);aspect-ratio:3/2;width:min(100%,640px)}
.pad{position:relative;border:0;border-radius:28px;cursor:pointer;font:inherit;color:#fff;background:var(--c);box-shadow:0 12px 0 var(--d),0 18px 24px #0007;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:manipulation;transition:transform .09s;-webkit-tap-highlight-color:transparent;min-height:0}
.pad::before{content:"";position:absolute;inset:0;border-radius:inherit;background:#0b1030;opacity:.5;transition:opacity .12s}
.pad::after{content:"";position:absolute;inset:-10px;border-radius:34px;border:5px solid #fff;opacity:0;transform:scale(.92);transition:opacity .12s,transform .12s}
.pad .e{font-size:clamp(34px,7vw,68px);position:relative;line-height:1}
.pad .n{font-size:clamp(15px,2.2vw,22px);font-weight:900;position:relative;text-shadow:0 2px 0 #0005}
.pad.lit{transform:translateY(8px)}
.pad.lit::before{opacity:0}
.pad.lit::after{opacity:.9;transform:scale(1)}
.pad.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
body[data-phase=idle] .pad::before{animation:idle 4.8s infinite;animation-delay:calc(var(--i) * .6s)}
@keyframes idle{0%,14%{opacity:.08}30%,100%{opacity:.5}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.score{text-align:center}
.score small{color:var(--sub);font-weight:700;font-size:14px}
.score div{font-size:42px;font-weight:900;line-height:1.1}
.score div span{font-size:18px;color:var(--sub)}
#best{color:var(--acc)}
#msg{font-size:19px;font-weight:800;min-height:56px;display:flex;align-items:center;gap:8px;line-height:1.35}
#dots{display:flex;flex-wrap:wrap;gap:6px;min-height:18px;margin-top:6px}
#dots i{width:16px;height:16px;border-radius:50%;background:#2b3577;transition:transform .15s}
#dots i.ok{background:var(--acc);transform:scale(1.15)}
.how{margin:0;padding-left:22px;color:var(--sub);font-size:15px;line-height:1.7}
.how b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.chip{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--c);box-shadow:0 4px 0 var(--d);position:relative;transition:transform .12s}
.chip.now{transform:translateY(-6px) scale(1.12)}
.chip.miss{outline:4px solid #fff;outline-offset:2px}
.chip.miss::after{content:"✋";position:absolute;bottom:-26px;font-size:18px}
#modal{position:fixed;inset:0;background:#05081dcc;display:none;place-items:center;padding:16px;z-index:9}
#modal.on{display:grid}
#mbox{background:#1d2560;border:3px solid #4a57b8;border-radius:26px;padding:22px;width:min(440px,100%);text-align:center;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#mbox h2{margin:4px 0;font-size:28px}
#mbox p{margin:6px 0;color:var(--sub);font-size:16px}
#mbox .rk{font-size:56px;line-height:1;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.newrec{display:inline-block;background:var(--acc);color:#2a2060;font-weight:900;border-radius:99px;padding:3px 12px;font-size:15px;animation:pop .4s}
footer{text-align:right;padding:0 20px 10px;font-size:13px}
footer a{color:var(--sub);text-decoration:none}
@media (max-width:860px){
  main{grid-template-columns:1fr;padding:6px 12px 10px}
  header{padding:10px 12px}
  h1{font-size:22px}
  .tools{margin-left:0;width:100%}
  .tools .btn{flex:1;padding:9px 8px;font-size:15px}
  #pads{gap:12px;max-height:none;transform:rotateX(8deg);aspect-ratio:4/3}
  #pads.hard{aspect-ratio:3/2}
  .score div{font-size:34px}
}
</style>
<!-- og:auto -->
<meta property="og:type" content="website">
<meta property="og:title" content="순서 기억 패드">
<meta property="og:description" content="불빛과 소리가 켜진 순서를 기억해 그대로 누르는 기억력 단계 도전">
<meta property="og:image" content="https://bin7335.github.io/edu-expo/thumbnails/56-sound-order.png">
<meta property="og:url" content="https://bin7335.github.io/edu-expo/sound-order/">
<meta name="twitter:card" content="summary_large_image">

</head>
<body data-phase="idle">
<header>
  <div class="logo">🛰️</div>
  <div><h1>순서 기억 패드</h1><small>별빛 통신 기지 — 신호가 켜진 순서를 기억해 그대로 보내요</small></div>
  <div class="tools">
    <button class="btn on" id="mEasy" type="button">보통 4색</button>
    <button class="btn" id="mHard" type="button">어려움 6색</button>
    <button class="btn" id="snd" type="button">🔊 소리 켜짐</button>
  </div>
</header>
<main>
  <section class="stage">
    <div class="hub">📡 지금 <b id="lvl">0</b>단계</div>
    <div id="pads"></div>
  </section>
  <aside class="side">
    <div class="card scores">
      <div class="score"><small>이번 기록</small><div><span id="cur">0</span><span>단계</span></div></div>
      <div class="score"><small>🏅 최고 기록 (<span id="bestMode">보통</span>)</small><div><span id="best">0</span><span>단계</span></div></div>
    </div>
    <div class="card"><div id="msg">🚀 출발 버튼을 누르면 신호가 시작돼요!</div><div id="dots"></div></div>
    <button class="btn big" id="start" type="button">🚀 출발!</button>
    <div class="card"><ol class="how">
      <li>신호 패드가 <b>불빛과 소리</b>로 순서를 보여 줘요.</li>
      <li>같은 순서로 패드를 <b>그대로 눌러요</b>. (키보드 1-6도 돼요)</li>
      <li>맞히면 신호가 <b>한 칸씩 늘어나요</b>. 틀리면 정답을 다시 보여 줘요.</li>
    </ol></div>
  </aside>
</main>
<div id="modal"><div id="mbox">
  <div class="rk" id="mIcon">🌟</div>
  <h2 id="mTitle"></h2>
  <p id="mSub"></p>
  <div id="mNew"></div>
  <p>정답 순서</p>
  <div class="chips" id="mChips"></div>
  <button class="btn big" id="again" type="button">🔁 다시 하기</button>
</div></div>
<footer><a href="../">← 전체 데모 보기</a></footer>
<script>
(function(){
'use strict';
var PADS=[
  {e:'🪐',n:'도',c:'#ff5d73',d:'#a8263d',f:261.63},
  {e:'⭐',n:'레',c:'#f7b500',d:'#9a6c00',f:293.66},
  {e:'🌙',n:'미',c:'#22c47f',d:'#0f7449',f:329.63},
  {e:'☄️',n:'솔',c:'#2e9bff',d:'#1257a3',f:392.00},
  {e:'🛸',n:'라',c:'#9b6bff',d:'#5934b3',f:440.00},
  {e:'🌟',n:'높은 도',c:'#ff5fc8',d:'#a3237c',f:523.25}
];
var KEY='edu-expo-sound-order-v1';
var $=function(id){return document.getElementById(id);};
var st={mode:'easy',seq:[],idx:0,phase:'idle',run:0,speed:1,sound:true,best:{easy:0,hard:0}};
var rnd=Math.random;
function seeded(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function num(v){v=Number(v);return isFinite(v)&&v>0?Math.min(999,Math.floor(v)):0;}
try{var s=JSON.parse(localStorage.getItem(KEY)||'{}');if(s&&typeof s==='object'){st.best.easy=num(s.easy);st.best.hard=num(s.hard);st.sound=s.sound!==false;if(s.mode==='hard')st.mode='hard';}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({easy:st.best.easy,hard:st.best.hard,sound:st.sound,mode:st.mode}));}catch(e){}}
// 소리: AudioContext는 사용자가 누를 때만 만든다
var ac=null;
function audio(){if(!st.sound)return null;if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(ac.state==='suspended'){try{ac.resume();}catch(e){}}return ac;}
function tone(f,ms,type){var a=ac&&st.sound?ac:null;if(!a)return;try{var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.28,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+ms/1000+0.05);}catch(e){}}
function n(){return st.mode==='hard'?6:4;}
function wait(ms){return new Promise(function(r){setTimeout(r,ms*st.speed);});}
function setPhase(p){st.phase=p;document.body.setAttribute('data-phase',p);}
function msg(t){$('msg').textContent=t;}
function padEl(i){return $('pads').children[i];}
function light(i,ms){var el=padEl(i);if(!el)return;el.classList.add('lit');tone(PADS[i].f,Math.max(160,ms));clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('lit');},ms*st.speed);}
function buildPads(){
  var box=$('pads');box.textContent='';box.className=st.mode==='hard'?'hard':'';
  for(var i=0;i<n();i++){var p=PADS[i],b=document.createElement('button');b.type='button';b.className='pad';b.setAttribute('data-i',i);
    b.style.setProperty('--c',p.c);b.style.setProperty('--d',p.d);b.style.setProperty('--i',i);
    b.setAttribute('aria-label',(i+1)+'번 '+p.n+' 패드');
    var e=document.createElement('span');e.className='e';e.textContent=p.e;var t=document.createElement('span');t.className='n';t.textContent=p.n;
    b.appendChild(e);b.appendChild(t);b.addEventListener('click',(function(k){return function(){audio();press(k);};})(i));box.appendChild(b);}
  $('mEasy').classList.toggle('on',st.mode==='easy');$('mHard').classList.toggle('on',st.mode==='hard');
  $('bestMode').textContent=st.mode==='hard'?'어려움':'보통';
}
function renderScore(){$('lvl').textContent=st.seq.length;$('cur').textContent=Math.max(0,st.phase==='over'||st.phase==='replay'?st.seq.length-1:st.seq.length-(st.phase==='input'||st.phase==='show'?1:0));$('best').textContent=st.best[st.mode];}
function renderDots(){var d=$('dots');d.textContent='';if(st.phase!=='input'&&st.phase!=='wait')return;for(var i=0;i<st.seq.length;i++){var x=document.createElement('i');if(i<st.idx)x.className='ok';d.appendChild(x);}}
function renderSnd(){$('snd').textContent=st.sound?'🔊 소리 켜짐':'🔇 소리 꺼짐';$('snd').classList.toggle('on',!st.sound);}
function start(){
  audio();$('modal').classList.remove('on');
  st.run++;st.seq=[];st.idx=0;add();showSeq(st.run,true);
}
function add(){st.seq.push(Math.floor(rnd()*n()));}
async function showSeq(run,first){
  setPhase('show');st.idx=0;renderScore();renderDots();
  msg('👀 신호를 잘 보세요… ('+st.seq.length+'개)');
  await wait(first?600:350);
  var on=Math.max(260,560-st.seq.length*22),gap=Math.max(120,220-st.seq.length*6);
  for(var i=0;i<st.seq.length;i++){if(run!==st.run)return;light(st.seq[i],on);await wait(on+gap);}
  if(run!==st.run)return;
  setPhase('input');renderScore();renderDots();msg('👆 이제 내 차례! 같은 순서로 눌러요');
}
function press(i){
  if(st.phase==='idle'||st.phase==='over'){light(i,220);return;}
  if(st.phase!=='input')return;
  light(i,220);
  if(i===st.seq[st.idx]){
    st.idx++;renderDots();
    if(st.idx===st.seq.length)cleared();
  }else fail(i);
}
async function cleared(){
  var run=st.run,len=st.seq.length;setPhase('wait');
  var rec=len>st.best[st.mode];if(rec){st.best[st.mode]=len;save();}
  renderScore();$('cur').textContent=len;
  msg(rec?'🎉 '+len+'단계 성공! 새 최고 기록!':'✨ '+len+'단계 성공! 신호가 하나 늘어나요');
  setTimeout(function(){tone(784,120,'sine');},140*st.speed);setTimeout(function(){tone(1046,160,'sine');},260*st.speed);
  await wait(900);if(run!==st.run)return;
  add();showSeq(run,false);
}
async function fail(i){
  var run=st.run,miss=st.idx;setPhase('replay');renderScore();renderDots();
  var el=padEl(i);if(el){el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');}
  tone(130,380,'sawtooth');
  msg('😮 앗, 틀렸어요! 정답 순서를 다시 보여 줄게요');
  var chips=$('mChips');chips.textContent='';
  st.seq.forEach(function(k,j){var c=document.createElement('span');c.className='chip'+(j===miss?' miss':'');c.style.setProperty('--c',PADS[k].c);c.style.setProperty('--d',PADS[k].d);c.textContent=PADS[k].e;c.title=(j+1)+'번째: '+PADS[k].n;chips.appendChild(c);});
  await wait(700);
  for(var j=0;j<st.seq.length;j++){if(run!==st.run)return;light(st.seq[j],380);await wait(520);}
  if(run!==st.run)return;
  setPhase('over');renderScore();
  var score=st.seq.length-1,best=st.best[st.mode];
  $('mIcon').textContent=score>=8?'🏆':score>=4?'🚀':'🌟';
  $('mTitle').textContent=score+'단계까지 성공!';
  $('mSub').textContent=(st.mode==='hard'?'어려움':'보통')+' 모드 최고 기록 '+best+'단계 · '+(miss+1)+'번째 신호에서 틀렸어요';
  $('mNew').textContent='';if(score>0&&score===best){var b=document.createElement('span');b.className='newrec';b.textContent='🏅 최고 기록!';$('mNew').appendChild(b);}
  msg('🔁 다시 하기로 새 신호에 도전해요');
  $('modal').classList.add('on');
}
function setMode(m){if(st.mode===m&&st.phase==='idle')return;st.run++;st.mode=m;st.seq=[];st.idx=0;setPhase('idle');save();buildPads();renderScore();renderDots();$('modal').classList.remove('on');msg(m==='hard'?'🛸 어려움: 6개 패드(도레미솔라·높은 도)로 도전!':'🪐 보통: 4개 패드(도레미솔)로 도전!');}
$('start').addEventListener('click',start);
$('again').addEventListener('click',start);
$('mEasy').addEventListener('click',function(){setMode('easy');});
$('mHard').addEventListener('click',function(){setMode('hard');});
$('snd').addEventListener('click',function(){st.sound=!st.sound;save();renderSnd();if(st.sound){audio();tone(523.25,150,'sine');}});
document.addEventListener('keydown',function(e){var k=parseInt(e.key,10);if(k>=1&&k<=n()){audio();press(k-1);}else if((e.key==='Enter'||e.key===' ')&&(st.phase==='idle'||st.phase==='over')&&e.target===document.body){e.preventDefault();start();}});
buildPads();renderSnd();renderScore();
// 테스트용 훅
window.__test={seed:function(v){rnd=seeded(v);},speed:function(f){st.speed=f;},seq:function(){return st.seq.slice();},phase:function(){return st.phase;},press:press,state:function(){return{mode:st.mode,idx:st.idx,best:st.best[st.mode],sound:st.sound};}};
})();
</script>
</body>
</html>
