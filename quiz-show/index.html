<script>
/*CORE-START*/
// "문제|정답|보기1|보기2..." 형식 해석
function parseQuiz(text){
  const qs=[],errors=[];
  String(text).split(/\r?\n/).forEach((raw,ln)=>{
    const line=raw.replace(/\t/g,'|').trim();
    if(!line||line.startsWith('#'))return;
    const parts=line.split('|').map(s=>s.trim());
    const q=parts[0],ans=parts[1]||'',opts=parts.slice(2).filter(Boolean);
    if(!q||!ans){errors.push(`${ln+1}번째 줄: 문제와 정답이 모두 필요해요`);return;}
    if(opts.length>=2){
      let idx=opts.indexOf(ans);
      if(idx<0&&/^[1-9]$/.test(ans)&&+ans<=opts.length)idx=+ans-1;
      if(idx<0){const m=ans.replace(/[①②③④⑤⑥]/,c=>'①②③④⑤⑥'.indexOf(c)+1);if(/^[1-9]$/.test(m)&&+m<=opts.length)idx=+m-1;}
      if(idx<0){errors.push(`${ln+1}번째 줄: 정답 "${ans}"이(가) 보기에 없어요`);return;}
      qs.push({type:'mc',q,options:opts.slice(0,6),answer:opts[idx],correct:idx});
    }else if(/^[OoXx○×]$/.test(ans)){
      const o=/^[Oo○]$/.test(ans);
      qs.push({type:'ox',q,options:['O','X'],answer:o?'O':'X',correct:o?0:1});
    }else qs.push({type:'sa',q,options:[],answer:ans,correct:-1});
  });
  return {qs,errors};
}
// 공동 순위(1,1,3...)
function ranking(teams){
  const s=teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score||a.i-b.i);
  s.forEach((t,k)=>{t.rank=k&&t.score===s[k-1].score?s[k-1].rank:k+1;});
  return s;
}
const autoSec=type=>({ox:10,mc:15,sa:20})[type]||15;
/*CORE-END*/

const SAMPLE_NAME='샘플: 초등 상식·교과 15문제';

달은 스스로 빛을 낸다.|X
1미터(m)는 몇 센티미터(cm)일까요?|100cm
임진왜란 때 이순신 장군이 이끈, 거북 모양의 돌격선은?|거북선
오만 원권 지폐에 그려진 인물은?|신사임당|세종대왕|이황|신사임당|이이`;
const TCOL=['#ff5c8a','#3a86ff','#22b573','#ff9f1c','#9b5de5','#00bbf9','#f15bb5','#8ac926'];
const OCOL=['#e5484d','#3a6ff7','#e8a400','#1fa67a','#9b5de5','#00a3c4'];
const KEY='quiz-show-goldenbell-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let S=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.text)return s;}catch(e){}
  return {name:SAMPLE_NAME,text:SAMPLE,sec:0,sets:{},teams:Array.from({length:4},(_,i)=>({name:`${i+1}모둠`,score:0})),qi:0};
}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
let QS=parseQuiz(S.text).qs;
let phase='ready',left=0,total=0,tm=null,muted=localStorage.getItem(KEY+'-mute')==='1';

/* 소리 */
let AC=null;
function tone(f,d,type='sine',v=.08,when=0,slide){
  if(muted)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05);}catch(e){}
}
function noise(d,v=.08,when=0){
  if(muted)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const len=AC.sampleRate*d,b=AC.createBuffer(1,len,AC.sampleRate),x=b.getChannelData(0);
    for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*(1-i/len);
    const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g).connect(AC.destination);s.start(AC.currentTime+when);}catch(e){}
}
const sTick=hi=>hi?tone(1320,.12,'square',.05):tone(880,.06,'triangle',.07);
const sBuzz=()=>{tone(220,.5,'sawtooth',.07);tone(165,.5,'sawtooth',.06);};
const sReveal=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i===3?.45:.14,'triangle',.08,i*.1));
const sPlus=()=>tone(990,.12,'sine',.08,0,1480);
const sMinus=()=>tone(400,.15,'sine',.07,0,220);
const sStart=()=>{tone(660,.1,'square',.05);tone(990,.18,'square',.05,.1);};
function sDrum(n){for(let i=0;i<n;i++)noise(.07,.05+.05*i/n,i*.06);}

/* 화면 */
function renderBoard(){
  const r=ranking(S.teams),top=r[0].score;
  $('#board').innerHTML=S.teams.map((t,i)=>`<div class="team${top>0&&t.score===top?' lead':''}" style="--c:${TCOL[i]}" data-i="${i}">
    <div class="tn" contenteditable="true" spellcheck="false" data-i="${i}">${esc(t.name)}</div>
    <div class="ts">${t.score}</div>
    <div class="tb"><button class="m" data-d="-1" data-i="${i}" aria-label="${esc(t.name)} 1점 빼기">−</button><button data-d="1" data-i="${i}" aria-label="${esc(t.name)} 1점 더하기">+</button></div></div>`).join('');
}
function renderQ(anim){
  stopTimer();
  if(!QS.length){$('#qtext').textContent='문제가 없어요. ✏️ 문제 넣기를 눌러 주세요.';$('#qbody').innerHTML='';return;}
  S.qi=Math.min(Math.max(0,S.qi),QS.length-1);save();
  const q=QS[S.qi];phase='ready';
  $('#qno').textContent=S.qi+1;$('#qtot').textContent=QS.length;
  const tb=$('#qtype');tb.className='badge '+q.type;tb.textContent={ox:'OX 퀴즈',mc:`${q.options.length}지선다`,sa:'단답형'}[q.type];
  $('#dots').innerHTML=QS.map((_,i)=>`<i class="${i<S.qi?'done':i===S.qi?'now':''}"></i>`).join('');
  const qt=$('#qtext');qt.textContent=q.q;if(anim){qt.classList.remove('in');void qt.offsetWidth;qt.classList.add('in');}
  if(q.type==='sa')$('#qbody').innerHTML=`<div class="ans" id="ans"><div class="flip"><div class="face front">❓ 정답은 화이트보드에!</div><div class="face back">${esc(q.answer)}</div></div></div>`;
  else $('#qbody').innerHTML=`<div class="opts ${q.type==='ox'?'ox':''}" id="opts">${q.options.map((o,i)=>`<div class="opt${i===q.correct?' right':''}" style="--c:${q.type==='ox'?(i?'#e5484d':'#1fa6d8'):OCOL[i]}">${q.type==='ox'?esc(o==='O'?'⭕':'❌'):`<span class="no">${i+1}</span>${esc(o)}`}</div>`).join('')}</div>`;
  total=left=S.sec||autoSec(q.type);drawTimer();
  $('#bStart').disabled=false;$('#bStart').textContent='▶ 시작';$('#bReveal').disabled=false;
  $('#bPrev').disabled=S.qi===0;
  const last=S.qi===QS.length-1;const n=$('#bNext');n.textContent=last?'🏆 순위':'다음 →';n.classList.toggle('rk',last);
}
function drawTimer(){
  const c=2*Math.PI*52,el=$('#timer');
  $('#ring').style.strokeDashoffset=c*(1-left/total);
  $('#ring').style.stroke=left<=3&&phase==='run'?'#ff6b6b':'#ffc83d';
  el.classList.toggle('warn',phase==='run'&&left<=3);
  el.classList.toggle('up',phase==='up');
  $('#tnum').textContent=phase==='up'?'시간 끝!':left;
}
function startTimer(){
  if(phase!=='ready'||!QS.length)return;
  phase='run';sStart();$('#bStart').disabled=true;$('#bStart').textContent='⏳ 생각 중…';
  tm=setInterval(()=>{
    left--;
    if(left<=0){left=0;phase='up';stopTimer();sBuzz();drawTimer();return;}
    sTick(left<=3);drawTimer();
  },1000);
  drawTimer();
}
function stopTimer(){clearInterval(tm);tm=null;}
function reveal(){
  if(!QS.length||phase==='shown')return;
  stopTimer();phase='shown';sReveal();
  const o=$('#opts'),a=$('#ans');if(o)o.classList.add('revealed');if(a)a.classList.add('revealed');
  $('#bStart').disabled=true;$('#bReveal').disabled=true;$('#tnum').textContent='✓';$('#timer').classList.remove('warn','up');
  burst(innerWidth*.4,innerHeight*.55,14);
}
function go(d){
  if(d>0&&S.qi>=QS.length-1){showRank();return;}
  S.qi+=d;renderQ(true);
}
function addScore(i,d,ev){
  S.teams[i].score=Math.max(-99,S.teams[i].score+d);save();renderBoard();
  const el=document.querySelector(`.team[data-i="${i}"]`);if(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
  d>0?sPlus():sMinus();
  if(ev){const f=document.createElement('div');f.className='float'+(d<0?' neg':'');f.textContent=d>0?'+1':'−1';f.style.left=ev.clientX+'px';f.style.top=ev.clientY+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),900);}
}

/* 순위 발표 */
let rankTimers=[];
function showRank(){
  stopTimer();rankTimers.forEach(clearTimeout);rankTimers=[];
  const r=ranking(S.teams),max=Math.max(1,...r.map(t=>t.score));
  // 시상대 배치: 1위 가운데
  const order=[];r.forEach((t,k)=>{k%2?order.unshift(t):order.push(t);});
  $('#podium').innerHTML=order.map(t=>{
    const h=Math.max(14,Math.round(70*Math.max(0,t.score)/max))+(t.rank===1?18:0);
    return `<div class="pcol" data-r="${t.rank}" data-k="${r.indexOf(t)}"><div class="pn">${esc(t.name)}</div><div class="pp">${t.score}점</div>
      <div class="bar" style="--c:${TCOL[t.i]};height:${h}%">${t.rank===1?'🥇':t.rank===2?'🥈':t.rank===3?'🥉':t.rank}</div></div>`;}).join('');
  $('#rank').classList.add('on');
  const cols=[...document.querySelectorAll('.pcol')].sort((a,b)=>b.dataset.k-a.dataset.k);
  cols.forEach((c,j)=>{
    const isTop=c.dataset.r==='1';
    rankTimers.push(setTimeout(()=>{
      if(isTop){if(j===cols.findIndex(x=>x.dataset.r==='1')){sDrum(18);rankTimers.push(setTimeout(reveal1,1150));}}
      else{c.classList.add('show');tone(500+j*80,.15,'triangle',.07);}
    },600+j*800));
  });
  function reveal1(){document.querySelectorAll('.pcol[data-r="1"]').forEach(x=>x.classList.add('show'));sReveal();confetti();}
}
$('#rClose').onclick=()=>{$('#rank').classList.remove('on');stopConfetti();};
$('#rAgain').onclick=()=>{S.teams.forEach(t=>t.score=0);S.qi=0;save();$('#rank').classList.remove('on');stopConfetti();renderBoard();renderQ(true);};

/* 색종이 */
const cv=$('#cf'),cx=cv.getContext('2d');let parts=[],raf=0;
function sizeCv(){cv.width=innerWidth;cv.height=innerHeight;}
function confetti(){
  sizeCv();
  for(let i=0;i<220;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*3.5,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,w:6+Math.random()*8,h:4+Math.random()*6,c:TCOL[i%8]});
  if(!raf)loop();
}
function burst(x,y,n){sizeCv();for(let i=0;i<n*4;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:0,vr:.2,w:7,h:5,c:TCOL[i%8]});}if(!raf)loop();}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.y<cv.height+30);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.99;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));cx.restore();}
  raf=parts.length?requestAnimationFrame(loop):0;
}
function stopConfetti(){parts=[];}

/* 편집 */
function openEdit(){
  $('#src').value=S.text;$('#sname').value=S.name;
  $('#teams').innerHTML=[2,3,4,5,6,7,8].map(n=>`<option value="${n}"${n===S.teams.length?' selected':''}>${n}모둠</option>`).join('');
  $('#sec').value=String(S.sec||0);renderSets();check();$('#modal').classList.add('on');
}
function renderSets(){
  const names=Object.keys(S.sets);
  $('#sets').innerHTML=names.length?names.map(n=>`<li><span title="${esc(n)}">📁 ${esc(n)}</span><button data-load="${esc(n)}">열기</button><button data-del="${esc(n)}">🗑</button></li>`).join(''):'<li style="color:#999">아직 없어요. 💾 세트 저장을 눌러 보세요.</li>';
}
function check(){
  const {qs,errors}=parseQuiz($('#src').value);
  const c={ox:0,mc:0,sa:0};qs.forEach(q=>c[q.type]++);
  $('#chk').innerHTML=`✅ ${qs.length}문제 인식 (OX ${c.ox} · 보기 ${c.mc} · 단답 ${c.sa})`+(errors.length?`<br><span class="bad">⚠ ${errors.slice(0,3).map(esc).join(' / ')}${errors.length>3?' …':''}</span>`:'');
  return qs;
}
$('#src').addEventListener('input',check);
$('#src').addEventListener('paste',()=>setTimeout(()=>{$('#src').value=$('#src').value.replace(/\t/g,'|');check();},0));
$('#mSample').onclick=()=>{$('#src').value=SAMPLE;$('#sname').value=SAMPLE_NAME;check();};
$('#mSave').onclick=()=>{const n=$('#sname').value.trim()||'이름 없는 세트';S.sets[n]=$('#src').value;save();renderSets();};
$('#sets').addEventListener('click',e=>{
  const l=e.target.dataset.load,d=e.target.dataset.del;
  if(l!=null){$('#src').value=S.sets[l];$('#sname').value=l;check();}
  if(d!=null&&confirm(`"${d}" 세트를 지울까요?`)){delete S.sets[d];save();renderSets();}
});
$('#mClose').onclick=()=>$('#modal').classList.remove('on');
$('#mApply').onclick=()=>{
  const qs=check();if(!qs.length){alert('인식된 문제가 없어요. 형식을 확인해 주세요.');return;}
  S.text=$('#src').value;S.name=$('#sname').value.trim()||'나의 퀴즈';S.sec=+$('#sec').value;
  const n=+$('#teams').value;
  S.teams=Array.from({length:n},(_,i)=>S.teams[i]?{...S.teams[i],score:0}:{name:`${i+1}모둠`,score:0});
  S.qi=0;QS=qs;save();$('#modal').classList.remove('on');$('#setName').textContent=S.name;renderBoard();renderQ(true);
};

/* 이벤트 */
$('#edit').onclick=openEdit;
$('#bStart').onclick=startTimer;
$('#bReveal').onclick=reveal;
$('#bNext').onclick=()=>go(1);
$('#bPrev').onclick=()=>go(-1);
$('#board').addEventListener('click',e=>{const b=e.target.closest('button[data-d]');if(b)addScore(+b.dataset.i,+b.dataset.d,e);});
$('#board').addEventListener('input',e=>{const t=e.target.closest('.tn');if(t){S.teams[+t.dataset.i].name=t.textContent.trim().slice(0,12)||`${+t.dataset.i+1}모둠`;save();}});
$('#board').addEventListener('keydown',e=>{if(e.target.closest('.tn')&&e.key==='Enter'){e.preventDefault();e.target.blur();}});
$('#board').addEventListener('focusout',e=>{if(e.target.closest('.tn'))renderBoard();});
$('#mute').onclick=()=>{muted=!muted;localStorage.setItem(KEY+'-mute',muted?'1':'0');$('#mute').textContent=muted?'🔇':'🔊';};
$('#full').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});};
document.addEventListener('keydown',e=>{
  if($('#modal').classList.contains('on')||e.target.closest('[contenteditable],input,textarea,select'))return;
  if(e.key===' '){e.preventDefault();phase==='ready'?startTimer():reveal();}
  else if(e.key==='ArrowRight'){if($('#rank').classList.contains('on'))return;go(1);}
  else if(e.key==='ArrowLeft'){if(S.qi>0)go(-1);}
  else if(e.key==='Escape'){$('#rank').classList.remove('on');stopConfetti();}
});
addEventListener('resize',()=>{if(raf)sizeCv();});

$('#mute').textContent=muted?'🔇':'🔊';
$('#setName').textContent=S.name;
renderBoard();renderQ(false);
</script>
</body>
</html>
