<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- csp:auto --><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><!-- /csp:auto -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로봇 길찾기 코딩 - 블록을 쌓아 로봇을 깃발까지</title>
<meta name="description" content="앞으로·돌기·반복 블록을 순서대로 쌓아 로봇을 깃발까지 보내는 코딩 체험. 보석·바위, 한 단계씩 실행, 8개 레벨, 최소 블록 별점.">
<style>
  :root{--bg:#eef6ff;--card:#fff;--ink:#1f2a3c;--sub:#607089;--line:#d8e4f3;--pri:#3b6cf6;--pri2:#e2eaff;--g:#22a663;--r:#e14c4c;--o:#ff9f1c;--p:#8b5cf6}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:2px solid var(--line);flex-wrap:wrap}
  .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#3b6cf6,#22c1c3);display:grid;place-items:center;font-size:26px;flex-shrink:0}
  header>div:nth-child(2){min-width:0}
  header h1{margin:0;font-size:24px}
  header small{display:block;color:var(--sub);font-size:13px}
  .levels{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
  .lv{border:2px solid var(--line);background:#fff;font:inherit;font-weight:900;font-size:15px;width:52px;height:46px;border-radius:12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0}
  .lv small{font-size:10px;letter-spacing:-1px;color:#f5a623;min-height:11px}
  .lv.on{border-color:var(--pri);background:var(--pri);color:#fff}
  .lv.on small{color:#fff3b0}
  .btn{border:0;font:inherit;font-weight:800;font-size:16px;padding:10px 14px;border-radius:12px;cursor:pointer;background:var(--pri2);color:var(--pri);white-space:nowrap}
  .btn.pri{background:var(--pri);color:#fff}
  .btn.g{background:var(--g);color:#fff}
  .btn.ghost{background:#eef2f8;color:var(--sub)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.demo{font-size:15px;padding:7px 12px;margin-left:6px;vertical-align:middle;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .demotag{font-size:11px;font-weight:800;background:#fff3c4;color:#8a5a00;border-radius:99px;padding:2px 8px;margin-left:4px}
  .btn:active:not(:disabled){transform:scale(.97)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;padding:14px 20px}
  .panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px}
  /* 보드 */
  .left{display:flex;flex-direction:column;gap:10px;min-width:0}
  .mission{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mission h2{margin:0;font-size:20px}
  .mission .goal{font-size:15px;font-weight:700;color:var(--sub)}
  .boardWrap{flex:1;display:grid;place-items:center;min-height:0}
  #board{position:relative;display:grid;gap:4px;padding:8px;background:#7cc576;border-radius:16px;box-shadow:inset 0 0 0 4px #5aa955;touch-action:manipulation}
  .cell{border-radius:8px;background:#a6dc8f;display:grid;place-items:center;position:relative}
  .cell:nth-child(odd){background:#9ed586}
  .cell .o{font-size:calc(var(--cs)*.62);line-height:1}
  .cell.rock{background:#8fc27a}
  .cell.got .o{opacity:.15;transform:scale(.6);transition:.3s}
  .cell.trail:after{content:"";position:absolute;width:22%;height:22%;border-radius:50%;background:rgba(255,255,255,.75)}
  #robot{position:absolute;left:0;top:0;display:grid;place-items:center;transition:transform .38s ease;z-index:3;pointer-events:none}
  #robot .bot{font-size:calc(var(--cs)*.66);line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
  #robot .dir{position:absolute;inset:-2px;transition:transform .3s}
  #robot .dir:before{content:"";position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:9px solid transparent;border-bottom:13px solid var(--o);border-top:0}
  #robot.crash .bot{animation:sh .45s}
  @keyframes sh{20%{transform:translateX(-7px) rotate(-12deg)}60%{transform:translateX(7px) rotate(12deg)}}
  .msg{font-size:18px;font-weight:800;min-height:48px;padding:10px 14px;border-radius:14px;background:#f4f7fc;display:flex;align-items:center}
  .msg.ok{background:#e3f7ec;color:#137a43}.msg.no{background:#fdecec;color:#b22d2d}
  /* 블록 */
  .right{display:flex;flex-direction:column;gap:12px;min-width:0}
  .palette{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .blk{border:0;font:inherit;font-weight:900;font-size:16px;color:#fff;border-radius:14px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .blk .i{font-size:28px;line-height:1}
  .blk:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .blk:disabled{filter:grayscale(1);opacity:.45;cursor:default}
  .tF{background:#3b6cf6}.tL{background:#8b5cf6}.tR{background:#d946ef}.tP{background:#ff9f1c}
  .ptitle{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px}
  .ptitle .cnt{margin-left:auto;font-size:15px;color:var(--sub)}
  #prog{min-height:150px;max-height:calc(100vh - 470px);overflow:auto;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;padding:10px;border-radius:14px;background:#f4f7fc;border:2px dashed #c9d6ea}
  #prog .ph{color:#93a3bb;font-weight:700;font-size:15px;margin:auto}
  .chip{border:0;font:inherit;font-weight:900;color:#fff;border-radius:11px;padding:7px 10px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;position:relative}
  .chip .i{font-size:20px}
  .chip.run{outline:4px solid #ffd43b;outline-offset:1px;transform:scale(1.08)}
  .rep{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;background:#fff1dc;border:3px solid var(--o);border-radius:14px;padding:6px 8px}
  .rep.open{box-shadow:0 0 0 4px #ffe0b0;border-style:dashed}
  .rep .rh{display:inline-flex;align-items:center;gap:5px;font-weight:900;color:#b06400;font-size:15px}
  .rep .n{border:0;font:inherit;font-weight:900;background:var(--o);color:#fff;border-radius:8px;padding:3px 9px;font-size:16px;cursor:pointer}
  .rep .body{display:inline-flex;flex-wrap:wrap;gap:5px;min-width:40px;min-height:36px;align-items:center}
  .rep .x{border:0;background:transparent;color:#b06400;font-size:18px;cursor:pointer;padding:0 2px}
  .rep .close{border:0;font:inherit;font-weight:800;font-size:13px;background:var(--o);color:#fff;border-radius:8px;padding:4px 8px;cursor:pointer}
  .rep .empty{color:#c58a3a;font-size:13px;font-weight:700}
  .runbar{display:flex;gap:8px;flex-wrap:wrap}
  .runbar .btn{flex:1}
  .stars{font-size:15px;color:var(--sub);font-weight:700}
  /* 성공 창 */
  .modal{position:fixed;inset:0;background:rgba(20,30,50,.45);display:none;place-items:center;z-index:20;padding:16px}
  .modal.on{display:grid}
  .box{background:#fff;border-radius:24px;padding:26px 30px;text-align:center;max-width:420px;width:100%;animation:pop .35s}
  @keyframes pop{0%{transform:scale(.7);opacity:0}}
  .box .st{font-size:56px;letter-spacing:4px}
  .box h2{margin:6px 0;font-size:26px}
  .box p{color:var(--sub);font-size:16px;margin:6px 0 16px}
  .conf{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:fall linear forwards;z-index:30}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  footer{text-align:right;padding:0 20px 10px;font-size:13px}
  footer a{color:var(--sub);text-decoration:none}
  footer a:hover{color:var(--pri)}
  @media (max-width:860px){
    header{padding:8px 12px} header h1{font-size:20px}
    .levels{margin-left:0;width:100%}
    .lv{width:auto;flex:1;height:42px}
    main{grid-template-columns:1fr;padding:10px}
    .blk{font-size:13px;padding:8px 4px}
    .blk .i{font-size:24px}
    #prog{max-height:none;min-height:110px}
    #palHint{display:none}
  }
</style>

<body>
<header>
  <div class="logo">🤖</div>
  <div><h1>로봇 길찾기 코딩</h1><small>블록을 순서대로 쌓아 로봇을 깃발까지 보내요</small></div>
  <nav class="levels" id="levels"></nav>
</header>
<main>
  <section class="panel left">
    <div class="mission"><h2 id="lvTitle"></h2><span class="goal" id="lvGoal"></span></div>
    <div class="boardWrap" id="boardWrap"><div id="board"></div></div>
    <div class="msg" id="msg"></div>
  </section>
  <section class="right">
    <div class="panel">
      <div class="ptitle" style="margin-bottom:8px">🧱 블록 고르기 <span class="cnt" id="palHint">누르면 아래에 차례로 쌓여요</span></div>
      <div class="palette">
        <button class="blk tF" data-t="F"><span class="i">⬆️</span>앞으로</button>
        <button class="blk tL" data-t="L"><span class="i">↶</span>왼쪽 돌기</button>
        <button class="blk tR" data-t="R"><span class="i">↷</span>오른쪽 돌기</button>
        <button class="blk tP" data-t="P" id="repBtn"><span class="i">🔁</span>반복</button>
      </div>
    </div>
    <div class="panel" style="display:flex;flex-direction:column;gap:10px;flex:1">
      <div class="ptitle">📜 내 프로그램 <span class="cnt" id="cnt"></span></div>
      <div id="prog"></div>
      <div class="stars" id="starInfo"></div>
      <div class="runbar">
        <button class="btn g" id="run">▶ 실행</button>
        <button class="btn" id="step">⏭ 한 단계씩</button>
        <button class="btn ghost" id="reset">↺ 처음 자리</button>
        <button class="btn ghost" id="clear">🗑 모두 지우기</button>
      </div>
    </div>
  </section>
</main>
<footer><a href="../">← 전체 데모 보기</a></footer>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script>
/* 맵 기호: S 출발 · F 깃발 · G 보석 · # 바위 · T 나무 · . 길
   dir: 0 위, 1 오른쪽, 2 아래, 3 왼쪽 / par: 최소 블록 수(완전 탐색으로 확인) */
const LEVELS=[
  {name:'첫걸음',dir:1,rep:0,par:3,map:['T....','S..F.','..T..'],tip:'⬆️ 앞으로 블록을 3번 쌓아 보세요.'},
  {name:'모퉁이 돌기',dir:1,rep:0,par:6,map:['..F.','T...','...T','S...'],tip:'로봇은 바라보는 쪽으로만 가요. 돌기 블록으로 방향을 바꿔요.'},
  {name:'바위 피하기',dir:1,rep:0,par:5,map:['#....','..GF.','.S#.T'],tip:'💎 보석을 먼저 모아야 깃발이 열려요.'},
  {name:'반복 블록 등장',dir:1,rep:1,par:2,map:['#######','S.....F','#######'],tip:'🔁 반복 블록 안에 ⬆️를 넣고 숫자를 바꿔 보세요.'},
  {name:'보석 계단',dir:0,rep:1,par:5,map:['T...F','...G.','..G..','.G...','S...T'],tip:'계단 한 칸 = ⬆️ ↷ ⬆️ ↶ … 반복하면?'},
  {name:'네모 순찰',dir:0,rep:1,par:6,map:['G...G','.###.','.#T#.','.###.','S...F'],tip:'네모의 한 변을 가고 도는 것을 반복해요.'},
  {name:'번개 골짜기',dir:0,rep:1,par:6,map:['##.F','##G#','#..#','#G##','..##','.###','S###'],tip:'두 칸 위로, 한 칸 옆으로! 같은 모양이 되풀이돼요.'},
  {name:'보석 사냥',dir:1,rep:1,par:6,map:['##....','#F..G.','####.#','#..#.#','#..#.#','S...G#'],tip:'긴 길도 "가다가 돌기"의 반복일지 몰라요. 깃발에 닿으면 바로 멈춰요!'}
];
const DX=[0,1,0,-1], DY=[-1,0,1,0];
const ICON={F:'⬆️',L:'↶',R:'↷'}, NAME={F:'앞으로',L:'왼쪽',R:'오른쪽'};
const KEY='edu-expo-robot-path-v1';
const $=s=>document.querySelector(s);
let best={}; try{best=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
let L=0, prog=[], openRep=-1, st=null, runQ=null, timer=null, cs=64;

function starsFor(n,par){return n<=par?3:n<=par+2?2:1}
const blockCount=()=>prog.reduce((s,it)=>s+(it.t==='P'?1+it.b.length:1),0);

function renderLevels(){
  $('#levels').innerHTML=LEVELS.map((lv,i)=>`<button class="lv${i===L?' on':''}" data-l="${i}">${i+1}<small>${best[i]?'★'.repeat(best[i]):''}</small></button>`).join('');
}
$('#levels').onclick=e=>{const b=e.target.closest('.lv'); if(b){loadLevel(+b.dataset.l)}};

function initState(){
  const lv=LEVELS[L]; const s={x:0,y:0,d:lv.dir,got:new Set(),gems:0,trail:new Set(),done:false};
  lv.map.forEach((r,j)=>[...r].forEach((c,i)=>{if(c==='S'){s.x=i;s.y=j} if(c==='G')s.gems++; if(c==='F'){s.fx=i;s.fy=j}}));
  s.trail.add(s.x+','+s.y); return s;
}
function loadLevel(i){
  stopRun(); L=i; prog=[]; openRep=-1; runQ=null;
  const lv=LEVELS[L];
  $('#lvTitle').textContent=`레벨 ${L+1}. ${lv.name}`;
  const g=lv.map.join('').split('G').length-1;
  $('#lvGoal').textContent=g?`💎 ${g}개 모으고 🚩 깃발로!`:'🚩 깃발까지 가요!';
  $('#repBtn').disabled=!lv.rep;
  $('#palHint').textContent=lv.rep?'누르면 아래에 차례로 쌓여요':'🔁 반복은 레벨 4부터 열려요';
  renderLevels(); st=initState(); buildBoard(); renderProg(); setMsg('💡 '+lv.tip);
}
function buildBoard(){
  const lv=LEVELS[L], rows=lv.map.length, cols=lv.map[0].length;
  const wrap=$('#boardWrap'); const W=Math.max(220,wrap.clientWidth-20), H=innerWidth<860?W*1.1:Math.max(220,wrap.clientHeight-20);
  cs=Math.floor(Math.min((W-16)/cols-4,(H-16)/rows-4,96)); cs=Math.max(cs,36);
  const b=$('#board'); b.style.setProperty('--cs',cs+'px');
  b.style.gridTemplateColumns=`repeat(${cols},${cs}px)`; b.style.gridTemplateRows=`repeat(${rows},${cs}px)`;
  let h='';
  lv.map.forEach((r,j)=>[...r].forEach((c,i)=>{
    const o=c==='#'?'🪨':c==='T'?'🌳':c==='G'?'💎':c==='F'?'🚩':'';
    const k=i+','+j;
    h+=`<div class="cell${c==='#'||c==='T'?' rock':''}${st.got.has(k)?' got':''}${st.trail.has(k)&&!o?' trail':''}" data-k="${k}"><span class="o">${o}</span></div>`;
  }));
  h+=`<div id="robot" style="width:${cs}px;height:${cs}px"><span class="dir"></span><span class="bot">🤖</span></div>`;
  b.innerHTML=h; placeRobot(true);
}
let rot=0;
function placeRobot(instant){
  const r=$('#robot'); if(!r) return;
  if(instant){r.style.transition='none'; rot=st.d*90;}
  r.style.transform=`translate(${8+st.x*(cs+4)}px,${8+st.y*(cs+4)}px)`;
  r.querySelector('.dir').style.transform=`rotate(${rot}deg)`;
  if(instant){r.offsetWidth; r.style.transition=''}
}
function setMsg(t,cls=''){const m=$('#msg'); m.className='msg '+cls; m.innerHTML=t}

/* 프로그램 편집 */
document.querySelector('.palette').onclick=e=>{
  const b=e.target.closest('.blk'); if(!b||b.disabled) return; if(timer) return;
  resetRun();
  const t=b.dataset.t;
  if(t==='P'){ prog.push({t:'P',n:2,b:[]}); openRep=prog.length-1; }
  else if(openRep>=0) prog[openRep].b.push(t);
  else prog.push({t});
  renderProg();
};
function renderProg(active){
  const box=$('#prog');
  if(!prog.length){box.innerHTML='<span class="ph">👆 위의 블록을 눌러 여기에 쌓아요</span>'}
  else box.innerHTML=prog.map((it,i)=>{
    if(it.t!=='P') return chip(it.t,`${i}`,active);
    const body=it.b.map((t,j)=>chip(t,`${i}.${j}`,active)).join('')||'<span class="empty">블록을 넣어요</span>';
    return `<span class="rep${openRep===i?' open':''}" data-rep="${i}"><span class="rh">🔁<button class="n" data-n="${i}" title="횟수 바꾸기">${it.n}</button>번 반복</span><span class="body">${body}</span>${openRep===i?`<button class="close" data-close="${i}">반복 닫기 ✓</button>`:`<button class="x" data-del="${i}" title="반복 지우기">✕</button>`}</span>`;
  }).join('');
  const n=blockCount(), lv=LEVELS[L];
  $('#cnt').textContent=`블록 ${n}개`;
  $('#starInfo').innerHTML=`⭐ 최소 블록 <b>${lv.par}개</b>로 성공하면 ★★★ · ${lv.par+2}개 이하 ★★`;
  if(active){const el=box.querySelector('.chip.run'); if(el) el.scrollIntoView({block:'nearest'})}
}
const chip=(t,ref,active)=>`<button class="chip t${t}${active===ref?' run':''}" data-ref="${ref}" title="눌러서 빼기"><span class="i">${ICON[t]}</span>${NAME[t]}</button>`;
$('#prog').onclick=e=>{
  if(timer) return;
  const t=e.target;
  if(t.dataset.n!=null){const it=prog[+t.dataset.n]; it.n=it.n>=9?2:it.n+1; resetRun(); return renderProg()}
  if(t.dataset.close!=null){openRep=-1; return renderProg()}
  if(t.dataset.del!=null){prog.splice(+t.dataset.del,1); openRep=-1; resetRun(); return renderProg()}
  const c=t.closest('.chip');
  if(c){ const [i,j]=c.dataset.ref.split('.').map(Number);
    if(j==null){prog.splice(i,1); if(openRep>i) openRep--; else if(openRep===i) openRep=-1;}
    else prog[i].b.splice(j,1);
    resetRun(); return renderProg(); }
  const r=t.closest('.rep'); if(r){openRep=+r.dataset.rep; renderProg()}
};
$('#clear').onclick=()=>{stopRun(); prog=[]; openRep=-1; resetRun(); renderProg(); setMsg('💡 '+LEVELS[L].tip)};

/* 실행 */
function flatten(){const q=[]; prog.forEach((it,i)=>{ if(it.t==='P'){for(let k=0;k<it.n;k++) it.b.forEach((t,j)=>q.push({t,ref:`${i}.${j}`,k}))} else q.push({t:it.t,ref:`${i}`}) }); return q}
function resetRun(){ stopRun(); runQ=null; st=initState(); buildBoard(); renderProg(); }
function stopRun(){ if(timer){clearInterval(timer); timer=null} toggleBtns(false) }
function toggleBtns(running){ ['#step','#clear','#reset'].forEach(s=>$(s).disabled=running); $('#run').textContent=running?'⏸ 멈춤':'▶ 실행' }
function stepOnce(){
  if(!runQ){ runQ=flatten(); runQ.i=0; st=initState(); buildBoard();
    if(!runQ.length){ setMsg('먼저 블록을 쌓아 주세요! 👆','no'); runQ=null; return false } }
  if(st.done) return false;
  if(runQ.i>=runQ.length){ endCheck(); return false }
  const s=runQ[runQ.i++];
  renderProg(s.ref);
  if(s.t==='L'){st.d=(st.d+3)%4; rot-=90}
  else if(s.t==='R'){st.d=(st.d+1)%4; rot+=90}
  else{
    const nx=st.x+DX[st.d], ny=st.y+DY[st.d], lv=LEVELS[L];
    const out=ny<0||ny>=lv.map.length||nx<0||nx>=lv.map[0].length, c=out?'#':lv.map[ny][nx];
    if(out||c==='#'||c==='T'){
      st.done=true; const r=$('#robot'); r.classList.remove('crash'); r.offsetWidth; r.classList.add('crash');
      setMsg(out?'🚧 앗! 길 밖으로는 갈 수 없어요. 블록을 고쳐 보세요.':`💥 ${c==='T'?'나무':'바위'}에 부딪혔어요! 노란 테두리 블록을 확인해요.`,'no'); stopRun(); return false;
    }
    st.x=nx; st.y=ny; const k=nx+','+ny; st.trail.add(k);
    const cell=document.querySelector(`.cell[data-k="${k}"]`);
    if(c==='G'&&!st.got.has(k)){st.got.add(k); cell.classList.add('got')} else if(c==='.'||c==='S') cell.classList.add('trail');
    if(nx===st.fx&&ny===st.fy&&st.got.size===st.gems){ placeRobot(); st.done=true; const lvAt=L, stAt=st; setTimeout(()=>{ if(L===lvAt&&st===stAt) win() },420); stopRun(); return false }
  }
  placeRobot();
  setMsg(`${runQ.i} / ${runQ.length} 단계 실행 중… ${s.k!=null?`(반복 ${s.k+1}번째)`:''}`);
  if(runQ.i>=runQ.length){ const stAt=st; setTimeout(()=>{ if(st===stAt) endCheck() },400); return false }
  return true;
}
function endCheck(){
  if(st.done) return; st.done=true; stopRun();
  if(st.x===st.fx&&st.y===st.fy) setMsg(`💎 보석을 다 모아야 깃발이 열려요! (${st.got.size}/${st.gems})`,'no');
  else setMsg('🤔 프로그램이 끝났는데 깃발에 도착하지 못했어요. 블록을 더하거나 고쳐 보세요.','no');
}
$('#run').onclick=()=>{
  if(timer){stopRun(); setMsg('⏸ 멈췄어요. ▶ 실행으로 이어서 하거나 ⏭ 한 단계씩 볼 수 있어요.'); return}
  if(runQ&&st.done) runQ=null;
  toggleBtns(true);
  if(!stepOnce()){ if(!timer) toggleBtns(false); return }
  timer=setInterval(()=>{ if(!stepOnce()) stopRun() },480);
};
$('#step').onclick=()=>{ if(runQ&&st.done) runQ=null; stepOnce() };
$('#reset').onclick=()=>{ resetRun(); setMsg('↺ 로봇이 처음 자리로 돌아왔어요.') };

function win(){
  const n=blockCount(), lv=LEVELS[L], s=starsFor(n,lv.par);
  best[L]=Math.max(best[L]||0,s); try{localStorage.setItem(KEY,JSON.stringify(best))}catch(e){}
  renderLevels();
  setMsg(`🎉 성공! 블록 ${n}개 사용`,'ok');
  const last=L===LEVELS.length-1;
  $('#mbox').innerHTML=`<div class="st">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><h2>레벨 ${L+1} 성공!</h2><p>블록 ${n}개로 해냈어요. ${s<3?`최소 ${lv.par}개로도 할 수 있어요! ${lv.rep?'🔁 반복을 써 볼까요?':''}`:'최소 블록! 진짜 프로그래머예요 👏'}</p><div class="runbar"><button class="btn ghost" id="again">다시 하기</button>${last?'<button class="btn pri" id="first">처음 레벨로</button>':'<button class="btn pri" id="nextLv">다음 레벨 ▶</button>'}</div>`;
  $('#modal').classList.add('on');
  $('#again').onclick=()=>{$('#modal').classList.remove('on'); resetRun()};
  const nx=$('#nextLv')||$('#first'); nx.onclick=()=>{$('#modal').classList.remove('on'); loadLevel(last?0:L+1)};
  const em=['⭐','🎉','💎','✨','🤖'];
  for(let i=0;i<36;i++){const d=document.createElement('div');d.className='conf';d.textContent=em[i%em.length];d.style.left=Math.random()*100+'vw';d.style.animationDuration=(1.5+Math.random()*1.5)+'s';d.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}
}
let rz; window.addEventListener('resize',()=>{clearTimeout(rz); rz=setTimeout(()=>{ if(!timer) buildBoard() },120)});
// 첫 화면 예시 장면: 레벨 1에 ⬆️ 2개를 쌓아 두고 로봇이 2칸 간 모습(깃발까지 1칸 남음). [지우고 시작]으로 바로 비우기
function showDemo(){
  prog=[{t:"F"},{t:"F"}]; openRep=-1; runQ=null; st=initState();
  for(let i=0;i<2;i++){ st.x+=DX[st.d]; st.y+=DY[st.d]; st.trail.add(st.x+","+st.y); }
  buildBoard(); renderProg("1");
  $("#cnt").innerHTML="블록 2개 <span class=\"demotag\">예시</span>";
  setMsg("<span style=\"flex:1\">👀 <b>예시 장면</b>: ⬆️ 앞으로 2번 실행 — 깃발까지 한 칸 남았어요!</span><button class=\"btn g demo\" id=\"demoClear\">🧹 지우고 시작</button>");
  $("#demoClear").onclick=()=>$("#clear").onclick();
}
loadLevel(0); showDemo();
</script>
