<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#02030a}
  body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
  button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;pointer-events:none;z-index:3}
  header>*{pointer-events:auto}
  .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#ffb347,#ff5f6d);display:grid;place-items:center;font-size:24px;box-shadow:0 4px 0 #a8324a;flex-shrink:0}
  h1{margin:0;font-size:22px;letter-spacing:-.5px;text-shadow:0 2px 8px #000}
  h1 small{display:block;font-size:12px;color:#b9c3ee;font-weight:600}
  .hud{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .pill{background:rgba(10,14,40,.7);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:5px 12px;font-weight:800;color:#a9b4e0;font-size:13px;white-space:nowrap}
  .pill b{color:#fff;font-size:16px;margin-left:4px}
  .ib{border:1px solid rgba(255,255,255,.18);background:rgba(10,14,40,.7);border-radius:12px;padding:8px 11px;font-weight:800;font-size:14px}

  .ov{position:fixed;left:50%;transform:translateX(-50%);width:min(94%,470px);background:rgba(10,14,44,.88);border:2px solid rgba(255,255,255,.16);border-radius:22px;padding:18px;text-align:center;display:none;z-index:4;backdrop-filter:blur(4px)}
  .ov.on{display:block}
  #ready{bottom:9%}
  #result{top:50%;transform:translate(-50%,-50%);max-height:92%;overflow:auto}
  .ov h2{margin:0 0 6px;font-size:24px}
  .ov p{margin:6px 0;color:#d4dbf7;line-height:1.55;font-size:15px}
  .tips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;font-size:13px;color:#cfd7ff;text-align:left}
  .tips span{background:rgba(255,255,255,.07);border-radius:10px;padding:6px 9px}
  .go{border:0;border-radius:16px;background:linear-gradient(180deg,#ffd36b,#ff9a3c);color:#3a1a00;font-weight:900;font-size:19px;padding:12px 30px;box-shadow:0 5px 0 #b9631c;margin:6px 4px}
  .go:active{transform:translateY(3px);box-shadow:0 2px 0 #b9631c}
  .sub{border:0;border-radius:14px;background:rgba(255,255,255,.14);font-weight:800;padding:11px 18px;margin:6px 4px}
  #info{position:fixed;right:3%;top:50%;transform:translateY(-50%);width:min(360px,40%);background:rgba(8,12,40,.9);border:2px solid rgba(140,170,255,.3);border-radius:20px;padding:16px 18px;display:none;z-index:4;max-height:84%;overflow:auto}
  #info.on{display:block}
  #info h2{margin:0;font-size:26px}
  #info .where{color:#9fb0ea;font-size:13px;margin:2px 0 10px}
  .row{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px;line-height:1.45}
  .row b{font-size:16px;color:#fff}
  .row .cmp{color:#ffd36b;font-weight:800}
  .bar{position:relative;height:10px;border-radius:5px;margin-top:6px;background:linear-gradient(90deg,#3b6cff,#7ad0ff 40%,#ffe07a 70%,#ff5a3c)}
  .bar.day{background:linear-gradient(90deg,#2a3270,#8a6cff)}
  .bar i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:#fff;box-shadow:0 0 6px #fff}
  .bar i.e{background:#4dff9c;box-shadow:0 0 6px #4dff9c}
  .sizes{display:flex;align-items:flex-end;gap:14px;justify-content:center;margin-top:6px;height:96px}
  .sizes div{border-radius:50%;flex-shrink:0}
  .sizes small{display:block;font-size:11px;color:#9fb0ea;text-align:center}
  .fact{color:#dfe5ff;font-size:14px;line-height:1.55;margin:8px 0}
  #stamp,#next{width:100%;margin:6px 0 0}
  #stamp:disabled{opacity:.5}
  #boost{position:fixed;right:4%;bottom:8%;width:84px;height:84px;border-radius:50%;border:0;font-weight:900;font-size:15px;color:#3a1600;background:radial-gradient(circle at 40% 35%,#ffe29a,#ff8a2a);box-shadow:0 5px 0 rgba(0,0,0,.4);display:none;z-index:3}
  #boost.on{display:block}
  #rStamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .st{border:2px dashed rgba(255,255,255,.25);border-radius:14px;padding:8px 2px;font-size:12px;color:#8892c0}
  .st i{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto 4px;opacity:.25}
  .st.got{border-style:solid;border-color:#ffd36b;color:#fff;background:rgba(255,211,107,.1)}
  .st.got i{opacity:1}
  .sum{text-align:left;font-size:14px;color:#d4dbf7;background:rgba(255,255,255,.06);border-radius:12px;padding:8px 12px;line-height:1.7}
  .back{position:fixed;right:12px;bottom:8px;font-size:12px;color:#c8d0f5;text-decoration:none;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:99px;z-index:5}

  @media (max-width:760px){

    .logo{width:34px;height:34px;font-size:19px;border-radius:10px}

    .hud{order:3;width:100%;margin:0;gap:4px}
    .pill{padding:3px 8px;font-size:11px} .pill b{font-size:13px}
    .ib{padding:6px 8px;font-size:12px}
    .tools{margin-left:auto}
    #info{left:2%;right:2%;width:auto;top:auto;bottom:2%;transform:none;max-height:50%;padding:12px}
    #info h2{font-size:21px}
    .sizes{height:70px}
    .ov{padding:12px} .ov h2{font-size:20px}
    .tips{grid-template-columns:1fr;font-size:12px}
    #boost{width:70px;height:70px;font-size:13px;bottom:10%}
    #rStamps{gap:5px}
  }

<body>
<canvas id="cv" aria-label="우주선 창밖 풍경"></canvas>
<header>
  <div class="logo" aria-hidden="true">🪐</div>
  <h1>우주 산책<small>우주선 창밖으로 떠나는 태양계 1인칭 여행</small></h1>
  <div class="hud">
    <div class="pill">목적지<b id="dest">태양 옆</b></div>
    <div class="pill">위치<b id="au">0.00 AU</b></div>
    <div class="pill">도장<b><span id="stampN">0</span>/8</b></div>
    <div class="pill">시간<b id="timeT">0:00</b></div>
  </div>
  <div class="tools"><button class="ib" id="snd" aria-pressed="false">🔇 소리</button> <button class="ib" id="fs">⛶ 전체화면</button></div>
</header>
<div id="toast"></div>
<button id="boost" aria-label="부스터">🚀<br>부스터</button>
<div class="ov on" id="ready">
  <h2>🚀 태양계 8개 행성 탐사</h2>
  <p>창밖의 행성을 <b>가운데 조준선</b>에 맞추며 날아가요. 도착하면 크기·온도·하루 길이를 지구와 비교하고 <b>탐사 도장</b>을 찍어요.</p>
  <div class="tips"><span>⌨️ 방향키 / WASD 로 조종</span><span>📱 화면을 끌어서 조종</span><span>🚀 스페이스 = 부스터</span><span>🎯 조준이 맞아야 빨라져요</span></div>
  <p id="recLine">모은 도장 0/8</p>
  <button class="go" id="start">▶ 출발 (태양 → 수성)</button>
</div>
<div id="info" aria-live="polite">
  <h2 id="infoName">수성</h2>
  <div class="where" id="infoWhere"></div>
  <div class="row">📏 지름 <b id="iDia"></b> · <span class="cmp" id="iDiaC"></span><div class="sizes" id="iSizes"></div></div>
  <div class="row">🌡️ 평균 온도 <b id="iTemp"></b><div class="bar"><i class="e" id="iTempE"></i><i id="iTempM"></i></div></div>
  <div class="row">🌗 하루 길이(자전) <b id="iDay"></b> · <span class="cmp" id="iDayC"></span><div class="bar day"><i class="e" id="iDayE"></i><i id="iDayM"></i></div></div>
  <div class="row">🗓️ 1년(공전) <b id="iYear"></b></div>
  <p class="fact" id="iFact"></p>
  <button class="go" id="stamp">🔖 탐사 도장 찍기</button>
  <button class="go" id="next" hidden>다음 행성 ▶</button>
</div>
<div class="ov" id="result">
  <h2>🌌 태양계 여행 완료!</h2>
  <p id="rTime"></p>
  <div id="rStamps"></div>
  <div class="sum" id="rSum"></div>
  <button class="go" id="again">다시 여행</button><button class="sub" id="home">처음으로</button>
</div>
<a class="back" href="../">← 전체 데모 보기</a>
<script>
(() => {
'use strict';
const DT = 1 / 60, START_DIST = 100;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const KEY = 'edu-expo-space-walk-v1';
// 지름(km)·평균 온도(°C)·자전 주기(시간)·공전·태양 거리(AU): NASA 행성 자료
const P = [
  { n: '수성', dia: 4879, ratio: '0.38', temp: 167, dayH: 1407.6, day: '58.6일', year: '88일', au: 0.39, size: 0.15, c: ['#c9c2b8', '#7d7770'],
    fact: '태양과 가장 가까운 행성이에요. 공기가 거의 없어 낮엔 430°C, 밤엔 -180°C까지 오르내려요.' },
  { n: '금성', dia: 12104, ratio: '0.95', temp: 464, dayH: 5832.5, day: '243일', year: '225일', au: 0.72, size: 0.2, c: ['#f3dca0', '#c99a4e'],
    fact: '두꺼운 이산화탄소 대기가 열을 가둬 수성보다 더 뜨거워요. 다른 행성과 반대 방향으로 자전해요.' },
  { n: '지구', dia: 12756, ratio: '1', temp: 15, dayH: 23.93, day: '23시간 56분', year: '365일', au: 1, size: 0.21, c: ['#4f9bff', '#1d4fae'],
    fact: '액체 상태의 물이 있고 생명이 사는 우리 행성이에요. 옆에 보이는 달은 지름이 지구의 약 1/4이에요.' },
  { n: '화성', dia: 6792, ratio: '0.53', temp: -65, dayH: 24.62, day: '24시간 37분', year: '687일', au: 1.52, size: 0.17, c: ['#e2794a', '#8e3a1d'],
    fact: '흙 속 산화철(녹) 때문에 붉게 보여요. 태양계에서 가장 높은 화산인 올림푸스 산이 있어요.' },
  { n: '목성', dia: 142984, ratio: '11.2', temp: -110, dayH: 9.93, day: '9시간 56분', year: '11.9년', au: 5.2, size: 0.31, c: ['#e8c9a0', '#a8754c'],
    fact: '태양계에서 가장 큰 행성이에요. 지구보다 큰 폭풍 대적점이 수백 년째 불고 있어요.' },
  { n: '토성', dia: 120536, ratio: '9.45', temp: -140, dayH: 10.57, day: '10시간 34분', year: '29.5년', au: 9.54, size: 0.24, c: ['#f0dba6', '#b8955a'],
    fact: '얼음과 바위 조각으로 된 넓은 고리가 있어요. 평균 밀도가 물보다 낮아요.' },
  { n: '천왕성', dia: 51118, ratio: '4.01', temp: -195, dayH: 17.23, day: '17시간 14분', year: '84년', au: 19.2, size: 0.23, c: ['#a6eef0', '#4fa9bd'],
    fact: '자전축이 약 98° 누워 있어 옆으로 굴러가듯 돌아요. 대기의 메테인 때문에 청록색으로 보여요.' },
  { n: '해왕성', dia: 49528, ratio: '3.88', temp: -200, dayH: 16.1, day: '16시간 6분', year: '165년', au: 30.1, size: 0.23, c: ['#5b7cff', '#1f2f9e'],
    fact: '태양에서 가장 먼 행성이에요. 시속 2,000km가 넘는 태양계에서 가장 빠른 바람이 불어요.' }
];
const rec = { stamps: [], best: 0, trips: 0 };
try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && typeof r === 'object') {
  if (Array.isArray(r.stamps)) rec.stamps = [...new Set(r.stamps.map(Number).filter(i => Number.isInteger(i) && i >= 0 && i < 8))];
  rec.best = Math.max(0, Number(r.best) || 0); rec.trips = Math.max(0, Math.floor(Number(r.trips) || 0)); } } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) {} };

// ---- 소리 (누르기 전에는 만들지 않음) ----
let AC = null, master = null, engG = null, sound = false;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  for (const [f, v] of [[55, 0.05], [82.6, 0.035], [110.4, 0.02]]) { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(master); o.start(); }
  const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
  engG = AC.createGain(); engG.gain.value = 0; src.connect(lp); lp.connect(engG); engG.connect(master); src.start();
}
function setSound(on) {
  sound = on; $('#snd').textContent = on ? '🔊 소리' : '🔇 소리'; $('#snd').setAttribute('aria-pressed', String(on));
  if (on) initAudio();
  if (!AC) return;
  try { if (on && AC.state === 'suspended') AC.resume().catch(() => {}); master.gain.setTargetAtTime(on ? 0.9 : 0, AC.currentTime, 0.3); } catch (e) {}
}
function tone(f1, f2, dur, type, vol, delay) {
  if (!sound || !AC) return;
  try { const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05); } catch (e) {}
}
const sfx = { arrive: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.5, 'sine', 0.08, i * 0.12)), stamp: () => { tone(180, 60, 0.18, 'square', 0.12); tone(900, 1300, 0.2, 'triangle', 0.06, 0.1); },
  boost: () => tone(120, 600, 0.5, 'sawtooth', 0.05), end: () => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.6, 'triangle', 0.08, i * 0.15)) };

// ---- 화면 ----
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 1280, H = 720, DPR = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
const stars = Array.from({ length: 320 }, (_, i) => ({ x: Math.sin(i * 12.9898) * 1.6, y: Math.cos(i * 78.233) * 1.0, z: ((i * 0.618) % 1) * 0.95 + 0.05, c: i % 7 === 0 ? '#ffd9a8' : i % 5 === 0 ? '#a8c8ff' : '#fff' }));

// ---- 상태 ----
let phase = 'ready', idx = 0, dist = START_DIST, spd = 0, ox = 0, oy = 0, vx = 0, vy = 0, t = 0, trip = 0, stampsNow = [], stamped = false, sunT = 0, rot = 0, lastBoost = false, manual = false, view = 1.5;
let forced = null, toastT = 0;
const keys = { l: 0, r: 0, u: 0, d: 0, b: 0 }, joy = { on: false, id: -1, ox: 0, oy: 0, x: 0, y: 0 };
let boostHeld = false;
function input() {
  if (forced) return forced;
  let x = keys.r - keys.l, y = keys.d - keys.u;
  if (joy.on) { x += clamp((joy.x - joy.ox) / 60, -1, 1); y += clamp((joy.y - joy.oy) / 60, -1, 1); }
  return { x: clamp(x, -1, 1), y: clamp(y, -1, 1), boost: keys.b || boostHeld };
}
function toast(s) { const el = $('#toast'); el.textContent = s; el.classList.add('on'); toastT = 1.6; }
const align = () => clamp(1 - (Math.hypot(ox, oy) - 30) / 120, 0.15, 1);
function update() {
  t += DT; rot += DT;
  if (toastT > 0 && (toastT -= DT) <= 0) $('#toast').classList.remove('on');
  if (phase === 'fly') {
    trip += DT; sunT += DT;
    const inp = input();
    const ph = t * 0.9 + idx * 1.3, bx = Math.cos(idx * 2.1 + 0.5) * 26, by = Math.sin(idx * 2.1 + 0.5) * 22;
    const ax = Math.sin(ph) * 90 + Math.sin(t * 0.37 + idx) * 60 + bx, ay = Math.cos(ph * 1.1) * 70 + Math.sin(t * 0.29 + idx * 2) * 50 + by;
    vx += (ax - inp.x * 700 - vx * 1.2) * DT; vy += (ay - inp.y * 700 - vy * 1.2) * DT;
    ox += vx * DT; oy += vy * DT;
    const mx = W * 0.42, my = H * 0.38;
    if (Math.abs(ox) > mx) { ox = clamp(ox, -mx, mx); vx = 0; }
    if (Math.abs(oy) > my) { oy = clamp(oy, -my, my); vy = 0; }
    const b = !!inp.boost;
    if (b && !lastBoost) sfx.boost();
    lastBoost = b;
    const ts = (b ? 26 : 11) * align();
    spd += (ts - spd) * Math.min(1, 2.2 * DT);
    dist -= spd * DT;
    view = spd;
    if (dist <= 0) arrive();

$('#home').addEventListener('click', home);
$('#stamp').addEventListener('click', stamp);
$('#next').addEventListener('click', next);
$('#snd').addEventListener('click', () => setSound(!sound));
const fsOk = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
if (!fsOk) $('#fs').hidden = true;
$('#fs').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  try { if (d.fullscreenElement || d.webkitFullscreenElement) { const x = (d.exitFullscreen || d.webkitExitFullscreen).call(d); if (x && x.catch) x.catch(() => {}); }
    else { const x = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (x && x.catch) x.catch(() => {}); } } catch (e) {}
});
addEventListener('resize', resize);

window.__test = {
  manual: v => { manual = !!v; },
  step: (n = 1) => { for (let i = 0; i < n; i++) update(); hud(); },
  input: o => { forced = o ? { x: clamp(o.x || 0, -1, 1), y: clamp(o.y || 0, -1, 1), boost: !!o.boost } : null; },
  state: () => ({ phase, idx, target: phase === 'ready' ? '' : P[idx].n, dist, spd, ox, oy, vx, vy, align: align(), stamps: stampsNow.length, trip, sound,
    starSum: stars.reduce((a, s) => a + s.z, 0) }),
  start, home
};
resize(); hud();
for (let i = 0; i < 60; i++) update();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
