<style>
:root{--ink:#1f2a44;--sub:#5f6b85;--line:#e3e8f2}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff7ec;color:var(--ink);display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation}
header{display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#ffc04d,#ff6f3c);display:grid;place-items:center;font-size:26px;box-shadow:0 4px 0 #d9541f;flex-shrink:0}
h1{margin:0;font-size:24px;letter-spacing:-.5px}
header small{display:block;color:var(--sub);font-size:13px}
.modes{margin-left:auto;display:flex;gap:6px}
.md{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;font-weight:800;color:var(--ink)}
.md.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.md:disabled{opacity:.45;cursor:default}
.snd{border:0;background:#f0f2f8;border-radius:12px;padding:9px 12px;font-weight:800;color:var(--sub)}
main{flex:1;display:flex;padding:0 16px 4px;min-height:0}
.stage{position:relative;flex:1;min-height:360px;border-radius:22px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:#a9e0ff;box-shadow:0 6px 0 #ead2b6}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:7px;align-items:center;pointer-events:none;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.9);border-radius:99px;padding:4px 12px;font-weight:800;color:var(--sub);font-size:14px;white-space:nowrap}
.pill b{color:var(--ink);font-size:19px;margin-left:3px;display:inline-block}
.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.4)}}
#hearts{letter-spacing:1px;font-size:17px}
.tb{flex:1;min-width:70px;height:14px;background:rgba(255,255,255,.65);border-radius:99px;overflow:hidden}
.tb i{display:block;height:100%;background:linear-gradient(90deg,#2fbf7d,#9be15d);transform-origin:left}
.ib{pointer-events:auto;border:0;background:rgba(255,255,255,.95);border-radius:99px;width:42px;height:36px;font-size:16px}
.ib:disabled{opacity:.4;cursor:default}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px}
.ov.on{display:flex}
.ov.dim{background:rgba(20,30,50,.38)}
#ready{justify-content:flex-end;padding-right:5%}
.card{background:rgba(255,255,255,.96);border-radius:24px;padding:20px 24px;max-width:410px;width:100%;box-shadow:0 8px 0 rgba(0,0,0,.08);text-align:center}
.card h2{margin:0 0 4px;font-size:40px;letter-spacing:-1px;color:#ff6f3c;text-shadow:0 3px 0 #ffe0b8}
.card p{margin:4px 0;color:var(--sub);font-weight:700}
.how{list-style:none;padding:0;margin:12px 0;text-align:left;display:grid;gap:7px}
.how li{background:#f6f8fc;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}
.how b{color:#ff6f3c}
.big{border:0;background:linear-gradient(#ff8a3d,#ff6326);color:#fff;font-weight:900;font-size:22px;padding:13px 30px;border-radius:16px;box-shadow:0 5px 0 #c94a14;margin:6px 4px 0}

.big.alt{background:#eef1f8;color:var(--ink);box-shadow:0 5px 0 #c9d0e0}
.rscore{font-size:54px;font-weight:900;color:var(--ink);margin:4px 0}
.newrec{display:inline-block;background:#fff1b8;color:#9a6400;font-weight:900;border-radius:99px;padding:5px 14px;margin:4px 0}
.hint{position:absolute;right:12px;bottom:10px;background:rgba(31,42,68,.55);color:#fff;font-weight:700;font-size:13px;border-radius:99px;padding:5px 12px;pointer-events:none;transition:opacity .4s}
footer{text-align:right;padding:2px 20px 8px;font-size:13px}
footer a{color:var(--sub);text-decoration:none}
@media (max-width:700px){
  header{padding:8px 10px;gap:8px}
  h1{font-size:21px}

  .md{flex:1;padding:7px 4px;font-size:14px}
  main{padding:0 8px 4px}
  .stage{min-height:430px;max-height:150vw}
  header>div:nth-child(2){flex:1;min-width:0}

  .card h2{font-size:30px}
  .how li{font-size:13px;padding:6px 10px}
  .big{font-size:19px;padding:11px 22px}

  .hint{display:none}

<body>
<header>
  <div class="logo">🏃</div>
  <div><h1>폴짝 달리기</h1><small>꾹 누를수록 높이! 운동장 장애물 달리기</small></div>
  <nav class="modes">
    <button class="md" data-m="slow">🐢 천천히</button>
    <button class="md" data-m="fast">🐇 빠르게</button>
  </nav>
  <button class="snd" id="snd" aria-pressed="true" aria-label="소리 켜기/끄기">🔊 소리</button>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud" id="hud">
      <div class="pill" id="hearts">❤️❤️❤️</div>
      <div class="pill">거리<b id="dist">0</b>m</div>
      <div class="pill">🪙<b id="coins">0</b></div>
      <div class="pill">점수<b id="score">0</b></div>
      <div class="tb"><i id="tbar"></i></div>
      <div class="pill">🏆<b id="best">0</b></div>
      <button class="ib" id="pauseBtn" aria-label="잠깐 멈춤" disabled>⏸</button>
    </div>
    <div class="hint" id="hint">스페이스 · ↑ · 화면을 꾹 = 점프</div>
    <div class="ov on" id="ready">
      <div class="card">
        <h2>폴짝 달리기</h2>
        <p>75초 동안 운동장을 달려요!</p>
        <ul class="how">
          <li>⌨️ <b>스페이스·↑</b> 또는 👆 <b>화면 터치</b> = 점프</li>
          <li>⏫ <b>꾹 오래</b> 누르면 더 높이, 살짝 누르면 낮게</li>
          <li>🚧 콘·줄넘기·웅덩이를 넘고 🪙 코인을 모아요</li>
          <li>🪶 깃털을 먹으면 공중에서 <b>한 번 더</b> 점프!</li>
        </ul>
        <button class="big" id="start">▶ 달리기 시작</button>
      </div>
    </div>
    <div class="ov dim" id="paused">
      <div class="card"><h2>잠깐!</h2><p>쉬는 중이에요.</p><button class="big" id="resume">▶ 계속하기</button></div>
    </div>
    <div class="ov dim" id="result">
      <div class="card">
        <h2 id="rTitle">완주!</h2>
        <div class="rscore" id="rScore">0점</div>
        <p id="rStat"></p>
        <div class="newrec" id="newrec" hidden>🏆 새 최고 기록!</div>
        <div><button class="big" id="again">🔁 다시 하기</button><button class="big alt" id="home">🏠 처음으로</button></div>
      </div>
    </div>
  </div>
</main>
<footer><a href="../">← 전체 데모 보기</a></footer>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const KEY = 'edu-expo-jump-run-v1';
let store = null;
try { store = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!store || typeof store !== 'object') store = {};
if (!store.best || typeof store.best !== 'object') store.best = {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const bestOf = m => Math.max(0, Math.floor(+store.best[m] || 0));
let soundOn = store.sound !== false;

const MODES = { slow: { v0: 250, acc: 3.2, max: 520 }, fast: { v0: 330, acc: 4.4, max: 660 } };
let mode = Object.prototype.hasOwnProperty.call(MODES, store.mode) ? store.mode : 'slow';

// ---- 물리 상수 (논리 좌표: 높이 360, 땅 y=300) ----
const DT = 1 / 60, H = 360, GY = 300, PW = 28, PH = 44, JV = 860, DJV = 760, G = 2500, CUT = 2.8, FALL = 1.45;
const COY = 0.1, BUF = 0.13, ROUND = 75, M = 40, HOLD_AI = 0.3;

let rnd = mulberry(Date.now() & 0xffff);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
let W = 600, VH = 360, scale = 1, dpr = 1, sky = null;
let phase = 'title', manual = false, held = false, resultAt = 0, g = null;
const PX = () => Math.round(Math.min(150, Math.max(70, W * 0.2)));

function fresh(demo) {
  return { demo, t: 0, wx: 0, pwx: 0, speed: MODES[mode].v0, y: GY, py: GY, vy: 0, on: true, coy: 0, buf: 0, jumps: 0, wings: 0,
    sq: 0, sqv: 0, hearts: 3, inv: 0, coins: 0, cleared: 0, hits: 0, obs: [], items: [], parts: [], pops: [], next: 520,
    auto: true, endT: 0, hitstop: 0, shake: 0, dustT: 0, run: 0, lastFeather: 0, aiHold: 0, splash: 0 };
}

// ---- 소리 (첫 터치 때 만든다) ----
let ac = null;
function ensureAudio() {
  if (!ac) { try { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') { try { ac.resume().catch(() => {}); } catch (e) {} }
}
function tone(f, d, type, vol, slide, delay) {
  if (!soundOn || !ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), gn = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f * slide), t + d);
    gn.gain.setValueAtTime(vol || 0.06, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}

// ---- 장애물·아이템 만들기 ----
function spawn() {
  const d = g, sp = d.speed, el = d.demo ? 30 : d.t, x = d.next;
  const r = rnd();
  let type = 'cone';
  if (el > 7 && r < 0.3) type = 'rope'; else if (el > 12 && r < 0.56) type = 'puddle';
  let w;
  if (type === 'cone') {
    const n = el > 22 && rnd() < 0.35 ? 2 : 1;
    for (let i = 0; i < n; i++) d.obs.push({ type, x: x + i * 30, w: 26, h: 36 });
    w = 26 + (n - 1) * 30;
  } else if (type === 'rope') { w = 96 + Math.floor(rnd() * 22); d.obs.push({ type, x, w, h: 22, ph: rnd() * 6 }); }
  else { w = Math.floor(70 + rnd() * 34 + sp * 0.05); d.obs.push({ type, x, w, h: 0 }); }
  // 장애물 위 코인 아치 (뛰어야 먹는다)
  if (rnd() < 0.55) for (let i = 0; i < 4; i++) { const f = i / 3; d.items.push({ type: 'coin', x: x - 34 + (w + 68) * f, y: GY - 70 - Math.sin(f * Math.PI) * 60 }); }
  const gap = sp * (0.95 + rnd() * 0.85) + 150;
  // 땅 위 코인 줄
  if (rnd() < 0.4) for (let i = 0; i < 3; i++) d.items.push({ type: 'coin', x: x + w + gap * 0.35 + i * 34, y: GY - 22 });
  if (d.wings <= 0 && (el - d.lastFeather) > 15 && rnd() < 0.5) { d.lastFeather = el; d.items.push({ type: 'feather', x: x + w + gap * 0.5, y: GY - 60 }); }
  d.next = x + w + gap;
}
const inWater = x => g.obs.some(o => o.type === 'puddle' && x > o.x + 6 && x < o.x + o.w - 6);

// ---- 한 프레임(1/60초) 진행 ----
function jump(v, n) {
  const d = g;
  d.vy = -v; d.on = false; d.coy = 0; d.buf = 0; d.jumps = n; d.sq = -0.24; d.sqv = 0;
  const fx = d.wx + PX() + PW / 2;
  if (n === 1) { tone(380, 0.13, 'square', 0.045, 1.9); dust(fx, GY, 4, '#e9c79f'); }
  else { tone(620, 0.16, 'triangle', 0.06, 1.7); for (let i = 0; i < 6; i++) part(fx, d.y - 10, (rnd() - .5) * 160, 60 + rnd() * 80, 0.6, '#ffffff', 4); }
}
function land(ground) {
  const d = g, imp = Math.min(1, d.vy / 1300);
  d.sq = 0.14 + imp * 0.26; d.sqv = 0;
  const fx = d.wx + PX() + PW / 2;
  if (ground > GY) { d.splash = 0.4; for (let i = 0; i < 9; i++) part(fx, GY + 4, (rnd() - .5) * 260, -150 - rnd() * 220, 0.5, '#7cc8ff', 4); tone(260, 0.18, 'sine', 0.07, 0.5); hit(null); }
  else { dust(fx, GY, 3 + Math.round(imp * 5), '#e9c79f'); tone(140, 0.07, 'triangle', 0.04 + imp * 0.05, 0.6); }
}
function hit(o) {
  const d = g;
  if (d.inv > 0 || d.demo || phase !== 'play') return;
  d.hearts--; d.hits++; d.inv = 1.3; d.shake = 11; d.hitstop = 5;
  if (o && o.type === 'cone') { o.dead = true; o.vx = 260; o.vy = -420; o.rot = 0; }
  if (o && o.type === 'rope') o.twang = 0.6;
  const fx = d.wx + PX() + PW / 2;
  for (let i = 0; i < 8; i++) part(fx, d.y - 26, (rnd() - .5) * 320, -rnd() * 260, 0.5, i % 2 ? '#ffd23f' : '#ff6b6b', 4);
  tone(150, 0.28, 'sawtooth', 0.08, 0.4);
  pop(fx, d.y - 60, d.hearts > 0 ? '아야!' : '꽈당!', '#ff4d4d');
  hudHearts(true);
  if (d.hearts <= 0) d.endT = 0.8;
}
function part(x, y, vx, vy, life, col, r) { if (g.parts.length < 90) g.parts.push({ x, y, vx, vy, life, max: life, col, r }); }
function dust(x, y, n, col) { for (let i = 0; i < n; i++) part(x - 6 + rnd() * 12, y - 2, -40 - rnd() * 120, -30 - rnd() * 90, 0.45, col, 3 + rnd() * 3); }
function pop(x, y, txt, col) { if (g.pops.length < 12) g.pops.push({ x, y, txt, col, life: 0.9 }); }

function ai() {
  const d = g, R = d.wx + PX() + PW, sp = d.speed;
  d.aiHold = Math.max(0, d.aiHold - DT);
  if (!d.on) return;
  const o = d.obs.find(o => !o.dead && o.x + o.w > R - 10);
  if (!o) return;
  const lead = o.type === 'cone' ? (o.x + o.w / 2) - (R - PW / 2) - sp * 0.3 : o.x - R - sp * 0.06;
  if (lead < 0 && lead > -60) { d.buf = BUF; d.aiHold = HOLD_AI; }
}

function tick() {
  if (phase !== 'play' && phase !== 'title') return;
  const d = g;
  d.pwx = d.wx; d.py = d.y;
  if (d.hitstop > 0) { d.hitstop--; return; }
  if (phase === 'play') {
    d.t += DT;
    if (d.t >= ROUND) return finish(true);
    if (d.endT > 0) { d.endT -= DT; if (d.endT <= 0) return finish(false); }
  }
  const md = MODES[mode];
  d.speed = Math.min(md.max, md.v0 + md.acc * (d.demo ? 6 : d.t)) * (d.endT > 0 ? 0.4 : 1);
  d.wx += d.speed * DT;
  const px = d.wx + PX(), fx = px + PW / 2;
  while (d.auto && d.wx + W + 80 > d.next) spawn();
  if (d.demo) ai();
  const isHeld = d.demo ? d.aiHold > 0 : held;
  d.buf = Math.max(0, d.buf - DT); d.inv = Math.max(0, d.inv - DT); d.wings = Math.max(0, d.wings - DT); d.splash = Math.max(0, d.splash - DT);
  const ground = inWater(fx) ? GY + 16 : GY;
  d.coy = d.on ? COY : Math.max(0, d.coy - DT);
  if (d.buf > 0 && d.endT <= 0) {
    if (d.on || d.coy > 0) jump(JV, 1);
    else if (d.wings > 0 && d.jumps < 2) jump(DJV, 2);
  }
  let gr = G;
  if (d.vy < 0 && !isHeld) gr *= CUT; else if (d.vy > 0) gr *= FALL;
  d.vy = Math.min(d.vy + gr * DT, 1500);
  d.y += d.vy * DT;
  if (d.y >= ground) { if (!d.on) land(ground); d.y = ground; d.vy = 0; d.on = true; d.jumps = 0; }
  else if (d.y < ground - 0.5) d.on = false;
  d.sqv += (-d.sq * 380 - d.sqv * 20) * DT; d.sq += d.sqv * DT;
  d.run += d.speed * DT * (d.on ? 1 : 0.2);
  if (d.on && ground === GY) { d.dustT -= DT; if (d.dustT <= 0) { d.dustT = 0.11; dust(fx - 8, GY, 1, '#efd3b0'); } }
  // 충돌
  const L = px + 5, Rr = px + PW - 5, T = d.y - PH + 6, B = d.y;
  for (const o of d.obs) {
    if (o.dead) { o.x += o.vx * DT; o.vy += 1800 * DT; o.hy = (o.hy || 0) + o.vy * DT; o.rot += 9 * DT; continue; }
    if (o.twang) o.twang = Math.max(0, o.twang - DT);
    if (!o.passed && o.x + o.w < L) { o.passed = true; if (!o.wasHit) d.cleared++; }
    if (o.type === 'puddle' || o.wasHit) continue;
    if (Rr > o.x + 3 && L < o.x + o.w - 3 && B > GY - o.h + 4) { if (d.inv <= 0 && !d.demo) { o.wasHit = true; hit(o); } }
  }
  for (const it of d.items) {
    if (it.got) continue;
    if (it.x > L - 12 && it.x < Rr + 12 && it.y > T - 12 && it.y < B + 8) {
      it.got = true;
      if (it.type === 'coin') { d.coins++; if (!d.demo) pop(it.x, it.y - 10, '+5', '#e8a400'); tone(988, 0.07, 'square', 0.035); tone(1319, 0.12, 'square', 0.035, 0, 0.06); for (let i = 0; i < 4; i++) part(it.x, it.y, (rnd() - .5) * 200, (rnd() - .5) * 200, 0.35, '#ffd84a', 3); }
      else { d.wings = 12; pop(it.x, it.y - 16, '🪶 2단 점프!', '#2a7de1'); tone(660, 0.1, 'triangle', 0.06); tone(990, 0.18, 'triangle', 0.06, 0, 0.08); }
    }
  }
  const cut = d.wx - 160;
  if (d.obs.length > 12 || (d.obs[0] && d.obs[0].x + d.obs[0].w < cut)) d.obs = d.obs.filter(o => o.x + o.w > cut);
  if (d.items.length > 24 || (d.items[0] && d.items[0].x < cut)) d.items = d.items.filter(i => i.x > cut && !(i.got && i.x < d.wx));
  for (const p of d.parts) { p.life -= DT; p.vy += 900 * DT; p.x += p.vx * DT; p.y += p.vy * DT; }

const score = () => Math.floor(g.wx / M) + g.coins * 5;

// ---- 그리기 ----
function resize() {
  const r = stage.getBoundingClientRect(), cw = Math.max(1, r.width), ch = Math.max(1, r.height);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  scale = Math.min(ch / H, cw / 380); W = cw / scale; VH = ch / scale;

const mod = (a, b) => ((a % b) + b) % b;

function rr(x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.fill(); }
function drawBg(wx, top) {
  circ(W - 90, top + 70, 34, '#fff3a8'); circ(W - 90, top + 70, 26, '#ffe066');
  for (let i = 0; i < 5; i++) {
    const x = mod(i * 260 - wx * 0.06, W + 320) - 160, y = top + 40 + (i % 3) * 38;
    circ(x, y, 22, '#fff'); circ(x + 24, y - 8, 26, '#fff'); circ(x + 50, y, 20, '#fff'); ctx.fillRect(x, y, 50, 20);
  }
  // 먼 언덕
  ctx.fillStyle = '#bde7a4'; ctx.beginPath(); ctx.moveTo(0, GY);
  for (let x = 0; x <= W + 40; x += 40) ctx.lineTo(x, 214 + Math.sin((x + wx * 0.12) / 130) * 16 + Math.sin((x + wx * 0.12) / 47) * 5);
  ctx.lineTo(W, GY); ctx.fill();

    rr(bx + 130, 112, 70, 50, 6, '#fff0d4'); ctx.fillStyle = '#e97e5b'; ctx.fillRect(bx + 126, 106, 78, 9);
    circ(bx + 165, 137, 15, '#fff'); ctx.strokeStyle = '#4a5578'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx + 165, 137); ctx.lineTo(bx + 165, 127); ctx.moveTo(bx + 165, 137); ctx.lineTo(bx + 172, 140); ctx.stroke();
    ctx.fillStyle = '#7cc0ef';
    for (let r2 = 0; r2 < 2; r2++) for (let c = 0; c < 7; c++) if (c !== 3) ctx.fillRect(bx + 16 + c * 44, 170 + r2 * 38, 28, 22);
    ctx.fillStyle = '#b6774a'; ctx.fillRect(bx + 150, 222, 30, 38);
    ctx.fillStyle = '#4a5578'; ctx.font = 'bold 11px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText('햇살초등학교', bx + 165, 167);
  }
  // 나무

    ctx.fillStyle = '#9b6b43'; ctx.fillRect(x - 4, 236, 8, 30);
    circ(x, 228, 22, '#5bb35d'); circ(x - 14, 238, 15, '#6cc46a'); circ(x + 14, 236, 16, '#4ea552');
  }
  // 울타리 (땅과 같은 속도 → 속도감)
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 266, W, 4); ctx.fillRect(0, 280, W, 4);
  for (let x = -mod(wx * 0.85, 46); x < W + 10; x += 46) ctx.fillRect(x, 258, 6, 36);
}
function drawGround(wx) {
  ctx.fillStyle = '#7fd06a'; ctx.fillRect(0, GY - 6, W, 10);
  ctx.fillStyle = '#e8955c'; ctx.fillRect(0, GY + 4, W, H - GY + 2);
  ctx.fillStyle = '#d98450'; ctx.fillRect(0, GY + 4, W, 4);
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  for (let x = -mod(wx, 70); x < W; x += 70) { ctx.fillRect(x, 326, 36, 3); ctx.fillRect(x + 35, 346, 36, 3); }
}
function drawObs(o, sx, t) {
  if (o.type === 'puddle') {
    ctx.fillStyle = '#4aa8f0'; ctx.beginPath(); ctx.ellipse(sx + o.w / 2, GY + 8, o.w / 2 + 4, 10, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#86cdff'; ctx.beginPath(); ctx.ellipse(sx + o.w / 2, GY + 6, o.w / 2 - 6, 6, 0, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.beginPath(); const rp = (t * 30) % 20;
    ctx.ellipse(sx + o.w / 2, GY + 6, 8 + rp, 2 + rp * 0.2, 0, 0, 6.2832); ctx.stroke();
  } else if (o.type === 'cone') {
    ctx.save(); ctx.translate(sx + o.w / 2, GY + (o.hy || 0)); if (o.rot) ctx.rotate(o.rot);
    ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.moveTo(-5, -o.h); ctx.lineTo(5, -o.h); ctx.lineTo(12, -4); ctx.lineTo(-12, -4); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-8, -24, 16, 5); ctx.fillRect(-10, -14, 20, 4);
    rr(-16, -5, 32, 6, 2, '#e05f0b'); ctx.restore();
  } else {
    const tw = o.twang ? Math.sin(o.twang * 40) * 6 : 0, top = GY - 44;
    for (const px of [sx - 4, sx + o.w]) { rr(px, top, 6, 46, 3, '#7a5cff'); circ(px + 3, top, 6, '#ffcd3c'); }
    const sw = Math.cos(t * 7 + o.ph);
    ctx.strokeStyle = '#ff3d7f'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(sx, top + 4);
    ctx.quadraticCurveTo(sx + o.w / 2, GY - 18 + sw * 34 + tw, sx + o.w, top + 4); ctx.stroke();

}
function drawItem(it, sx, t) {
  if (it.type === 'coin') {
    const k = Math.abs(Math.cos(t * 5 + it.x * 0.01));
    ctx.fillStyle = '#e8a400'; ctx.beginPath(); ctx.ellipse(sx, it.y, 10 * k + 1.5, 10, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.ellipse(sx, it.y, 7 * k + 1, 7, 0, 0, 6.2832); ctx.fill();
  } else {
    const y = it.y + Math.sin(t * 4) * 6;
    circ(sx, y, 20, 'rgba(120,190,255,.25)');
    ctx.save(); ctx.translate(sx, y); ctx.rotate(-0.6);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, 0, 6, 16, 0, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = '#7aa7d8'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -14); ctx.stroke(); ctx.restore();
  }
}
function drawKid(cx, fy, d, t) {
  const h = Math.max(0, GY - fy);
  ctx.fillStyle = 'rgba(60,40,20,.22)'; ctx.beginPath(); ctx.ellipse(cx, GY + 2, Math.max(6, 16 - h * 0.05), 4, 0, 0, 6.2832); ctx.fill();
  if (d.inv > 0 && Math.floor(d.inv * 14) % 2) ctx.globalAlpha = 0.4;
  const st = d.on ? 0 : Math.max(-0.12, Math.min(0.1, d.vy / 6000));
  const sy = 1 - d.sq - st, sx = 1 + d.sq * 0.8 + st * 0.6;
  ctx.save(); ctx.translate(cx, fy); ctx.scale(sx, sy);
  const ph = d.run / 16, air = !d.on;
  const lg = air ? 0.7 : Math.sin(ph) * 0.9;
  ctx.lineCap = 'round'; ctx.strokeStyle = '#30436e'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(Math.sin(lg) * 13, -16 + Math.cos(lg) * 15);
  ctx.moveTo(0, -16); ctx.lineTo(Math.sin(air ? -0.9 : -lg) * 13, -16 + Math.cos(air ? -0.9 : lg) * 15); ctx.stroke();
  if (d.wings > 0) { const fl = Math.sin(t * 22) * 0.5; ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.save(); ctx.translate(-8, -30); ctx.rotate(-0.9 + fl); ctx.beginPath(); ctx.ellipse(-10, 0, 13, 6, 0, 0, 6.2832); ctx.fill(); ctx.restore(); }
  rr(-17, -36, 10, 17, 4, '#ff5a5a');
  rr(-11, -37, 22, 23, 8, '#3d8bff');
  ctx.strokeStyle = '#ffd2a8'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(4, -32); ctx.lineTo(4 + Math.sin(-lg) * 11, -24 + Math.abs(Math.cos(lg)) * 3); ctx.stroke();
  circ(1, -46, 12, '#ffd9b3');
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(1, -48, 12.5, Math.PI, 0); ctx.fill(); ctx.fillRect(4, -50, 15, 4);
  circ(7, -45, 2, '#1f2a44');
  ctx.fillStyle = '#ff9b9b'; ctx.beginPath(); ctx.arc(4, -40, 2.4, 0, 6.2832); ctx.fill();

}
function render(a) {
  const d = g; if (!d) return;
  const t = performance.now() / 1000;
  const wx = d.pwx + (d.wx - d.pwx) * a, y = d.py + (d.y - d.py) * a;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, VH);
  const top = -(VH - H);

  ctx.translate(sh, VH - H + sv);
  drawBg(wx, Math.max(top, 0) + (VH > H ? top * 0.25 : 0));
  drawGround(wx);
  for (const o of d.obs) { const sx = o.x - wx; if (sx < W + 40 && sx + o.w > -60) drawObs(o, sx, t); }
  for (const it of d.items) if (!it.got) { const sx = it.x - wx; if (sx > -20 && sx < W + 20) drawItem(it, sx, t); }

}

// ---- 화면 표시 ----
const el = { dist: $('#dist'), coins: $('#coins'), score: $('#score'), best: $('#best'), tbar: $('#tbar'), hearts: $('#hearts') };
const last = {};
function setTxt(k, v) { if (last[k] !== v) { last[k] = v; el[k].textContent = v; if (k === 'coins' && phase === 'play') { el[k].classList.remove('bump'); void el[k].offsetWidth; el[k].classList.add('bump'); } } }
function hudHearts(b) { el.hearts.textContent = '❤️'.repeat(Math.max(0, g.hearts)) + '🤍'.repeat(Math.max(0, 3 - g.hearts)); if (b) { el.hearts.classList.remove('bump'); void el.hearts.offsetWidth; el.hearts.classList.add('bump'); } }
function hud() {
  if (!g) return;
  const play = !g.demo;
  setTxt('dist', String(play ? Math.floor(g.wx / M) : 0));
  setTxt('coins', String(play ? g.coins : 0));
  setTxt('score', String(play ? score() : 0));
  setTxt('best', String(bestOf(mode)));
  const f = play ? Math.max(0, 1 - g.t / ROUND) : 1;
  el.tbar.style.transform = 'scaleX(' + f.toFixed(3) + ')';
}
function show(id, on) { $(id).classList.toggle('on', on); }
function setModeBtns() { $$('.md').forEach(b => { b.classList.toggle('on', b.dataset.m === mode); b.disabled = phase === 'play' || phase === 'paused'; }); }
function setSnd() { const b = $('#snd'); b.textContent = soundOn ? '🔊 소리' : '🔇 소리 끔'; b.setAttribute('aria-pressed', String(soundOn)); }

function startGame() {
  ensureAudio();
  g = fresh(false); phase = 'play'; held = false;
  show('#ready', false); show('#result', false); show('#paused', false);
  $('#pauseBtn').disabled = false; setModeBtns(); hudHearts(false); hud();
  pop(PX() + 60, GY - 90, '출발!', '#ff6f3c');
  tone(523, 0.1, 'square', 0.05); tone(784, 0.16, 'square', 0.05, 0, 0.1);
  $('#hint').style.opacity = '1'; setTimeout(() => { $('#hint').style.opacity = '0'; }, 3500);
}
function finish(done) {
  if (phase !== 'play') return;
  phase = 'result'; held = false; resultAt = performance.now();
  const s = score(), prev = bestOf(mode), rec = s > prev && s > 0;
  if (rec) { store.best[mode] = s; save(); }
  $('#rTitle').textContent = done ? '🏁 완주!' : '꽈당! 다음엔 더 멀리';
  $('#rScore').textContent = s + '점';
  $('#rStat').textContent = '거리 ' + Math.floor(g.wx / M) + 'm · 코인 ' + g.coins + '개 · 넘은 장애물 ' + g.cleared + '개 · ' + (MODES[mode] && mode === 'fast' ? '빠르게' : '천천히');
  $('#newrec').hidden = !rec;
  show('#result', true); $('#pauseBtn').disabled = true; setModeBtns(); hud();
  if (done) [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'square', 0.05, 0, i * 0.11)); else tone(220, 0.4, 'triangle', 0.07, 0.5);
}
function goHome() { phase = 'title'; g = fresh(true); show('#result', false); show('#paused', false); show('#ready', true); $('#pauseBtn').disabled = true; setModeBtns(); hudHearts(false); hud(); }
function pause() { if (phase !== 'play') return; phase = 'paused'; held = false; show('#paused', true); setModeBtns(); }
function resume() { if (phase !== 'paused') return; phase = 'play'; show('#paused', false); setModeBtns(); }
function press() { if (!held) { held = true; if (g) g.buf = BUF; } }

// ---- 입력 ----
const JK = new Set([' ', 'Spacebar', 'ArrowUp', 'Up', 'w', 'W']);
addEventListener('keydown', e => {
  ensureAudio();
  const k = e.key;
  if (JK.has(k) || e.code === 'Space') {
    e.preventDefault(); if (e.repeat) return;
    if (phase === 'play') press();
    else if (phase === 'paused') resume();
    else if (phase === 'title' || (phase === 'result' && performance.now() - resultAt > 700)) startGame();
  } else if (k === 'Enter' && phase !== 'play') {
    e.preventDefault(); if (phase === 'paused') resume(); else if (phase === 'title' || performance.now() - resultAt > 700) startGame();
  } else if ((k === 'p' || k === 'P' || k === 'Escape') && phase === 'play') pause();
  else if (k === 'ArrowDown') e.preventDefault();
});
addEventListener('keyup', e => { if (JK.has(e.key) || e.code === 'Space') release(); });
const ptrs = new Set();
stage.addEventListener('pointerdown', e => {
  ensureAudio();
  if (e.target.closest('button, a, .card')) return;
  e.preventDefault();
  if (phase !== 'play') return;
  ptrs.add(e.pointerId); try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  press();
});
const up = e => { ptrs.delete(e.pointerId); if (!ptrs.size) release(); };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
stage.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('blur', () => { if (phase === 'play' && !manual) pause(); });

$('#start').addEventListener('click', startGame);
$('#again').addEventListener('click', startGame);
$('#home').addEventListener('click', goHome);
$('#resume').addEventListener('click', resume);
$('#pauseBtn').addEventListener('click', pause);
$$('.md').forEach(b => b.addEventListener('click', () => {
  if (phase === 'play' || phase === 'paused') return;
  mode = b.dataset.m; store.mode = mode; save();
  if (phase === 'result') goHome(); else { g = fresh(true); }
  setModeBtns(); hud();
}));
$('#snd').addEventListener('click', () => { ensureAudio(); soundOn = !soundOn; store.sound = soundOn; save(); setSnd(); tone(660, 0.08, 'square', 0.05); });

// ---- 루프 (고정 1/60초 물리 + 보간 그리기) ----
let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let e = (now - lastT) / 1000; lastT = now;
  if (e > 0.1) e = 0.1; if (e < 0) e = 0;
  if (!manual) { acc += e; let n = 0; while (acc >= DT && n < 6) { tick(); acc -= DT; n++; } if (n >= 6) acc = 0; }
  render(manual ? 1 : Math.min(1, acc / DT));
  hud();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else addEventListener('resize', resize);
resize(); g = fresh(true); setModeBtns(); setSnd(); hudHearts(false); hud();
requestAnimationFrame(frame);

// ---- 테스트 훅 ----
window.__test = {
  seed(n) { rnd = mulberry(n); manual = true; if (phase === 'title') g = fresh(true); },
  step(n) { for (let i = 0; i < (n || 1); i++) tick(); hud(); render(1); },
  input(o) { if (o && 'jump' in o) { if (o.jump) press(); else release(); } },
  place(type, dx, dy) {
    g.auto = false; g.obs = []; g.items = []; g.next = Infinity;
    const x = g.wx + PX() + PW + (dx || 0);
    if (type === 'cone') g.obs.push({ type, x, w: 26, h: 36 });
    else if (type === 'rope') g.obs.push({ type, x, w: 104, h: 22, ph: 0 });
    else if (type === 'puddle') g.obs.push({ type, x, w: 96, h: 0 });
    else if (type === 'coin' || type === 'feather') g.items.push({ type, x, y: GY - (dy || 20) });
  },
  state() {
    const d = g, R = d.wx + PX() + PW, o = d.obs.find(o => !o.dead && o.x + o.w > R - PW);
    return { phase, mode, demo: d.demo, score: score(), dist: Math.floor(d.wx / M), coins: d.coins, hearts: d.hearts, hits: d.hits, cleared: d.cleared,
      h: GY - d.y, vy: d.vy, on: d.on, jumps: d.jumps, wings: d.wings, speed: d.speed, t: d.t, inv: d.inv, shake: d.shake, sq: d.sq,
      next: o ? o.x - R : Infinity, wx: d.wx, best: bestOf(mode), sound: soundOn };
  },
  end() { finish(true); }
};
})();
