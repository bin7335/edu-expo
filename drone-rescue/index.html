<body>
<canvas id="cv" aria-label="드론 카메라 화면"></canvas>
<header>
  <div class="logo" aria-hidden="true">🚁</div>
  <h1>구조 드론<small>열화상 카메라로 구조가 필요한 사람 찾기</small></h1>
  <div class="hud">
    <div class="pill">구조<b><span id="resN">0</span>/6</b></div>
    <div class="pill">배터리<b id="bat">100%</b></div>
    <div class="pill">중심 온도<b id="temp">--</b></div>
    <div class="pill">시간<b id="timeT">0:00</b></div>
  </div>
  <div class="tools"><button class="ib" id="thermal" aria-pressed="false">🌡️ 열화상</button><button class="ib" id="snd" aria-pressed="false">🔇 소리</button><button class="ib" id="fs" aria-label="전체화면">⛶</button></div>
</header>
<div id="toast"></div>
<div class="ov on" id="ready">
  <h2>🆘 지진·홍수 현장 수색 임무</h2>
  <p>연기와 잔해 속에 <b>구조가 필요한 사람 6명</b>이 있어요. <b>열화상</b>으로 36.5°C 사람을 찾아 그 위에서 <b>잠시 멈춰</b> 구조 신호를 보내고, 배터리가 떨어지기 전에 <b>기지(H)</b>로 돌아와요.</p>
  <div class="tips"><span>⌨️ 방향키 / WASD 비행</span><span>📱 화면을 끌어서 비행</span><span>🌡️ T 키 = 열화상 켜기/끄기</span><span>🐕🔥🚗 사람이 아닌 열도 있어요</span></div>
  <p id="recLine">최고 점수 -</p>
  <button class="go" id="start">🚁 이륙!</button>
</div>
<div class="ov" id="result">
  <h2 id="rTitle">임무 완료!</h2>
  <div id="rStars"></div>
  <div id="rScore">0점</div>
  <p id="rStat"></p>
  <div class="sum" id="rSum"></div>
  <button class="go" id="again">다시 출동</button><button class="sub" id="home">처음으로</button>
</div>
<a class="back" href="../">← 전체 데모 보기</a>
<script>
(() => {
'use strict';
const DT = 1 / 60, WW = 2400, WH = 1600, ACC = 360, DRAG = 1.4, HOVER = 1.5;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const KEY = 'edu-expo-drone-rescue-v1';
const BASE = { x: 260, y: 1340 };
// 재난 현장
const PEOPLE = [[700, 520, 'rubble'], [1180, 330, 'smoke'], [1650, 900, 'river'], [2050, 380, 'forest'], [950, 1250, 'rubble'], [1500, 640, 'smoke']].map(([x, y, w], i) => ({ id: 'p' + i, x, y, w }));
const DECOYS = [
  { id: 'd0', kind: 'dog', x: 820, y: 900, temp: 38.5 }, { id: 'd1', kind: 'dog', x: 1900, y: 1150, temp: 38.5 },
  { id: 'f0', kind: 'fire', x: 1260, y: 260, temp: 600 }, { id: 'f1', kind: 'fire', x: 600, y: 760, temp: 650 }, { id: 'f2', kind: 'fire', x: 1800, y: 470, temp: 550 },
  { id: 'c0', kind: 'car', x: 1100, y: 740, temp: 70 }, { id: 'c1', kind: 'car', x: 1440, y: 1020, temp: 65 }, { id: 'c2', kind: 'car', x: 420, y: 1020, temp: 75 }
];
const BLD = [[520, 200, 140, 110, 70], [700, 210, 120, 120, 95], [880, 190, 160, 120, 60], [1380, 200, 130, 130, 110], [860, 430, 150, 120, 80], [1250, 450, 110, 100, 70],
  [530, 600, 100, 90, 60], [1240, 800, 140, 120, 90], [700, 1080, 130, 110, 70], [1080, 1120, 140, 110, 60], [560, 1200, 90, 80, 40], [1300, 1250, 120, 100, 55]].map(([x, y, w, h, ht]) => ({ x, y, w, h, ht }));
const RUBBLE = [[700, 520, 85], [950, 1250, 75], [560, 450, 70], [1530, 830, 80]].map(([x, y, r], i) => ({ x, y, r, rocks: Array.from({ length: 16 }, (_, k) => ({ a: k * 2.4 + i, d: (k % 5) / 5 * r * 0.9, s: 8 + (k * 7 % 11), c: k % 3 })) }));
const ROADS = [[450, 360, 1950, 40], [300, 1000, 1500, 40], [450, 720, 1350, 40], [460, 150, 40, 1300], [1180, 150, 40, 1300]];
const RIVER = [[1500, 1600], [1600, 1300], [1780, 1080], [1980, 900], [2200, 760], [2400, 700], [2400, 1050], [2200, 1080], [2020, 1200], [1880, 1380], [1800, 1600]];
const TREES = [];
for (let i = 0; i < 46; i++) TREES.push({ x: 1900 + (i * 97) % 460, y: 140 + (i * 151) % 540, r: 34 + (i % 4) * 8 });
for (let i = 0; i < 9; i++) TREES.push({ x: 1430 + (i * 53) % 170, y: 560 + (i * 71) % 170, r: 26 + (i % 3) * 6 });
const SMOKE = [[1220, 300, 150], [1500, 640, 130], [640, 760, 130], [960, 1220, 100], [1800, 470, 120]].map(([x, y, r], i) => ({ x, y, r, puffs: Array.from({ length: 11 }, (_, k) => ({ a: k * 0.57 + i, d: (k % 4) / 4 * r, s: 0.5 + (k % 3) * 0.25, sp: 0.2 + (k % 5) * 0.05 })) }));
const rec = { best: 0, missions: 0, bestRescued: 0 };
try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && typeof r === 'object') { rec.best = Math.max(0, Math.floor(Number(r.best) || 0)); rec.missions = Math.max(0, Math.floor(Number(r.missions) || 0)); rec.bestRescued = clamp(Math.floor(Number(r.bestRescued) || 0), 0, 6); } } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) {} };

// ---- 소리 ----
let AC = null, master = null, motG = null, motO = null, sound = false;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  motO = AC.createOscillator(); motO.type = 'sawtooth'; motO.frequency.value = 140; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
  motG = AC.createGain(); motG.gain.value = 0.03; motO.connect(lp); lp.connect(motG); motG.connect(master); motO.start();
  const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0); let l = 0; for (let i = 0; i < len; i++) { l = l * 0.98 + (Math.random() * 2 - 1) * 0.02; d[i] = l * 5; }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true; const g = AC.createGain(); g.gain.value = 0.25; src.connect(g); g.connect(master); src.start();
}
function setSound(on) {
  sound = on; $('#snd').textContent = on ? '🔊 소리' : '🔇 소리'; $('#snd').setAttribute('aria-pressed', String(on));
  if (on) initAudio(); if (!AC) return;
  try { if (on && AC.state === 'suspended') AC.resume().catch(() => {}); master.gain.setTargetAtTime(on ? 0.9 : 0, AC.currentTime, 0.2); } catch (e) {}
}
function tone(f1, f2, dur, type, vol, delay) {
  if (!sound || !AC) return;
  try { const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05); } catch (e) {}
}
const sfx = { rescue: () => [660, 880, 1320].forEach((f, i) => tone(f, f, 0.25, 'square', 0.06, i * 0.1)), info: () => tone(500, 500, 0.15, 'triangle', 0.08), warn: () => { tone(880, 600, 0.2, 'square', 0.06); tone(880, 600, 0.2, 'square', 0.06, 0.25); },
  therm: on => tone(on ? 400 : 900, on ? 900 : 400, 0.15, 'sine', 0.08), scan: () => tone(1500, 1500, 0.04, 'sine', 0.03), end: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.4, 'triangle', 0.08, i * 0.13)) };

// ---- 화면 ----
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 1280, H = 720, DPR = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }

// ---- 상태 ----
let phase = 'ready', x = 900, y = 560, vx = 0, vy = 0, tiltX = 0, tiltY = 0, battery = 100, thermal = false, t = 0, fly = 0, manual = false, forced = null;
let camX = 900, camY = 560, rescued = [], checked = [], hover = null, nearFire = false, toastT = 0, beacons = [], endReason = '', score = 0;
const keys = { l: 0, r: 0, u: 0, d: 0 }, joy = { on: false, id: -1, ox: 0, oy: 0, x: 0, y: 0 };
function input() {
  if (forced) return forced;
  let ix = keys.r - keys.l, iy = keys.d - keys.u;
  if (joy.on) { ix += clamp((joy.x - joy.ox) / 60, -1, 1); iy += clamp((joy.y - joy.oy) / 60, -1, 1); }
  return { x: clamp(ix, -1, 1), y: clamp(iy, -1, 1) };
}
function toast(msg, cls) { const el = $('#toast'); el.textContent = msg; el.className = 'on ' + (cls || ''); toastT = 3; }
const targets = () => [...PEOPLE.map(p => ({ id: p.id, kind: 'person', x: p.x, y: p.y, temp: 36.5 })), ...DECOYS];
function centerTemp() {
  let best = null;
  for (const o of targets()) { const d = Math.hypot(o.x - x, o.y - y); if (d < (o.kind === 'fire' ? 50 : 30) && (!best || o.temp > best.temp)) best = o; }
  return best ? best.temp : 12;
}
function update() {
  t += DT;
  if (toastT > 0 && (toastT -= DT) <= 0) $('#toast').classList.remove('on');
  if (phase === 'ready') { x = 1080 + Math.cos(t * 0.5) * 120; y = 560 + Math.sin(t * 0.5) * 70; vx = -Math.sin(t * 0.5) * 85; vy = Math.cos(t * 0.5) * 55; tiltX = vx / 400; tiltY = vy / 400; follow(0.06); return; }
  if (phase !== 'fly') return;
  fly += DT;
  const inp = input();
  const wx = Math.sin(t * 0.13) * 8 + Math.sin(t * 0.47) * 4, wy = Math.cos(t * 0.11) * 6;
  vx += (inp.x * ACC + wx - vx * DRAG) * DT; vy += (inp.y * ACC + wy - vy * DRAG) * DT;
  x += vx * DT; y += vy * DT;
  if (x < 30) { x = 30; vx = Math.abs(vx) * 0.3; } if (x > WW - 30) { x = WW - 30; vx = -Math.abs(vx) * 0.3; }
  if (y < 30) { y = 30; vy = Math.abs(vy) * 0.3; } if (y > WH - 30) { y = WH - 30; vy = -Math.abs(vy) * 0.3; }
  tiltX += (inp.x * 0.35 - tiltX) * 0.15; tiltY += (inp.y * 0.35 - tiltY) * 0.15;
  const spd = Math.hypot(vx, vy);
  // 불길 근처 과열
  const fire = DECOYS.find(d => d.kind === 'fire' && Math.hypot(d.x - x, d.y - y) < 70);
  if (fire && !nearFire) { toast('🔥 불길 약 ' + fire.temp + '°C! 사람이 아니에요. 드론이 과열돼요, 빨리 벗어나요!', 'bad'); sfx.warn(); }
  nearFire = !!fire;
  battery -= DT * (0.6 + Math.hypot(inp.x, inp.y) * 0.25 + (thermal ? 0.25 : 0) + (fire ? 2 : 0));
  // 정지 비행 판정
  let tg = null, bd = 40;
  for (const o of targets()) { if (o.kind === 'fire') continue; const d = Math.hypot(o.x - x, o.y - y); if (d < bd) { bd = d; tg = o; } }
  if (tg && spd < 70) { if (!hover || hover.id !== tg.id) hover = { id: tg.id, t: 0 }; hover.t += DT; if (hover.t >= HOVER) resolve(tg); }
  else hover = null;
  follow(0.08);
  if (AC && motO) { try { motO.frequency.setTargetAtTime(130 + spd * 0.25, AC.currentTime, 0.1); } catch (e) {} }
  if (rescued.length >= 1 && fly > 2 && Math.hypot(x - BASE.x, y - BASE.y) < 50 && spd < 40) return end('home');
  if (battery <= 0) { battery = 0; return end('battery'); }
}
function resolve(o) {
  if (o.kind === 'person') { if (rescued.includes(o.id)) return; rescued.push(o.id); beacons.push({ x: o.x, y: o.y, t: 0 }); sfx.rescue(); toast('🆘 구조 신호 전송! 구조대가 출동해요 (' + rescued.length + '/6)' + (rescued.length === 6 ? ' — 이제 기지(H)로 돌아와요!' : ''), 'good'); hud(); return; }
  if (checked.includes(o.id)) return;
  checked.push(o.id); sfx.info();
  if (o.kind === 'dog') toast('🐕 강아지예요(약 38.5°C). 사람보다 몸집이 작고 네 발이에요. 구조 대상은 사람!', 'info');
  else if (o.kind === 'car') toast('🚗 자동차 엔진 열(약 ' + o.temp + '°C)이에요. 사람은 36-37°C로 보여요.', 'info');
}
function follow(k) {
  const tx = clamp(x + vx * 0.35, W / 2 - 80, WW - W / 2 + 80), ty = clamp(y + vy * 0.35, H / 2 - 120, WH - H / 2 + 80);
  camX += (tx - camX) * k; camY += (ty - camY) * k;
}
function end(reason) {
  phase = 'end'; endReason = reason; sfx.end();
  const home = reason === 'home';
  score = rescued.length * 100 + (home ? 100 + Math.round(battery) : 0);
  rec.missions++; const nb = score > rec.best; if (nb) rec.best = score; rec.bestRescued = Math.max(rec.bestRescued, rescued.length); save();
  $('#rTitle').textContent = home ? '✅ 임무 완료! 기지 귀환' : '🔋 배터리 방전 — 비상 착륙';
  $('#rStars').textContent = home && rescued.length === 6 ? '★★★' : rescued.length >= 4 ? '★★☆' : '★☆☆';
  $('#rScore').textContent = score + '점' + (nb ? ' 🏆' : '');

  try { if (d.fullscreenElement || d.webkitFullscreenElement) { const r = (d.exitFullscreen || d.webkitExitFullscreen).call(d); if (r && r.catch) r.catch(() => {}); }
    else { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(() => {}); } } catch (e) {}
});
addEventListener('resize', resize);

window.__test = {
  manual: v => { manual = !!v; },
  step: (n = 1) => { for (let i = 0; i < n; i++) update(); hud(); },
  input: o => { forced = o ? { x: clamp(o.x || 0, -1, 1), y: clamp(o.y || 0, -1, 1) } : null; },
  place: (px, py, pvx, pvy) => { x = px; y = py; vx = pvx || 0; vy = pvy || 0; hover = null; camX = px; camY = py; },
  setBattery: b => { battery = b; },
  info: () => ({ people: PEOPLE.map(p => ({ x: p.x, y: p.y })), decoys: DECOYS.map(d => ({ kind: d.kind, x: d.x, y: d.y, temp: d.temp })), base: { ...BASE } }),
  state: () => ({ phase, x, y, vx, vy, tilt: tiltX, battery, thermal, rescued: rescued.length, score, sound })
};
resize(); hud();
for (let i = 0; i < 30; i++) update();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
