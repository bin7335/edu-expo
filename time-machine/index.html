    ctx.strokeStyle = `hsla(${250 + s.c * 90},90%,${60 + s.c * 20}%,${Math.min(1, (1 - s.z) * 1.4)})`; ctx.lineWidth = s.s * (1 + speed * 2);
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); ctx.stroke();
  }
  for (let k = 0; k < 7; k++) { const rr = ((g.t * (60 + speed * 900) + k * 120) % 840); ctx.strokeStyle = `rgba(160,130,255,${.25 * (1 - rr / 840)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7); ctx.stroke(); }
  const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120); gr.addColorStop(0, `rgba(255,240,200,${.4 + speed * .6})`); gr.addColorStop(1, 'rgba(255,240,200,0)'); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, 120, 0, 7); ctx.fill();
}
// 첫 화면: 둥근 창으로 네 시대가 번갈아 보임
function porthole() {
  if (W < 900) return;
  const k = Math.floor(g.t / 4) % 4, cx = W * .74, cy = H * .53, r = Math.min(W * .24, H * .38);
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();
  ctx.translate(cx - W * .74, cy - H * .5);
  SCENES[k](); person(W * .78, H * .9, 1.25 * U(), ERAS[k].look, false);
  const fade = (g.t % 4); if (fade < .4 || fade > 3.6) { ctx.fillStyle = `rgba(18,13,42,${fade < .4 ? 1 - fade / .4 : (fade - 3.6) / .4})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  ctx.strokeStyle = '#c9a24a'; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(cx, cy, r + 7, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#7a5a1e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, r + 14, 0, 7); ctx.stroke();
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * (r + 7), cy + Math.sin(a) * (r + 7), 3, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(20,14,40,.75)'; ctx.font = '900 18px system-ui,sans-serif'; ctx.textAlign = 'center';
  const lab = ERAS[k].em + ' ' + ERAS[k].name, tw = ctx.measureText(lab).width + 28;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx - tw / 2, cy + r - 10, tw, 32, 16) : ctx.rect(cx - tw / 2, cy + r - 10, tw, 32); ctx.fill();
  ctx.fillStyle = '#ffe9a8'; ctx.fillText(lab, cx, cy + r + 12);
}
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (g.phase === 'hub' || g.phase === 'end') { drawTunnel(0); porthole(); }
  else if (g.phase === 'warp') {
    const p = g.warp / 1.8;
    drawTunnel(Math.sin(Math.min(1, p) * Math.PI));
    ctx.fillStyle = '#ffe9a8'; ctx.textAlign = 'center'; ctx.font = `900 ${Math.min(64, W / 9)}px system-ui,sans-serif`;
    ctx.fillText(p < .8 ? '⏳ ' + ERAS[g.era].year + '(으)로…' : ERAS[g.era].name, W / 2, H / 2 + 20);
    if (p > .8) { ctx.fillStyle = `rgba(255,255,255,${(p - .8) * 5})`; ctx.fillRect(0, 0, W, H); }
  } else {
    SCENES[g.era]();
    const u = U(), talking = g.typing;
    if (W < 700) person(W * .7, H * .62, .8 * u, ERAS[g.era].look, talking); else person(W * .78, H * .9, 1.25 * u, ERAS[g.era].look, talking);
    if (g.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${g.flash})`; ctx.fillRect(0, 0, W, H); }
  }
}

// ---- 대화 ----
function setLine(who, text) { g.who = who; g.line = text; g.typed = 0; g.typing = true; $('#sayWho').textContent = who; $('#sayText').textContent = ''; $('#opts').textContent = ''; $('#more').hidden = false; }
function finishLine() { if (!g.typing) return; g.typed = g.line.length; g.typing = false; $('#sayText').textContent = g.line; $('#more').hidden = true; showOpts(); }
let pendingOpts = [];
function showOpts() {
  const box = $('#opts'); box.textContent = '';
  pendingOpts.forEach((o, i) => { const b = document.createElement('button'); b.className = o.cls || ''; b.textContent = (i + 1) + '. ' + o.t; b.onclick = () => { if (!g.typing) { blip(); o.fn(); } }; box.appendChild(b); });
}
function menu(first) {
  const E = ERAS[g.era];
  setLine(E.who, first ? E.hello : (g.asked.length === 3 ? '이제 내 시대를 꽤 알게 됐네! 퀴즈를 풀면 도장을 줄게.' : '또 궁금한 게 있어?'));
  pendingOpts = [];
  E.qs.forEach((q, i) => { if (!g.asked.includes(i)) pendingOpts.push({ t: q.q, cls: 'q', fn: () => ask(i) }); });
  if (g.asked.length === 3) pendingOpts.push({ t: '🧧 퀴즈 풀고 도장 받기', cls: 'quiz', fn: openQuiz });
  pendingOpts.push({ t: '⏳ 타임머신으로 돌아가기', cls: 'home', fn: toHub });
}
function ask(i) {
  const E = ERAS[g.era];
  g.asked.push(i); g.log.push(E.qs[i].a);
  setLine(E.who, E.qs[i].a);
  pendingOpts = [{ t: '다른 것도 물어볼래요', fn: () => menu(false) }];
}
function openQuiz() {
  const E = ERAS[g.era]; g.phase = 'quiz'; g.tries = 0;
  $('#qText').textContent = E.quiz.q; $('#qfb').textContent = ''; $('#stampMsg').textContent = ''; $('#qNext').hidden = true;
  const opts = E.quiz.opts.slice(); for (let k = opts.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); [opts[k], opts[j]] = [opts[j], opts[k]]; }
  const box = $('#qOpts'); box.textContent = '';
  opts.forEach(([t, okk], i) => { const b = document.createElement('button'); b.textContent = (i + 1) + '. ' + t; b.dataset.ok = okk ? '1' : '0'; b.onclick = () => answer(b, okk); box.appendChild(b); });
  $('#quiz').classList.add('on'); $('#talk').classList.remove('on');
}
function answer(b, okk) {
  if (g.phase !== 'quiz' || !$('#qNext').hidden) return;
  const E = ERAS[g.era];
  if (!okk) { g.tries++; $('#qfb').textContent = '🤔 아니에요. 힌트: ' + E.quiz.hint; tone(160, .25, 'sine', .1); return; }
  b.classList.add('right'); $('#qfb').textContent = '';
  if (!g.stamps.includes(g.era)) g.stamps.push(g.era);
  store.stamps = g.stamps.slice(); save();
  $('#stampMsg').textContent = `🧧 정답! ${E.name} 도장을 받았어요 (${g.stamps.length}/4)`;
  $('#qNext').hidden = false; $('#qNext').textContent = g.stamps.length === 4 ? '🎖️ 수료증 받으러 가기' : '⏳ 타임머신으로 돌아가기';
  [659, 784, 1047].forEach((f, i) => tone(f, .4, 'triangle', .07, i * .1));
}
function toHub() {
  g.phase = 'hub'; g.era = -1; $('#quiz').classList.remove('on'); $('#talk').classList.remove('on'); $('#eraTag').classList.remove('on');
  $('#sub').textContent = '시대를 골라 출발하세요'; drawEras();
  if (g.stamps.length === 4) { $('#hub').classList.remove('on'); finish(); } else $('#hub').classList.add('on');
}
function finish() {
  g.phase = 'end';
  store.done = (store.done || 0) + 1; store.stamps = g.stamps.slice(); save();
  const c = $('#cert'); c.textContent = '';
  for (const E of ERAS) { const d = document.createElement('div'); d.textContent = `🧧 ${E.em} ${E.name} — ${E.place}`; c.appendChild(d); }
  $('#endMsg').textContent = `네 시대를 모두 다녀왔어요! 지금까지 수료 ${store.done}회. 시대마다 집·그릇·글자·탈것이 어떻게 달라졌는지 떠올려 보세요.`;
  $('#end').classList.add('on');
  [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .5, 'triangle', .07, i * .12));
}
function go(i) {
  if (g.phase !== 'hub') return;
  ensureAudio();
  g.era = i; g.phase = 'warp'; g.warp = 0; g.asked = []; g.log = [];
  $('#hub').classList.remove('on'); whoosh();
}
function arrive() {
  const E = ERAS[g.era];
  g.phase = 'talk'; g.flash = 1;
  $('#eraTag').textContent = `${E.em} ${E.name} · ${E.when} · ${E.place}`; $('#eraTag').classList.add('on');
  $('#sub').textContent = E.name + '에 와 있어요';
  $('#talk').classList.add('on');
  menu(true); ambience(g.era);
}
function drawEras() {
  const box = $('#eras'); box.textContent = '';
  ERAS.forEach((E, i) => {
    const b = document.createElement('button'); b.className = 'era' + (g.stamps.includes(i) ? ' done' : ''); b.dataset.i = i;
    const em = document.createElement('span'); em.className = 'em'; em.textContent = E.em;
    const n = document.createElement('b'); n.textContent = E.name;
    const s = document.createElement('span'); s.textContent = E.when;
    b.append(em, n, s); b.onclick = () => go(i); box.appendChild(b);
  });
}

function tick(dt) {
  g.t += dt;
  g.par.x += (g.mouse.x - g.par.x) * Math.min(1, dt * 3); g.par.y += (g.mouse.y - g.par.y) * Math.min(1, dt * 3);
  if (g.phase === 'warp') { g.warp += dt; if (g.warp >= 1.8) arrive(); }
  if (g.flash > 0) g.flash = Math.max(0, g.flash - dt * 1.5);
  if (g.typing) {
    const before = Math.floor(g.typed); g.typed += dt * 34;
    if (g.typed >= g.line.length) finishLine();
    else if (Math.floor(g.typed) !== before) { $('#sayText').textContent = g.line.slice(0, Math.floor(g.typed)); if (Math.floor(g.typed) % 3 === 0) blip(true); }
  }
  if (g.phase === 'talk' && g.era === 3 && soundOn && Math.floor(g.t / 7) !== Math.floor((g.t - dt) / 7)) { tone(1568, .5, 'sine', .05); tone(1568, .5, 'sine', .05, .25); }
}

// ---- 입력 ----
$('#say').addEventListener('click', finishLine);
cv.addEventListener('pointerdown', e => { g.drag = { x: e.clientX, y: e.clientY, mx: g.mouse.x, my: g.mouse.y }; try { cv.setPointerCapture(e.pointerId); } catch (er) {} });
cv.addEventListener('pointermove', e => {
  if (g.drag) { g.mouse.x = Math.max(-1.5, Math.min(1.5, g.drag.mx - (e.clientX - g.drag.x) / (W || 1) * 3)); g.mouse.y = Math.max(-1, Math.min(1, g.drag.my - (e.clientY - g.drag.y) / (H || 1) * 2)); }
  else if (e.pointerType === 'mouse') { g.mouse.x = (e.clientX / (W || 1) - .5) * 2; g.mouse.y = (e.clientY / (H || 1) - .5) * 2; }
});
const up = () => { g.drag = null; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
addEventListener('keydown', e => {
  const k = e.key;
  if (g.phase === 'talk') {
    if (k === ' ' || k === 'Enter') { if (g.typing) { e.preventDefault(); finishLine(); } }
    if (/^[1-9]$/.test(k) && !g.typing) { const b = $$('#opts button')[+k - 1]; if (b) b.click(); }
    if (k === 'ArrowLeft') g.mouse.x = Math.max(-1.5, g.mouse.x - .3); if (k === 'ArrowRight') g.mouse.x = Math.min(1.5, g.mouse.x + .3);
  } else if (g.phase === 'quiz' && /^[1-3]$/.test(k)) { const b = $$('#qOpts button')[+k - 1]; if (b) b.click(); }
  else if (g.phase === 'hub' && /^[1-4]$/.test(k)) go(+k - 1);
});

// ---- 소리 ----
let ac = null, master = null, soundOn = false, amb = null, nbuf = null;
function ensureAudio() {
  if (!soundOn) return;
  if (!ac) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.gain.value = .7; master.connect(ac.destination);
      const len = ac.sampleRate * 2; nbuf = ac.createBuffer(1, len, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; return; }
  }
  if (ac.state === 'suspended') { try { ac.resume().catch(() => {}); } catch (e) {} }
  if (g.phase === 'talk') ambience(g.era);
}
// 시대별 배경음: 강물(신석기)·시장 웅성임(신라)·바람(조선)·도시 웅웅(근대)
function ambience(i) {
  if (!soundOn || !ac) return;
  try {
    if (amb) { const old = amb; old.g.gain.setTargetAtTime(0, ac.currentTime, .3); setTimeout(() => { try { old.s.stop(); } catch (e) {} }, 1500); amb = null; }
    if (i < 0) return;
    const set = [[900, 'bandpass', .8, .1], [600, 'bandpass', 1.5, .07], [400, 'lowpass', .7, .08], [180, 'lowpass', .7, .1]][i];
    const s = ac.createBufferSource(); s.buffer = nbuf; s.loop = true; const fl = ac.createBiquadFilter(); fl.type = set[1]; fl.frequency.value = set[0]; fl.Q.value = set[2]; const gn = ac.createGain(); gn.gain.value = 0;
    s.connect(fl); fl.connect(gn); gn.connect(master); s.start(); gn.gain.setTargetAtTime(set[3], ac.currentTime, .5);

  } catch (e) {}
}
function tone(f, d, type, vol, delay) {
  if (!soundOn || !ac) return;
  try { const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), gn = ac.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); gn.gain.setValueAtTime(vol || .08, t); gn.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(gn); gn.connect(master); o.start(t); o.stop(t + d + .05); } catch (e) {}
}
const blip = quiet => tone(quiet ? 520 + Math.random() * 80 : 700, .05, 'square', quiet ? .015 : .03);
function whoosh() {
  if (!soundOn || !ac) return;
  try { const s = ac.createBufferSource(); s.buffer = nbuf; const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 2; const t = ac.currentTime; fl.frequency.setValueAtTime(200, t); fl.frequency.exponentialRampToValueAtTime(3000, t + 1.2); fl.frequency.exponentialRampToValueAtTime(300, t + 1.8); const gn = ac.createGain(); gn.gain.setValueAtTime(.0001, t); gn.gain.exponentialRampToValueAtTime(.25, t + .8); gn.gain.exponentialRampToValueAtTime(.0001, t + 1.9); s.connect(fl); fl.connect(gn); gn.connect(master); s.start(t); s.stop(t + 2); } catch (e) {}
}
function setSnd() {
  const b = $('#snd'); b.setAttribute('aria-pressed', String(soundOn)); b.textContent = soundOn ? '🔊' : '🔈';
  if (master && ac) { try { master.gain.setTargetAtTime(soundOn ? .7 : 0, ac.currentTime, .05); } catch (e) {} }
}
$('#snd').onclick = () => { soundOn = !soundOn; ensureAudio(); setSnd(); };
const fsEl = document.documentElement, fsBtn = $('#fs');
if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) fsBtn.hidden = true;
fsBtn.onclick = () => {
  try {
    const d = document, on = d.fullscreenElement || d.webkitFullscreenElement;
    const fn = on ? (d.exitFullscreen || d.webkitExitFullscreen) : (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
    if (fn) { const p = fn.call(on ? d : fsEl); if (p && p.catch) p.catch(() => {}); }
  } catch (e) {}
};
$('#qNext').onclick = toHub;
$('#again').onclick = () => { g.stamps = []; store.stamps = []; save(); $('#end').classList.remove('on'); toHub(); };

// ---- 시작 ----
if (Array.isArray(store.stamps)) g.stamps = store.stamps.filter(i => Number.isInteger(i) && i >= 0 && i < 4 && true).filter((v, i, a) => a.indexOf(v) === i);
if (g.stamps.length === 4) g.stamps = [];
addEventListener('resize', resize); resize();
drawEras(); $('#hub').classList.add('on');
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
  if (!manual) tick(dt);
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__test = {
  step(n) { manual = true; for (let i = 0; i < (n || 1); i++) tick(1 / 60); render(); },
  state() { return { phase: g.phase, t: g.t, era: g.era, stamps: g.stamps.slice(), asked: g.asked.slice(), log: g.log.slice(), typing: !!g.typing, tries: g.tries, sound: soundOn }; }
};
})();
