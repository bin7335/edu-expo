<style>

  .banner small{display:block;font-size:16px;color:var(--sub)}
  .banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .ov{position:absolute;inset:0;display:none;align-items:center;justify-content:flex-start;padding:86px 6vw 50px;pointer-events:none}

  .ov.dim{background:rgba(5,12,40,.45);justify-content:center}

<script>
(() => {
const $ = s => document.querySelector(s);
const KEY = 'edu-expo-ice-curling-v1';
const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
// 세계 단위: u = 던지는 방향(길이), v = 가로
const L = 820, SW = 280, R = 17, U0 = 70, HOG = 330, TEE = 640, BACK = 760, MU = 120, V0MIN = 150, V0MAX = 450, CURL = 16, MAXA = 12;
const RINGS = [[24, 10], [52, 7], [82, 5], [112, 2]];
const OBS = [[], [[555, -28], [572, 34]], [[600, 8], [552, -44], [668, -58]]];
const THROWS = 6;
const rec = { best: 0, sound: true };
try { const o = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; rec.best = Math.max(0, Math.floor(Number(o.best)) || 0); rec.sound = o.sound !== false; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) {} };
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
let rng = Math.random;

// ---------- 소리 ----------
let AC = null, master = null, nbuf = null;
const ensureAC = () => {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .45; master.connect(AC.destination); } catch (e) { AC = null; return; } }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
};
const canPlay = () => AC && rec.sound && phase !== 'attract';
function tone(f, d, type = 'sine', v = .3, f2 = 0, delay = 0) {
  if (!canPlay()) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .03);
}
function noise(d, v = .2, fq = 1200, q = .8) {
  if (!canPlay()) return;
  if (!nbuf) { nbuf = AC.createBuffer(1, AC.sampleRate * .5 | 0, AC.sampleRate); const a = nbuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = nbuf; f.type = 'bandpass'; f.frequency.value = fq; f.Q.value = q;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + .03);
}

// ---------- 상태 ----------
let phase = 'attract', prevPhase = 'aim', tick = 0, waitT = 0, bannerT = 0;
let stones = [], cur = null, parts = [], pops = [], flashes = [];
let round = 1, throwsLeft = THROWS, total = 0, roundScores = [], spinSel = 0, newBest = false;
let aimA = 0, aimP = .5, kbAim = false, drag = null, lastTick10 = -1;
let sweepKey = false, sweepBtn = false, sweepPtr = false, sweepTest = false, spaceLatch = false, sweepAnim = 0;
let shake = 0, cam = { u: L / 2, s: 1 }, W = 1280, Hh = 720, land = true, ovS = 1, folS = 1, ox = 640, oy = 360, longPx = 1000, botN = 0, attractT = 0;
const sweeping = () => phase === 'move' && cur && !cur.out && (sweepKey || sweepBtn || sweepPtr || sweepTest);
const powerFor = d => Math.max(0, Math.min(1, (Math.sqrt(2 * MU * d) - V0MIN) / (V0MAX - V0MIN)));
const ptsAt = s => { const d = Math.hypot(s.u - TEE, s.v); for (const [r, p] of RINGS) if (d <= r) return p; return 0; };
const roundScore = () => stones.reduce((a, s) => a + (s.team === 'me' && !s.out ? ptsAt(s) : 0), 0);
const mkStone = (u, v, team) => ({ u, v, vu: 0, vv: 0, team, spin: 0, rot: rng() * 6, out: false, fade: 1, sq: 0, sqA: 0, id: Math.random() });

function setupRound() {
  stones = OBS[round - 1].map(([u, v]) => mkStone(u, v, 'obs'));
  throwsLeft = THROWS; cur = null; parts = []; pops = []; flashes = [];
  updHud();
}
function doThrow(angDeg, power, spin) {
  if (phase !== 'aim' && phase !== 'attract') return false;
  const a = Math.max(-MAXA, Math.min(MAXA, angDeg)) * Math.PI / 180, p = Math.max(0, Math.min(1, power));
  const v0 = V0MIN + p * (V0MAX - V0MIN);
  const s = mkStone(U0, 0, 'me'); s.vu = Math.cos(a) * v0; s.vv = Math.sin(a) * v0; s.spin = spin; s.sq = 1; s.sqA = 0;
  stones.push(s); cur = s;
  if (phase === 'aim') { phase = 'move'; throwsLeft--; updHud(); $('#sweep').disabled = false; }
  shake = Math.max(shake, 2); noise(.35, .25 + p * .2, 700, .6); tone(180, .2, 'triangle', .2, 90);
  addParts(U0 - 10, 0, 6, 'rgba(255,255,255,.9)', 60);
  return true;
}
function addParts(u, v, n, col, sp) {
  for (let i = 0; i < n && parts.length < 70; i++) { const a = rng() * Math.PI * 2, k = sp * (.3 + rng()); parts.push({ u, v, vu: Math.cos(a) * k, vv: Math.sin(a) * k, life: 25 + rng() * 20, col }); }
}
function settle() {
  for (const s of stones) if (!s.out && s.u < HOG) knockOut(s);
  const sw = $('#sweep'); sw.disabled = true; sw.classList.remove('on'); sweepBtn = sweepPtr = false;
  if (phase === 'attract') { cur = null; return; }
  const c = cur; cur = null;
  if (c) {
    const p = c.out ? 0 : ptsAt(c);
    if (p) { pops.push({ u: c.u, v: c.v, txt: '+' + p, t: 0, big: p >= 7 }); flashes.push({ u: c.u, v: c.v, t: 0 }); tone(660 + p * 40, .15, 'triangle', .25); tone(990 + p * 40, .25, 'sine', .18, 0, .08); }
    else pops.push({ u: c.out ? Math.min(c.u, BACK) : c.u, v: c.out ? 0 : c.v, txt: c.out ? '밖으로!' : '아쉬워요', t: 0, big: 0 });
  }
  updHud(true);
  if (throwsLeft > 0) { phase = 'wait'; waitT = 0; }
  else {
    const rs = roundScore(); roundScores.push(rs); total += rs; phase = 'between'; bannerT = 0;
    $('#banner').innerHTML = ''; const b = $('#banner'); b.append(round + '라운드 ' + rs + '점'); const sm = document.createElement('small'); sm.textContent = round < 3 ? '다음 라운드엔 방해 스톤이 있어요' : '마지막 라운드 끝!'; b.append(sm); b.classList.add('on');
    tone(523, .12, 'triangle', .25); tone(659, .12, 'triangle', .25, 0, .1); tone(784, .25, 'triangle', .25, 0, .2);
    updHud(true);
  }
}
function knockOut(s) { if (s.out) return; s.out = true; s.vu *= .3; s.vv *= .3; }
function updHud(bump) {
  const sc = total + (phase === 'between' || phase === 'result' ? 0 : roundScore());
  const e = $('#score'); if (e.textContent !== String(sc)) { e.textContent = sc; if (bump) { e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); } }
  $('#round').textContent = round;
  const lf = $('#left'); if (lf.children.length !== THROWS) { lf.textContent = ''; for (let i = 0; i < THROWS; i++) lf.append(document.createElement('i')); }
  [...lf.children].forEach((x, i) => x.classList.toggle('used', i >= throwsLeft));
}
function finish() {
  phase = 'result'; $('#pauseBtn').disabled = true;
  newBest = total > rec.best; if (newBest) { rec.best = total; save(); }
  $('#best').textContent = rec.best;
  $('#rScore').textContent = total + '점';
  $('#rStat').textContent = roundScores.map((s, i) => (i + 1) + '라운드 ' + s + '점').join(' · ');
  $('#newrec').hidden = !newBest;
  showCard('result');
}
function showCard(id) {
  for (const c of ['ready', 'paused', 'result']) $('#' + c).classList.toggle('on', c === id);
  $('#ov').classList.toggle('on', !!id); $('#ov').classList.toggle('dim', id === 'paused' || id === 'result');
}
function start() {
  ensureAC(); document.body.classList.remove('attract');
  phase = 'aim'; round = 1; total = 0; roundScores = []; aimA = 0; aimP = .5; kbAim = false; drag = null;
  setupRound(); showCard(null); $('#banner').classList.remove('on'); $('#pauseBtn').disabled = false;
  tone(392, .1, 'triangle', .25); tone(587, .14, 'triangle', .25, 0, .08);
}
function pause() { if (!['aim', 'move', 'wait', 'between'].includes(phase)) return; prevPhase = phase; phase = 'paused'; drag = null; showCard('paused'); }
function resume() { if (phase !== 'paused') return; phase = prevPhase; showCard(null); }

// ---------- 물리 (고정 1/60초) ----------
const DT = 1 / 60;
function physics() {
  const sw = sweeping();
  let moving = false;
  for (const s of stones) {
    if (s.out && s.fade <= 0) continue;
    let sp = Math.hypot(s.vu, s.vv);
    if (sp > 0) {
      const mine = s === cur && sw, dec = MU * (mine ? .62 : 1) * DT;
      if (s.spin && sp > 8) { // 회전: 느려질수록 더 휜다
        const a = s.spin * CURL * (mine ? .6 : 1) * (.35 + .65 * (1 - Math.min(1, sp / 400)));
        const pu = -s.vv / sp, pv = s.vu / sp; s.vu += pu * a * DT; s.vv += pv * a * DT; sp = Math.hypot(s.vu, s.vv);
      }
      if (sp <= dec) { s.vu = s.vv = 0; } else { const k = (sp - dec) / sp; s.vu *= k; s.vv *= k; moving = true; }
      s.u += s.vu * DT; s.v += s.vv * DT; s.rot += (s.spin || .3) * sp * .00045 + s.spin * .01;
    }
    if (!s.out && (Math.abs(s.v) + R > SW / 2 || s.u - R > BACK)) { knockOut(s); if (phase !== 'attract') tone(140, .15, 'square', .08, 90); }
    if (s.out) s.fade -= .03;
    if (s.sq > 0) s.sq = Math.max(0, s.sq - .07);
  }
  for (let i = 0; i < stones.length; i++) for (let j = i + 1; j < stones.length; j++) {
    const a = stones[i], b = stones[j]; if (a.out || b.out) continue;
    const dx = b.u - a.u, dy = b.v - a.v, d = Math.hypot(dx, dy);
    if (d >= 2 * R || d === 0) continue;
    const nx = dx / d, ny = dy / d, ov = (2 * R - d) / 2;
    a.u -= nx * ov; a.v -= ny * ov; b.u += nx * ov; b.v += ny * ov;
    const rv = (a.vu - b.vu) * nx + (a.vv - b.vv) * ny;
    if (rv <= 0) continue;
    const imp = rv * (1 + .9) / 2;
    a.vu -= imp * nx; a.vv -= imp * ny; b.vu += imp * nx; b.vv += imp * ny;
    const ang = Math.atan2(ny, nx); a.sq = b.sq = Math.min(1, imp / 120); a.sqA = b.sqA = ang;
    if (imp > 15) {
      shake = Math.max(shake, Math.min(9, imp / 25));

}
function stepSim() {

function decor() {
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.u += p.vu * DT; p.v += p.vv * DT; p.vu *= .93; p.vv *= .93; if (--p.life <= 0) parts.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--) if (++pops[i].t > 70) pops.splice(i, 1);

// ---------- 그리기 ----------
const S = (u, v) => land ? [ox + (u - cam.u) * cam.s, oy + v * cam.s] : [ox + v * cam.s, oy - (u - cam.u) * cam.s];
let pebble = null;
function makePebble() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  for (let i = 0; i < 70; i++) { g.fillStyle = i % 2 ? 'rgba(255,255,255,.55)' : 'rgba(150,190,220,.18)'; g.fillRect((i * 37) % 64, (i * 53 + i * i) % 64, 1.5, 1.5); }
  pebble = ctx.createPattern(c, 'repeat');
}
function rectW(u0, v0, u1, v1) { const a = S(u0, v0), b = S(u1, v1); return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])]; }
function lineW(u0, v0, u1, v1, col, w) { const a = S(u0, v0), b = S(u1, v1); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
function render() {
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, 0, Hh); g.addColorStop(0, '#1b2b66'); g.addColorStop(1, '#0d163a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh);
  if (shake > .3) ctx.translate((Math.random() - .5) * shake * 2, (Math.random() - .5) * shake * 2);
  const s = cam.s;
  // 경기장 벽(2.5D 두께) + 얼음
  let [x, y, w, h] = rectW(-20, -SW / 2 - 12, L + 20, SW / 2 + 12);
  ctx.fillStyle = '#0a1230'; ctx.fillRect(x + 4, y + 10, w, h);
  ctx.fillStyle = '#2f6bff'; ctx.fillRect(x, y + 6, w, h);
  ctx.fillStyle = '#5c8dff'; ctx.fillRect(x, y, w, h);
  [x, y, w, h] = rectW(-8, -SW / 2, L + 8, SW / 2);
  const ig = land ? ctx.createLinearGradient(0, y, 0, y + h) : ctx.createLinearGradient(x, 0, x + w, 0);
  ig.addColorStop(0, '#f4fbff'); ig.addColorStop(.5, '#e4f2fb'); ig.addColorStop(1, '#f4fbff');
  ctx.fillStyle = ig; ctx.fillRect(x, y, w, h);
  if (pebble) { ctx.fillStyle = pebble; ctx.fillRect(x, y, w, h); }
  // 과녁
  const [tx, ty] = S(TEE, 0);
  const RC = ['#2f7bff', '#ffffff', '#ff3d5e', '#ffffff'];
  for (let i = 3; i >= 0; i--) { ctx.beginPath(); ctx.arc(tx, ty, RINGS[i][0] * s, 0, Math.PI * 2); ctx.fillStyle = RC[3 - i] === '#ffffff' && i === 0 ? '#fff6c8' : RC[3 - i]; ctx.fill(); }
  ctx.beginPath(); ctx.arc(tx, ty, 6 * s, 0, Math.PI * 2); ctx.fillStyle = '#ffcf33'; ctx.fill();

  lineW(TEE, -SW / 2, TEE, SW / 2, 'rgba(30,50,120,.35)', 1.5);
  lineW(BACK, -SW / 2, BACK, SW / 2, 'rgba(30,50,120,.5)', 2);
  lineW(30, 0, L, 0, 'rgba(30,50,120,.18)', 1.5);
  lineW(U0 - 22, -10, U0 - 22, 10, '#1d2745', 4);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `800 ${Math.max(10, 11 * s) | 0}px system-ui,"Malgun Gothic",sans-serif`; ctx.fillStyle = 'rgba(230,50,90,.65)';
  { const [hx, hy] = S(HOG, SW / 2 - 18); ctx.fillText('이 선은 넘어야 해요', hx + (land ? 0 : -50), hy + (land ? 0 : -10)); }
  for (const f of flashes) { const [fx, fy] = S(f.u, f.v); ctx.strokeStyle = `rgba(255,220,60,${1 - f.t / 30})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(fx, fy, (R + f.t * 1.6) * s, 0, Math.PI * 2); ctx.stroke(); }

  // 스톤 (화면 아래쪽이 앞)
  const order = stones.slice().sort((a, b) => S(a.u, a.v)[1] - S(b.u, b.v)[1]);

}
function drawStone(st, px, py) {

  ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, st.fade));
  ctx.translate(px, py);
  if (st.sq > 0) { const k = st.sq * .22; const a = land ? st.sqA : Math.atan2(-Math.cos(st.sqA), Math.sin(st.sqA)); ctx.rotate(a); ctx.scale(1 - k, 1 + k * .6); ctx.rotate(-a); }
  ctx.fillStyle = 'rgba(10,30,80,.2)'; ctx.beginPath(); ctx.ellipse(r * .15, r * .5, r * 1.05, r * .8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5b6273'; ctx.beginPath(); ctx.arc(0, r * .3, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c3c9d6'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e8ecf3'; ctx.lineWidth = Math.max(1, r * .1); ctx.beginPath(); ctx.arc(0, 0, r * .8, Math.PI * 1.05, Math.PI * 1.75); ctx.stroke();
  ctx.fillStyle = st.team === 'me' ? '#ff4d6d' : '#ffc93c'; ctx.beginPath(); ctx.arc(0, 0, r * .6, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(st.rot);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-r * .5, -r * .1, r, r * .3);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(-r * .5, -r * .16, r, r * .3);
  ctx.beginPath(); ctx.arc(-r * .5, 0, r * .16, 0, Math.PI * 2); ctx.fill();

}
function aimVec() {
  if (drag) {
    const dx = drag.x - drag.x0, dy = drag.y - drag.y0;
    const lu = land ? -dx : dy, lv = land ? -dy : -dx; // 당긴 반대 방향으로 날아감
    const len = Math.hypot(dx, dy);

  }

}

  const av = aimVec(), r = R * cam.s;

  if (!av) {
    const pulse = .5 + .5 * Math.sin(tick / 12);
    ctx.strokeStyle = `rgba(47,107,255,${.35 + pulse * .4})`; ctx.lineWidth = 3; ctx.setLineDash([6, 6]);

// ---------- 입력 ----------
stage.addEventListener('pointerdown', e => {
  ensureAC();
  if (e.target.closest('button, .card, a')) return;
  e.preventDefault();
  if (phase === 'aim') { drag = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY }; kbAim = false; lastTick10 = -1; }
  else if (phase === 'move') sweepPtr = true;
}, { passive: false });
window.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  const av = aimVec(); if (av) { const t = Math.floor(av.p * 10); if (t !== lastTick10) { lastTick10 = t; tone(300 + t * 60, .03, 'square', .05); } }
});
const endPtr = () => {
  if (drag) { const av = aimVec(); drag = null; if (av && av.p >= .05 && phase === 'aim') doThrow(av.a, av.p, spinSel); }
  sweepPtr = false; sweepBtn = false; $('#sweep').classList.remove('on');
};
window.addEventListener('pointerup', endPtr);
window.addEventListener('pointercancel', endPtr);
$('#sweep').addEventListener('pointerdown', e => { e.preventDefault(); if (phase === 'move') { sweepBtn = true; $('#sweep').classList.add('on'); } });
const SPINS = [[0, '🌀 회전 없음'], [1, '↻ 오른쪽 휘기'], [-1, '↺ 왼쪽 휘기']];
const curlUI = () => { $('#curl').textContent = SPINS.find(x => x[0] === spinSel)[1]; };
$('#curl').addEventListener('click', () => { const i = SPINS.findIndex(x => x[0] === spinSel); spinSel = SPINS[(i + 1) % 3][0]; curlUI(); tone(500 + spinSel * 120, .06, 'triangle', .15); });
document.addEventListener('keydown', e => {
  ensureAC();
  const k = e.key, onBtn = e.target && e.target.closest && e.target.closest('button, a');
  const arrows = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  if (arrows[k] && phase === 'aim') {
    e.preventDefault(); kbAim = true; const [dx, dy] = arrows[k];

$('#again').addEventListener('click', start);
$('#resume').addEventListener('click', resume);
$('#pauseBtn').addEventListener('click', () => phase === 'paused' ? resume() : pause());
const sndUI = () => { $('#snd').textContent = rec.sound ? '🔊' : '🔇'; $('#snd').setAttribute('aria-pressed', String(rec.sound)); };

// ---------- 루프 ----------
let last = performance.now(), acc = 0;

  acc += Math.min(.1, (now - last) / 1000); last = now;

  if (n === 6) acc = 0;

}
$('#best').textContent = rec.best; sndUI(); curlUI(); updHud();
// 시연 화면: 과녁에 스톤 몇 개 + 날아가는 스톤
stones = [[628, 12, 'me'], [655, -30, 'me'], [598, 52, 'obs'], [700, 40, 'me']].map(([u, v, t]) => mkStone(u, v, t)); botN = 4;
resize(); cam.u = L / 2 - (land && W > 900 ? 70 : 0); cam.s = ovS;

for (let i = 0; i < 70; i++) stepSim();
requestAnimationFrame(frame);

  seed(n) { rng = mulberry(n); },
  step(n = 1) { for (let i = 0; i < n; i++) stepSim(); render(); },
  settle(max = 3000) { let i = 0; while (phase === 'move' && i++ < max) stepSim(); render(); return i; },
