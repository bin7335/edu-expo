<style>
  :root{
    --bg:#eef6f3; --panel:#fff; --ink:#1d2b27; --sub:#5d6f69; --line:#d5e5df;
    --brand:#11806a; --brand2:#2fb48f; --soft:#e3f5ef; --ok:#11806a; --mid:#d48a0b; --bad:#d1495b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;flex-wrap:wrap}
  .logo{width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:22px;flex:none}
  header h1{margin:0;font-size:22px;letter-spacing:-.5px}
  header p{margin:0;font-size:13px;opacity:.9}
  .grow{flex:1}
  .lock{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#14532d;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 0 #0002;white-space:nowrap}
  .btn{border-radius:10px;padding:8px 13px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn:hover{filter:brightness(.96)}
  .btn.primary{background:var(--brand);color:#fff;border-color:transparent}
  .btn.small{font-size:12.5px;padding:6px 10px}
  main{display:grid;grid-template-columns:370px 1fr;gap:16px;padding:14px 20px 50px;max-width:1400px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .panel h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
  .side{display:flex;flex-direction:column;gap:12px}
  .form{display:flex;flex-direction:column;gap:9px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .g4{display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;gap:6px}
  label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
  input,select,textarea{font:inherit;font-size:14px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;min-width:0}
  textarea{resize:vertical;line-height:1.5;font-size:13px}
  .hint{font-size:11.5px;color:var(--sub);line-height:1.45}
  /* 일수 계산 카드 */
  .calc{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 12px}
  .calc .big{font-size:30px;font-weight:900;color:var(--brand);line-height:1}
  .calc .big small{font-size:14px;font-weight:700}
  .calc .det{font-size:12px;color:var(--sub);line-height:1.5}
  .meter{grid-column:1/-1}
  .meter .track{height:12px;border-radius:6px;background:#fff;border:1px solid var(--line);overflow:hidden;display:flex}
  .meter .used{background:#8fcfbd}
  .meter .now{background:var(--brand)}
  .meter .over{background:var(--bad)}
  .meter .lbl{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;color:var(--sub)}
  .alert{grid-column:1/-1;font-size:12.5px;font-weight:700;border-radius:8px;padding:6px 9px}
  .alert.ok{background:#fff;color:var(--ok)}
  .alert.mid{background:#fff4dc;color:#8a5a00}
  .alert.bad{background:#fde8eb;color:var(--bad)}
  .stage{min-width:0;display:flex;flex-direction:column;gap:10px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tab{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--sub)}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .acts{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .viewer{background:#cfe0da;border-radius:14px;padding:16px;overflow:hidden}
  .zoomer{margin:0 auto}
  /* 누적표 */
  .ledger{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:none;overflow-x:auto}
  .ledger.on{display:block}
  .ledger table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
  .ledger th,.ledger td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
  .ledger th{font-size:12px;color:var(--sub);font-weight:700}
  .ledger .stu{background:#f6fbf9;font-weight:800}
  .ledger .bar{display:inline-block;width:110px;height:9px;border-radius:5px;background:#eef2f1;vertical-align:middle;overflow:hidden;margin-right:6px}
  .ledger .bar i{display:block;height:100%}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px}
  .chip.ok{background:var(--soft);color:var(--ok)}
  .chip.mid{background:#fff4dc;color:#8a5a00}
  .chip.bad{background:#fde8eb;color:var(--bad)}
  .x{border:0;background:none;cursor:pointer;color:var(--sub);font-size:14px}
  .setrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
  .setrow input{width:70px}
  details summary{cursor:pointer;font-weight:700;font-size:13.5px}
  /* A4 서식 */
  .sheet{width:210mm;min-height:297mm;background:#fff;color:#111;padding:18mm 18mm 16mm;margin:0 auto;box-shadow:0 4px 16px rgba(20,60,50,.18);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:11pt;line-height:1.6;display:none}
  .sheet.on{display:block}
  .sheet h3{text-align:center;font-size:20pt;margin:2mm 0 7mm;letter-spacing:3px}
  .sheet table{width:100%;border-collapse:collapse;margin:2mm 0 4mm}
  .sheet th,.sheet td{border:1px solid #333;padding:2.4mm 2.4mm;vertical-align:middle;font-size:10.5pt}
  .sheet th{background:#eef5f2;font-weight:700;white-space:nowrap;width:26mm}
  .sheet td.c{text-align:center}
  .sheet .date{text-align:center;margin:8mm 0 3mm;font-size:12pt}
  .sheet .who{text-align:right;margin:2mm 10mm 0 0;font-size:11.5pt}
  .sheet .to{font-size:15pt;font-weight:800;margin-top:8mm;letter-spacing:2px}
  .sheet .sign{text-align:center;font-size:16pt;font-weight:800;letter-spacing:4px;margin-top:6mm}
  .sheet .note{font-size:9.5pt;color:#444;margin-top:4mm;line-height:1.5}
  .sheet .chk{display:inline-block;width:3.2mm;height:3.2mm;border:1px solid #333;vertical-align:-.4mm;margin:0 1mm 0 2mm;text-align:center;font-size:8pt;line-height:3mm}
  .sheet .photo{border:1px dashed #777;height:52mm;display:grid;place-items:center;color:#888;font-size:10pt}
  .sheet .lines div{border-bottom:1px solid #aaa;height:9mm}
  .sheet ol{margin:1mm 0;padding-left:6mm}
  .back{position:fixed;right:12px;bottom:10px;font-size:12px;color:var(--sub);background:rgba(255,255,255,.9);padding:5px 10px;border-radius:20px;text-decoration:none;border:1px solid var(--line);z-index:30}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2b27;color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.on{opacity:1}
  @media (max-width:860px){
    main{grid-template-columns:1fr;padding:10px}
    header{padding:10px 12px}
    header p{display:none}
    header h1{font-size:19px}
    .lock{font-size:11.5px;padding:5px 9px}
    .viewer{padding:8px}
    .tab{font-size:12.5px;padding:6px 10px}
    .acts{margin-left:0}
  }
  @media print{
    @page{size:A4;margin:14mm 16mm}
    body{background:#fff}
    header,.side,.tabs,.back,.ledger,.toast{display:none!important}
    main{display:block;padding:0;max-width:none}
    .viewer{background:none;padding:0}
    .zoomer{zoom:1!important;width:auto!important}
    .sheet{box-shadow:none;margin:0;min-height:0;width:auto;padding:0;break-after:page}
    .sheet:last-child{break-after:auto}
    body.print-all .sheet{display:block}
    .sheet table{break-inside:avoid}
  }
</style>

<body>
<header>
  <div class="logo" aria-hidden="true">🎒</div>
  <div>
    <h1>체험학습 서류척척</h1>
    <p>교외체험학습 신청서 · 승인 통지 · 결과 보고서를 한 번에, 수업일수는 자동으로</p>
  </div>
  <div class="grow"></div>
  <span class="lock" title="입력 내용은 이 브라우저(localStorage)에만 저장됩니다">🔒 내 PC에서만 처리 · 외부 전송 없음</span>
  <button type="button" id="wipeAll" class="wipe" title="공용 PC라면 다 쓴 뒤 눌러 주세요" style="font:inherit;font-size:12px;font-weight:700;border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:3px 10px;cursor:pointer;opacity:.85">🧹 이 PC 기록 모두 지우기</button>
</header>

<main>
  <section class="side">
    <div class="panel form" id="form">
      <h2>✏️ 신청 내용</h2>
      <div class="g4">
        <label class="f">학년<input id="grade" type="number" min="1" max="6"></label>
        <label class="f">반<input id="cls" type="number" min="1" max="20"></label>
        <label class="f">번호<input id="no" type="number" min="1" max="40"></label>
        <label class="f">학생 이름<input id="name"></label>
      </div>
      <div class="g2">
        <label class="f">시작일<input id="start" type="date"></label>
        <label class="f">마지막 날<input id="end" type="date"></label>
      </div>
      <div class="calc" id="calc"></div>
      <div class="g2">
        <label class="f">체험 형태<select id="type"><option>가족 동반 여행</option><option>친인척 방문</option><option>고적·문화 답사</option><option>체험 활동</option><option>진로 탐색</option><option>기타</option></select></label>
        <label class="f">장소<input id="place"></label>
      </div>
      <label class="f">목적 및 계획<textarea id="purpose" rows="3"></textarea></label>
      <div class="g2">
        <label class="f">보호자 성명<input id="guardian"></label>
        <label class="f">관계<input id="relation"></label>
      </div>
      <div class="g2">
        <label class="f">보호자 연락처<input id="phone" placeholder="010-0000-0000"></label>
        <label class="f">인솔자<input id="leader"></label>
      </div>
      <div class="g2">
        <label class="f">신청일<input id="applied" type="date"></label>
        <label class="f">담임교사<input id="teacher"></label>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn primary" type="button" id="addBtn">➕ 누적표에 저장</button>
        <button class="btn small" type="button" id="sampleBtn">↺ 예시로</button>
      </div>
    </div>
    <div class="panel">
      <details>
        <summary>⚙️ 설정 (허용 일수 · 공휴일 · 재량휴업일)</summary>
        <div class="setrow" style="margin-top:8px">연간 허용 <input id="limit" type="number" min="1" max="60"> 일 (학교 학칙에 맞게)</div>
        <label class="f" style="margin-top:8px">학교 재량휴업일·추가 휴일 (한 줄에 하나, YYYY-MM-DD)<textarea id="extra" rows="3"></textarea></label>
        <div class="hint">2026-2027년 법정 공휴일·대체공휴일은 내장되어 있어요. 새로 지정되는 임시공휴일은 위 칸에 추가하세요.</div>
      </details>
        <div class="hint" style="margin-top:6px">학교명·주소·전화 자료: 나이스 교육정보 개방 포털(2026-11-07 기준), 경북 안계초등학교 · 학생·보호자·교사 이름은 가상</div>
    </div>
  </section>

  <section class="stage">
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab on" data-t="0" role="tab">📝 신청서</button>
      <button class="tab" data-t="1" role="tab">✅ 승인 통지</button>
      <button class="tab" data-t="2" role="tab">📷 결과 보고서</button>
      <button class="tab" data-t="3" role="tab">📊 학생별 누적표 <span id="ledCount"></span></button>
      <div class="acts" id="acts">
        <button class="btn primary small" type="button" id="printOne">🖨 이 서식 인쇄</button>
        <button class="btn small" type="button" id="printAll">🖨 3종 모두 (PDF 저장)</button>
      </div>
    </div>
    <div class="viewer" id="viewer"><div class="zoomer" id="zoomer"></div></div>
    <div class="ledger" id="ledger"></div>
  </section>
</main>

  var SAMPLE_LEDGER = [
    {id:1, grade:'4', cls:'2', no:'7', name:'김하늘', start:'2026-04-13', end:'2026-04-17', place:'경주 역사 유적지구', type:'고적·문화 답사', days:5},
    {id:2, grade:'4', cls:'2', no:'7', name:'김하늘', start:'2026-06-08', end:'2026-06-12', place:'강원도 평창', type:'가족 동반 여행', days:5},
    {id:3, grade:'4', cls:'2', no:'7', name:'김하늘', start:'2026-09-21', end:'2026-09-23', place:'할머니 댁(전남 순천)', type:'친인척 방문', days:3},
    {id:4, grade:'4', cls:'2', no:'15', name:'이도윤', start:'2026-03-16', end:'2026-03-27', place:'호주 시드니', type:'가족 동반 여행', days:10},
    {id:5, grade:'4', cls:'2', no:'15', name:'이도윤', start:'2026-10-12', end:'2026-10-23', place:'일본 오사카·교토', type:'가족 동반 여행', days:10},
    {id:6, grade:'4', cls:'2', no:'21', name:'박서윤', start:'2026-05-11', end:'2026-05-13', place:'국립중앙과학관(대전)', type:'체험 활동', days:3}
  ];
  var $ = function(id){ return document.getElementById(id); };
  var state = {ledger: SAMPLE_LEDGER.slice(), limit: 20, extra: '', form: SAMPLE};
  var cur = 0, seq = 100;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var WD = ['일','월','화','수','목','금','토'];
  function pd(iso){ var d = new Date(iso + 'T00:00:00'); return isNaN(d) ? null : d; }
  function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function kd(s){ var d = pd(s); return d ? d.getFullYear() + '. ' + (d.getMonth()+1) + '. ' + d.getDate() + '.(' + WD[d.getDay()] + ')' : '____. __. __.'; }
  function kdl(s){ var d = pd(s); return d ? d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일' : '____년 __월 __일'; }
  function extraSet(){ var o = {}; String(state.extra || '').split(/[\s,]+/).forEach(function(x){ if (/^\d{4}-\d{2}-\d{2}$/.test(x)) o[x] = '재량휴업일'; }); return o; }

  // 수업일수: 시작-끝 포함, 토·일·공휴일·재량휴업일 제외
  function countDays(a, b){
    var s = pd(a), e = pd(b), r = {days:0, total:0, weekend:0, hol:[]};
    if (!s || !e || e < s) return r;
    var ex = extraSet();
    for (var d = new Date(s); d <= e && r.total < 400; d.setDate(d.getDate() + 1)){
      r.total++;
      var k = iso(d), w = d.getDay();
      if (w === 0 || w === 6){ r.weekend++; continue; }
      if (HOLIDAYS[k] || ex[k]){ r.hol.push((d.getMonth()+1) + '/' + d.getDate() + ' ' + (HOLIDAYS[k] || ex[k])); continue; }
      r.days++;
    }
    return r;
  }
  function stuKey(o){ return [o.grade, o.cls, o.no, o.name].join('|'); }
  function schoolYear(s){ var d = pd(s); if (!d) return 0; return d.getMonth() < 2 ? d.getFullYear() - 1 : d.getFullYear(); } // 3월 시작 학년도
  function usedBefore(f){
    var k = stuKey(f), y = schoolYear(f.start);
    return state.ledger.filter(function(r){ return stuKey(r) === k && schoolYear(r.start) === y && !(r.start === f.start && r.end === f.end); })
      .reduce(function(a, r){ return a + (+r.days || 0); }, 0);
  }
  function level(total, limit){ return total > limit ? 'bad' : total >= limit * 0.8 ? 'mid' : 'ok'; }

  function read(){ var o = {}; FIELDS.forEach(function(k){ o[k] = $(k).value.trim(); }); return o; }
  function fill(o){ FIELDS.forEach(function(k){ $(k).value = o[k] == null ? '' : o[k]; }); }

  function renderCalc(f, c){
    var used = usedBefore(f), limit = state.limit, total = used + c.days, lv = level(total, limit);
    var scale = Math.max(limit, total);
    var pct = function(n){ return (n / scale * 100) + '%'; };
    var nowOk = Math.max(0, Math.min(c.days, limit - used)), over = c.days - nowOk;
    var det = c.total ? '전체 ' + c.total + '일 중 주말 ' + c.weekend + '일' + (c.hol.length ? ', 공휴일 ' + c.hol.length + '일(' + c.hol.join(', ') + ')' : '') + ' 제외' : '기간을 입력하세요';
    var msg = lv === 'bad' ? '⛔ 연간 허용 ' + limit + '일을 ' + (total - limit) + '일 넘어요! 초과일은 결석 처리될 수 있어요.'
      : lv === 'mid' ? '⚠️ 이번 신청 후 남은 일수 ' + (limit - total) + '일 — 허용 일수에 가까워요.'
      : '✅ 이번 신청 후 남은 일수 ' + (limit - total) + '일';
    $('calc').innerHTML =
      '<div class="big">' + c.days + '<small>일</small></div>' +
      '<div class="det"><b>수업일수(자동 계산)</b><br>' + esc(det) + '</div>' +
      '<div class="meter"><div class="track">' +
        '<div class="used" style="width:' + pct(Math.min(used, limit)) + '"></div>' +
        (used > limit ? '<div class="over" style="width:' + pct(used - limit) + '"></div>' : '') +
        '<div class="now" style="width:' + pct(nowOk) + '"></div>' +
        (over > 0 ? '<div class="over" style="width:' + pct(over) + '"></div>' : '') +
      '</div><div class="lbl"><span>올해 이미 사용 ' + used + '일 + 이번 ' + c.days + '일 = <b>' + total + '일</b></span><span>허용 ' + limit + '일</span></div></div>' +
      '<div class="alert ' + lv + '">' + msg + '</div>';
    return {used:used, total:total, lv:lv};
  }

  function sheets(f, c, u){
    var stu = esc(f.grade) + '학년 ' + esc(f.cls) + '반 ' + esc(f.no) + '번 ' + esc(f.name);
    var period = kd(f.start) + ' - ' + kd(f.end) + ' (수업일수 ' + c.days + '일)';
    var types = ['가족 동반 여행','친인척 방문','고적·문화 답사','체험 활동','진로 탐색','기타'];
    var typeBoxes = types.map(function(t){ return '<span class="chk">' + (t === f.type ? '✔' : '') + '</span>' + t; }).join(' ');
    var S = [];
    S.push(
      '<h3>교외체험학습 신청서</h3>' +
      '<table><tr><th>학생</th><td colspan="3">' + stu + '</td></tr>' +
      '<tr><th>기간</th><td colspan="3">' + period + '</td></tr>' +
      '<tr><th>체험 형태</th><td colspan="3" style="font-size:10pt">' + typeBoxes + '</td></tr>' +
      '<tr><th>장소</th><td colspan="3">' + esc(f.place) + '</td></tr>' +
      '<tr><th>목적 및 계획</th><td colspan="3" style="height:40mm;vertical-align:top">' + esc(f.purpose).replace(/\n/g, '<br>') + '</td></tr>' +
      '<tr><th>보호자</th><td>' + esc(f.guardian) + ' (관계: ' + esc(f.relation) + ')</td><th>연락처</th><td>' + esc(f.phone) + '</td></tr>' +
      '<tr><th>인솔자</th><td colspan="3">' + esc(f.leader) + '</td></tr>' +
      '<tr><th>연간 사용</th><td colspan="3">올해 이미 ' + u.used + '일 + 이번 ' + c.days + '일 = ' + u.total + '일 (허용 ' + state.limit + '일)</td></tr></table>' +
      '<p style="margin:5mm 0 0">위와 같이 교외체험학습을 신청합니다.</p>' +
      '<div class="date">' + kdl(f.applied) + '</div>' +
      '<div class="who">학생 &nbsp; ' + esc(f.name) + ' &nbsp; (서명)</div><div class="who">보호자 &nbsp; ' + esc(f.guardian) + ' &nbsp; (서명)</div>' +
      '<div class="to">' + SCHOOL.name + '장 귀하</div>' +
      '<div class="note">※ 체험학습 시작 3일 전까지(학교 규정 확인) 담임교사에게 제출합니다.<br>※ 체험학습 중 학생 안전은 보호자 책임 아래 이루어지며, 매일 담임교사와 연락이 닿도록 합니다.</div>'
    );
    S.push(
      '<h3>교외체험학습 승인 통지서</h3>' +
      '<table><tr><th>학생</th><td>' + stu + '</td></tr><tr><th>기간</th><td>' + period + '</td></tr>' +
      '<tr><th>장소</th><td>' + esc(f.place) + '</td></tr><tr><th>체험 형태</th><td>' + esc(f.type) + '</td></tr>' +
      '<tr><th>승인 여부</th><td><span class="chk">✔</span>승인 &nbsp; <span class="chk"></span>불승인 (사유: )</td></tr></table>' +
      '<p style="margin:6mm 0 2mm">귀 가정에서 신청하신 교외체험학습을 위와 같이 승인하오니, 다음 사항을 꼭 지켜 주시기 바랍니다.</p>' +
      '<ol><li>체험학습 기간 동안 학생의 안전에 각별히 유의해 주십시오.</li>' +
      '<li>체험학습이 끝난 뒤 <b>7일 이내</b>(학교 규정 확인)에 결과 보고서와 증빙 자료를 담임교사에게 제출해 주십시오.</li>' +
      '<li>결과 보고서를 내지 않거나 계획과 다르게 운영한 경우 결석으로 처리될 수 있습니다.</li>' +
      '<li>계획이 바뀌거나 취소되면 바로 담임교사에게 알려 주십시오.</li></ol>' +
      '<div class="date" style="margin-top:14mm">' + kdl(f.applied) + '</div>' +
      '<div class="sign">' + SCHOOL.name + '장</div>' +
      '<p class="note" style="text-align:center">담임교사 ' + esc(f.teacher) + ' &nbsp;·&nbsp; 이 통지서는 보호자에게 전달됩니다.<br>' + SCHOOL.name + ' (' + SCHOOL.zip + ') ' + SCHOOL.addr + ' · 전화 ' + SCHOOL.tel + ' · 팩스 ' + SCHOOL.fax + '</p>'
    );
    S.push(
      '<h3>교외체험학습 결과 보고서</h3>' +
      '<table><tr><th>학생</th><td>' + stu + '</td></tr><tr><th>기간</th><td>' + period + '</td></tr><tr><th>장소</th><td>' + esc(f.place) + '</td></tr></table>' +
      '<table><tr><th style="vertical-align:top">한 일<br><span style="font-weight:400;font-size:9pt">(날짜별)</span></th><td class="lines" style="padding:0 3mm"><div></div><div></div><div></div><div></div><div></div></td></tr>' +
      '<tr><th style="vertical-align:top">배우고<br>느낀 점</th><td class="lines" style="padding:0 3mm"><div></div><div></div><div></div><div></div></td></tr></table>' +
      '<div class="photo">사진·입장권·안내 자료 등을 붙이는 곳</div>' +
      '<table style="margin-top:5mm"><tr><th>보호자 확인</th><td>' + esc(f.guardian) + ' &nbsp; (서명)</td><th>담임 확인</th><td>' + esc(f.teacher) + ' &nbsp; (서명)</td></tr></table>' +
      '<div class="note">※ 체험학습 종료 후 7일 이내 제출. 계획서의 목적(' + esc(f.purpose).slice(0, 40) + (f.purpose.length > 40 ? '…' : '') + ')과 연결해 써 주세요.</div>'
    );
    return S;
  }

  function renderLedger(){
    var groups = {}, order = [];
    state.ledger.forEach(function(r){ var k = stuKey(r); if (!groups[k]){ groups[k] = []; order.push(k); } groups[k].push(r); });
    var lim = state.limit, html = '<table><thead><tr><th>학생 / 기간</th><th>장소 · 형태</th><th>일수</th><th>누적 (허용 ' + lim + '일)</th><th></th></tr></thead><tbody>';
    order.sort(function(a, b){ var x = a.split('|'), y = b.split('|'); return (x[0]-y[0]) || (x[1]-y[1]) || (x[2]-y[2]) || (x[3] < y[3] ? -1 : 1); });
    order.forEach(function(k){
      var rs = groups[k].sort(function(a, b){ return a.start < b.start ? -1 : 1; });
      var sum = rs.reduce(function(a, r){ return a + (+r.days || 0); }, 0), lv = level(sum, lim);
      var p = Math.min(100, sum / lim * 100), col = lv === 'bad' ? 'var(--bad)' : lv === 'mid' ? 'var(--mid)' : 'var(--brand)';
      html += '<tr class="stu"><td>' + esc(rs[0].grade) + '-' + esc(rs[0].cls) + ' ' + esc(rs[0].no) + '번 ' + esc(rs[0].name) + '</td><td>' + rs.length + '건</td><td>' + sum + '일</td>' +
        '<td><span class="bar"><i style="width:' + p + '%;background:' + col + '"></i></span><span class="chip ' + lv + '">' + (lv === 'bad' ? '초과 ' + (sum - lim) + '일' : '남은 ' + (lim - sum) + '일') + '</span></td><td></td></tr>';
      var run = 0;
      rs.forEach(function(r){
        run += +r.days || 0;
        html += '<tr><td style="padding-left:18px">' + kd(r.start) + ' - ' + kd(r.end).slice(6) + '</td><td>' + esc(r.place) + ' · ' + esc(r.type) + '</td><td>' + r.days + '일</td><td style="color:' + (run > lim ? 'var(--bad)' : 'var(--sub)') + '">누적 ' + run + '일' + (run > lim ? ' ⛔' : '') + '</td>' +
          '<td><button class="x" data-del="' + r.id + '" title="이 기록 지우기" aria-label="기록 삭제">✕</button></td></tr>';
      });
    });
    html += '</tbody></table>';
    if (!order.length) html = '<p class="hint">아직 저장된 기록이 없어요. 왼쪽에서 [누적표에 저장]을 눌러 보세요.</p>';
    $('ledger').innerHTML = '<p class="hint" style="margin:0 0 8px">학년도(3월-이듬해 2월) 기준 누적이에요. 같은 학년·반·번호·이름이면 같은 학생으로 묶어요.</p>' + html;
    $('ledCount').textContent = '(' + order.length + '명)';
  }

  function render(){
    var f = read(), c = countDays(f.start, f.end), u = renderCalc(f, c);
    var S = sheets(f, c, u);
    $('zoomer').innerHTML = S.map(function(h, i){ return '<article class="sheet' + (i === cur ? ' on' : '') + '">' + h + '</article>'; }).join('');
    renderLedger();
    show();
    fit();
    return {f:f, c:c, u:u};
  }
  function show(){
    var led = cur === 3;
    $('viewer').style.display = led ? 'none' : '';
    $('ledger').classList.toggle('on', led);
    $('acts').style.visibility = led ? 'hidden' : '';
  }
  function fit(){
    var z = $('zoomer'), avail = $('viewer').clientWidth - (window.innerWidth < 860 ? 16 : 32);
    if (avail <= 0) return;
    var px = 210 * 96 / 25.4, s = Math.min(1, avail / px);
    z.style.zoom = s; z.style.width = px + 'px';
  }
  function save(){ try { state.form = read(); localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
  function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ e.classList.remove('on'); }, 2200); }

  var t;
  $('form').addEventListener('input', function(){ render(); clearTimeout(t); t = setTimeout(save, 300); });
  $('limit').addEventListener('input', function(){ state.limit = Math.max(1, parseInt(this.value, 10) || 20); render(); save(); });
  $('extra').addEventListener('input', function(){ state.extra = this.value; render(); save(); });
  $('tabs').addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if (!b) return;
    cur = +b.dataset.t;
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on', x === b); });
    document.querySelectorAll('.sheet').forEach(function(s, i){ s.classList.toggle('on', i === cur); });
    show(); fit();
  });
  $('ledger').addEventListener('click', function(e){
    var b = e.target.closest('[data-del]'); if (!b) return;
    state.ledger = state.ledger.filter(function(r){ return String(r.id) !== b.dataset.del; });
    render(); save(); toast('기록을 지웠어요.');
  });
  $('addBtn').onclick = function(){
    var f = read(), c = countDays(f.start, f.end);
    if (!f.name || !c.total){ toast('학생 이름과 기간을 확인해 주세요.'); return; }
    var dup = state.ledger.filter(function(r){ return stuKey(r) === stuKey(f) && r.start === f.start && r.end === f.end; })[0];
    var rec = {id: dup ? dup.id : ++seq + Date.now() % 100000, grade:f.grade, cls:f.cls, no:f.no, name:f.name, start:f.start, end:f.end, place:f.place, type:f.type, days:c.days};
    if (dup) state.ledger[state.ledger.indexOf(dup)] = rec; else state.ledger.push(rec);
    var tot = usedBefore(f) + c.days;
    render(); save();
    toast((dup ? '기록을 고쳤어요. ' : '누적표에 저장했어요. ') + f.name + ' 올해 ' + tot + '일 / ' + state.limit + '일');
  };
  $('sampleBtn').onclick = function(){ fill(SAMPLE); render(); save(); };
  $('printOne').onclick = function(){ document.body.classList.remove('print-all'); window.print(); };
  $('printAll').onclick = function(){ document.body.classList.add('print-all'); window.print(); };
  window.addEventListener('afterprint', function(){ document.body.classList.remove('print-all'); });
  window.addEventListener('resize', fit);

  try { var st = JSON.parse(localStorage.getItem(KEY) || 'null'); if (st && st.ledger) state = st; } catch(e){}
  fill(state.form || SAMPLE);
  $('limit').value = state.limit; $('extra').value = state.extra || '';
  render();
  if (location.hash === '#printall') document.body.classList.add('print-all');
  if (location.hash === '#ledger') document.querySelectorAll('.tab')[3].click();

  // 헤드리스 확인용
  if (location.hash === '#selftest'){
    var log = [];
    log.push('nov23-27:' + countDays('2026-11-23', '2026-11-27').days);
    log.push('chuseok(9/21-10/9):' + countDays('2026-09-21', '2026-10-09').days);
    log.push('weekendOnly:' + countDays('2026-11-28', '2026-11-29').days);
    var r = render(); log.push('used:' + r.u.used + ' total:' + r.u.total + ' lv:' + r.u.lv);
    $('addBtn').click(); log.push('ledgerRows:' + state.ledger.length);
    $('name').value = '이도윤'; $('no').value = '15'; $('form').dispatchEvent(new Event('input'));
    log.push('doyoonAlert:' + document.querySelector('.alert').className);
    state.extra = '2026-11-25'; log.push('withExtra:' + countDays('2026-11-23', '2026-11-27').days);
    var o = document.createElement('pre'); o.id = 'selftest'; o.textContent = log.join(' | '); document.body.appendChild(o);
    setTimeout(function(){ clearTimeout(t); localStorage.removeItem(KEY); }, 500);
  }
})();
</script>
<script>/* 공용 PC 개인정보 보호: 이 페이지가 저장한 기록 전체 삭제 */document.getElementById("wipeAll").addEventListener("click",function(){if(!confirm("이 PC에 저장된 이 도구의 기록(학생 정보·문장 등)을 모두 지울까요? 되돌릴 수 없어요."))return;try{localStorage.removeItem("edu-expo.fieldtrip-form.v1")}catch(e){}location.reload();});</script>
