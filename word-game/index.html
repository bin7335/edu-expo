<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- csp:auto --><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><!-- /csp:auto -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>낱말 놀이터 - 단어장으로 바로 만드는 게임</title>
<meta name="description" content="단어와 뜻만 입력하면 카드 짝 맞추기, 돌림판, 빠른 퀴즈 게임이 바로 만들어지는 교실용 단어 게임 생성기.">
<style>
  :root{--bg:#fff8ef;--card:#fff;--ink:#2a2233;--sub:#6e6577;--line:#f0e4d4;--pri:#ff6b4a;--pri2:#ffe6dd;--g:#2bb673;--b:#3d7bff;--y:#ffc233;--p:#8b5cf6}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:2px solid var(--line)}
  .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#ff6b4a,#ffc233);display:grid;place-items:center;font-size:23px}
  header h1{margin:0;font-size:22px}
  header small{display:block;color:var(--sub);font-size:13px;font-weight:500}
  .wrap{flex:1;display:grid;grid-template-columns:340px 1fr;gap:18px;padding:18px 24px}
  .panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
  .btn{border:0;font:inherit;font-weight:700;font-size:15px;padding:9px 14px;border-radius:11px;cursor:pointer;background:var(--pri2);color:var(--pri)}
  .btn.pri{background:var(--pri);color:#fff}
  .btn.ghost{background:#f4f1ec;color:var(--sub)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:default}
  input,select,textarea{font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;background:#fffdf9;color:var(--ink);min-width:0}
  input:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}

  /* 편집기 */
  .ed{display:flex;flex-direction:column;gap:10px;min-height:0}
  .ed .top{display:flex;gap:8px}
  .ed .top input{flex:1;font-weight:700}
  .rows{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 330px);min-height:160px;overflow:auto;padding-right:2px}
  .r{display:grid;grid-template-columns:22px 1fr 1fr 28px;gap:5px;align-items:center}
  .r b{font-size:12px;color:var(--sub);text-align:center}
  .r .x{border:0;background:transparent;color:#c9b9a8;font-size:18px;cursor:pointer;padding:0}
  .r .x:hover{color:var(--pri)}
  .hdr{display:grid;grid-template-columns:22px 1fr 1fr 28px;gap:5px;font-size:12px;font-weight:700;color:var(--sub)}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  .count{font-size:13px;color:var(--sub)}

  /* 게임 고르기 */
  .main{display:flex;flex-direction:column;gap:14px;min-width:0}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .mode{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;display:flex;gap:12px;align-items:center;color:var(--ink)}
  .mode .ic{font-size:30px;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
  .mode b{font-size:17px;display:block}
  .mode span{font-size:13px;color:var(--sub)}
  .mode.on{border-color:var(--pri);box-shadow:0 4px 0 var(--pri2)}
  .stage{flex:1;position:relative;min-height:420px;display:flex;flex-direction:column}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .bar h2{margin:0;font-size:19px}
  .stat{display:flex;gap:8px}
  .pill{background:#f7f1e9;padding:5px 12px;border-radius:99px;font-weight:700;font-size:14px}

  /* 짝 맞추기 */
  .grid{flex:1;display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:10px;perspective:900px}
  .fc{position:relative;min-height:74px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
  .fc.open,.fc.done{transform:rotateY(180deg)}
  .fc>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:grid;place-items:center;padding:6px;text-align:center;font-weight:800;word-break:keep-all;line-height:1.25}
  .fc .back{background:linear-gradient(135deg,#ff8a65,#ffc233);color:#fff;font-size:26px;box-shadow:0 3px 0 #e2553a}
  .fc .face{transform:rotateY(180deg);background:#fff;border:2.5px solid var(--b);color:var(--b);font-size:clamp(14px,1.6vw,20px)}
  .fc .face.m{border-color:var(--p);color:var(--p);font-size:clamp(13px,1.3vw,17px)}
  .fc.done .face{background:#e9f9f0;border-color:var(--g);color:var(--g)}
  .fc.shake{animation:shake .4s}
  @keyframes shake{25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}

  /* 돌림판 */
  .wheelbox{flex:1;display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
  .wheel{position:relative;width:min(380px,80vw,calc(100vh - 300px));min-width:240px;aspect-ratio:1}
  .wheel canvas{width:100%;height:100%;display:block}
  .wheel .pin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
  .wheel .hub{position:absolute;inset:0;margin:auto;width:22%;height:22%;border-radius:50%;background:#fff;border:5px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:15px;cursor:pointer}
  .wside{display:flex;flex-direction:column;gap:12px;align-items:center;min-width:220px;max-width:300px}
  .card-res{background:#fff7e6;border:2px dashed var(--y);border-radius:18px;padding:16px;text-align:center;width:100%;min-height:140px;display:flex;flex-direction:column;justify-content:center;gap:8px}
  .card-res .w{font-size:32px;font-weight:900;word-break:keep-all}
  .card-res .m{font-size:18px;color:var(--p);font-weight:700;min-height:1.4em}

  /* 퀴즈 */
  .quiz{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
  .q-prog{width:100%;max-width:640px;height:10px;background:#f4ece2;border-radius:99px;overflow:hidden}
  .q-prog i{display:block;height:100%;background:var(--pri);transition:width .3s}
  .q-ask{font-size:15px;color:var(--sub);font-weight:700}
  .q-word{font-size:clamp(30px,5vw,52px);font-weight:900;word-break:keep-all}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
  .opt{font:inherit;font-size:18px;font-weight:700;padding:16px 12px;border-radius:14px;border:0;cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);word-break:keep-all}
  .opt:nth-child(1){background:#ff6b4a}.opt:nth-child(2){background:#3d7bff}.opt:nth-child(3){background:#2bb673}.opt:nth-child(4){background:#8b5cf6}
  .opt.dim{opacity:.3}
  .opt.right{outline:4px solid var(--ink);opacity:1}
  .fb{font-size:20px;font-weight:800;min-height:28px}
  .big{font-size:56px}

  .overlay{position:absolute;inset:0;background:rgba(255,248,239,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:20px;z-index:5;text-align:center}
  .overlay.on{display:flex}
  .overlay h3{margin:0;font-size:30px}

  .modal{position:fixed;inset:0;background:rgba(40,30,50,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal.on{display:flex}
  .modal .box{background:#fff;border-radius:18px;padding:20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:10px}
  .modal textarea{width:100%;min-height:90px;font-size:13px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
  .toast.on{opacity:1}

  footer{text-align:right;padding:0 24px 10px}
  footer a{color:var(--sub);font-size:13px;text-decoration:none}

  @media (max-width:880px){
    header{padding:10px 14px}
    .wrap{grid-template-columns:minmax(0,1fr);padding:12px;gap:12px}
    .main{order:-1}
    .ed .top select{width:120px}
    .rows{max-height:260px}
    .modes{grid-template-columns:repeat(3,1fr);gap:6px}
    .mode{flex-direction:column;text-align:center;padding:10px 4px;gap:4px}
    .mode .ic{width:40px;height:40px;font-size:24px}
    .mode b{font-size:14px}
    .mode span{display:none}
    .fc{min-height:62px}
    .opts{grid-template-columns:1fr}
    .opt{padding:13px}
  }
</style>

<body>
<header>
  <div class="logo">🧩</div>
  <div><h1>낱말 놀이터</h1><small>단어장만 넣으면 게임 3종이 뚝딱</small></div>
</header>

<div class="wrap">
  <aside class="panel ed">
    <div class="top">
      <input id="title" aria-label="단어장 이름">
      <select id="preset" aria-label="예시 단어장">
        <option value="">예시 불러오기</option>
        <option value="fruit">과일 영어</option>
        <option value="sci">과학 개념</option>
        <option value="capital">나라와 수도</option>
      </select>
    </div>
    <div class="hdr"><span></span><span>단어 (앞면)</span><span>뜻 (짝)</span><span></span></div>
    <div class="rows" id="rows"></div>
    <div class="tools">
      <button class="btn" id="add">+ 한 줄 추가</button>
      <button class="btn ghost" id="bulk">붙여넣기</button>
      <button class="btn pri" id="share">🔗 공유 링크</button>
    </div>
    <div class="count" id="count"></div>
  </aside>

  <section class="main">
    <div class="modes" id="modes">
      <button class="mode on" data-g="match"><div class="ic" style="background:#ffe6dd">🃏</div><div><b>짝 맞추기</b><span>뒤집어서 단어·뜻 짝 찾기</span></div></button>
      <button class="mode" data-g="wheel"><div class="ic" style="background:#fff2cc">🎡</div><div><b>돌림판</b><span>돌려서 나온 단어의 뜻 말하기</span></div></button>
      <button class="mode" data-g="quiz"><div class="ic" style="background:#e5ecff">⚡</div><div><b>빠른 퀴즈</b><span>4지선다 문제가 자동으로!</span></div></button>
    </div>
    <div class="panel stage" id="stage"></div>
  </section>
</div>
<footer><a href="../">← 전체 데모 보기</a></footer>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

const PRESETS = {
  fruit: {t:"과일 영어 단어", w:[["apple","사과"],["banana","바나나"],["grape","포도"],["peach","복숭아"],["strawberry","딸기"],["watermelon","수박"],["pear","배"],["lemon","레몬"]]},
  sci: {t:"과학 개념 짝꿍", w:[["증발","액체가 기체로 변함"],["응결","기체가 액체로 변함"],["용해","물질이 녹아 섞임"],["광합성","식물이 빛으로 양분을 만듦"],["자석","쇠붙이를 끌어당김"],["마찰력","움직임을 방해하는 힘"]]},
  capital: {t:"나라와 수도", w:[["대한민국","서울"],["일본","도쿄"],["프랑스","파리"],["영국","런던"],["이집트","카이로"],["캐나다","오타와"],["호주","캔버라"],["브라질","브라질리아"]]}
};
let data = JSON.parse(JSON.stringify(PRESETS.fruit));

// ---- URL 해시 공유 ----
function encode(d){ return btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function decode(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s += "="; return JSON.parse(decodeURIComponent(escape(atob(s)))); }
function loadHash(){
  const m = location.hash.match(/w=([\w-]+)/);
  if(!m) return false;
  try{
    const d = decode(m[1]);
    if(d && Array.isArray(d.w)){ data = {t: String(d.t||"공유된 단어장").slice(0,40), w: d.w.filter(p => Array.isArray(p) && p.length>=2).map(p => [String(p[0]).slice(0,40), String(p[1]).slice(0,60)]).slice(0,40)}; return true; }
  }catch(e){ toast("링크를 읽지 못해 예시 단어장을 보여 드려요"); }
  return false;
}

// ---- 편집기 ----
function pairs(){ return data.w.filter(p => p[0].trim() && p[1].trim()).map(p => [p[0].trim(), p[1].trim()]); }
function renderRows(){
  $("#title").value = data.t;
  $("#rows").innerHTML = data.w.map((p,i) => `<div class="r"><b>${i+1}</b><input data-i="${i}" data-k="0" value="${esc(p[0])}" placeholder="단어"><input data-i="${i}" data-k="1" value="${esc(p[1])}" placeholder="뜻"><button class="x" data-del="${i}" title="삭제">✕</button></div>`).join("");
  updCount();
}
function updCount(){
  const n = pairs().length;
  $("#count").textContent = `완성된 짝 ${n}개` + (n < 4 ? " · 퀴즈는 4개 이상 필요해요" : " · 게임 준비 완료!");
}
let rebuildT;
$("#rows").addEventListener("input", e => {
  const t = e.target; if(t.dataset.i == null) return;
  data.w[+t.dataset.i][+t.dataset.k] = t.value; updCount();
  clearTimeout(rebuildT); rebuildT = setTimeout(startGame, 700);
});
$("#rows").addEventListener("click", e => {
  const d = e.target.dataset.del; if(d == null) return;
  data.w.splice(+d,1); if(!data.w.length) data.w.push(["",""]); renderRows(); startGame();
});
$("#title").addEventListener("input", e => { data.t = e.target.value; });
$("#add").onclick = () => { data.w.push(["",""]); renderRows(); const ins = $$("#rows input"); ins[ins.length-2].focus(); $("#rows").scrollTop = 1e6; };
$("#preset").onchange = e => { const p = PRESETS[e.target.value]; if(p){ data = JSON.parse(JSON.stringify(p)); renderRows(); startGame(); } e.target.value = ""; };
$("#bulk").onclick = () => {
  modal(`<h3 style="margin:0">한꺼번에 붙여넣기</h3>
    <div class="count">한 줄에 하나씩 <b>단어 - 뜻</b> 또는 <b>단어[탭]뜻</b> 형식으로 넣어 주세요. (엑셀 두 칸 복사도 OK)</div>
    <textarea id="bulkTxt" style="min-height:180px" placeholder="dog - 개&#10;cat - 고양이"></textarea>
    <div class="tools"><button class="btn pri" id="bulkOk">이 내용으로 바꾸기</button><button class="btn ghost" data-close>닫기</button></div>`);
  $("#bulkTxt").value = pairs().map(p => p.join(" - ")).join("\n");
  $("#bulkOk").onclick = () => {
    const w = $("#bulkTxt").value.split("\n").map(l => l.split(/\t|\s+-\s+|\s*[:=]\s*/)).filter(a => a.length >= 2 && a[0].trim()).map(a => [a[0].trim(), a.slice(1).join(" ").trim()]);
    if(w.length){ data.w = w.slice(0,40); renderRows(); startGame(); closeModal(); } else toast("형식을 확인해 주세요");
  };
};
$("#share").onclick = () => {
  const url = location.href.split("#")[0] + "#w=" + encode({t: data.t, w: pairs()});
  history.replaceState(null, "", url);
  modal(`<h3 style="margin:0">🔗 이 단어장 공유하기</h3>
    <div class="count">아래 주소를 학생에게 보내면 같은 단어장으로 게임이 열려요. (서버 저장 없음 · 단어가 주소 안에 담겨요)</div>
    <textarea id="shareUrl" readonly></textarea>
    <div class="tools"><button class="btn pri" id="copy">주소 복사</button><button class="btn ghost" data-close>닫기</button></div>`);
  $("#shareUrl").value = url;
  $("#copy").onclick = async () => {
    const ta = $("#shareUrl"); ta.select();
    try{ await navigator.clipboard.writeText(url); toast("복사했어요!"); }
    catch(e){ try{ document.execCommand("copy"); toast("복사했어요!"); }catch(_){ toast("주소를 길게 눌러 복사해 주세요"); } }
  };
};
function modal(html){ $("#mbox").innerHTML = html; $("#modal").classList.add("on"); }
function closeModal(){ $("#modal").classList.remove("on"); }
$("#modal").addEventListener("click", e => { if(e.target.id === "modal" || e.target.dataset.close != null) closeModal(); });
let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800); }

// ---- 소리 ----
let actx;
function snd(type){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {ok:[660,880], bad:[220,180], win:[523,659,784,1047], tick:[700]}[type];
    seq.forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i*0.1;
      o.type = type === "bad" ? "square" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(type === "tick" ? 0.06 : 0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + (type==="tick"?0.05:0.18));
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.2);
    });
  }catch(e){}
}

// ---- 게임 전환 ----
let game = "match", cleanup = null;
$$("#modes .mode").forEach(b => b.onclick = () => {
  game = b.dataset.g; $$("#modes .mode").forEach(x => x.classList.toggle("on", x === b)); startGame();
});
function startGame(){
  if(cleanup){ cleanup(); cleanup = null; }
  const P = pairs(), st = $("#stage");
  if(P.length < 2){ st.innerHTML = `<div class="quiz"><div class="big">✏️</div><div class="q-ask">왼쪽에 단어와 뜻을 2개 이상 입력해 주세요.</div></div>`; return; }
  ({match: gMatch, wheel: gWheel, quiz: gQuiz})[game](P, st);
}

// ---- 1. 짝 맞추기 ----
function gMatch(P, st){
  const use = shuffle(P).slice(0, 8);
  const cards = shuffle(use.flatMap((p,i) => [{id:i, txt:p[0], m:false}, {id:i, txt:p[1], m:true}]));
  const n = cards.length, cols = n <= 8 ? 4 : n <= 12 ? 4 : 4;
  st.innerHTML = `<div class="bar"><h2>🃏 ${esc(data.t||"짝 맞추기")}</h2><div class="stat"><span class="pill" id="mTry">시도 0</span><span class="pill" id="mLeft">남은 짝 ${use.length}</span><button class="btn" id="mRe">↺ 섞기</button></div></div>
    <div class="grid" style="--cols:${window.innerWidth < 500 ? 4 : cols}">${cards.map((c,i) => `<div class="fc" data-i="${i}"><div class="back">?</div><div class="face ${c.m?"m":""}">${esc(c.txt)}</div></div>`).join("")}</div>
    <div class="overlay" id="mWin"><div class="big">🎉</div><h3>모두 찾았어요!</h3><div class="q-ask" id="mWinTxt"></div><button class="btn pri" id="mAgain">한 번 더</button></div>`;
  let open = [], tries = 0, left = use.length, lock = false, t0 = Date.now();
  $("#mRe").onclick = () => gMatch(P, st);
  $("#mAgain").onclick = () => gMatch(P, st);
  st.querySelector(".grid").onclick = e => {
    const el = e.target.closest(".fc"); if(!el || lock) return;
    if(el.classList.contains("open") || el.classList.contains("done")) return;
    el.classList.add("open"); open.push(el); snd("tick");
    if(open.length < 2) return;
    tries++; $("#mTry").textContent = "시도 " + tries;
    const [a,b] = open, ca = cards[a.dataset.i], cb = cards[b.dataset.i];
    if(ca.id === cb.id && ca.m !== cb.m){
      open = []; setTimeout(() => { a.classList.add("done"); b.classList.add("done"); snd("ok"); }, 350);
      left--; $("#mLeft").textContent = "남은 짝 " + left;
      if(!left) setTimeout(() => { snd("win"); $("#mWinTxt").textContent = `${tries}번 만에 · ${Math.round((Date.now()-t0)/1000)}초`; $("#mWin").classList.add("on"); }, 800);
    } else {
      lock = true;
      setTimeout(() => { a.classList.add("shake"); b.classList.add("shake"); snd("bad"); }, 450);
      setTimeout(() => { a.classList.remove("open","shake"); b.classList.remove("open","shake"); open = []; lock = false; }, 1100);
    }
  };
}

// ---- 2. 돌림판 ----
function gWheel(P, st){
  let items = shuffle(P).slice(0, 16);
  st.innerHTML = `<div class="bar"><h2>🎡 ${esc(data.t||"돌림판")}</h2><div class="stat"><label class="pill"><input type="checkbox" id="wRm"> 나온 단어 빼기</label><button class="btn" id="wRe">↺ 처음부터</button></div></div>
    <div class="wheelbox">
      <div class="wheel"><div class="pin"></div><canvas id="wc" width="760" height="760"></canvas><div class="hub" id="wHub">돌려!</div></div>
      <div class="wside">
        <div class="card-res"><div class="q-ask" id="wAsk">가운데를 눌러 돌려 보세요</div><div class="w" id="wWord">🎯</div><div class="m" id="wMean"></div></div>
        <div class="tools"><button class="btn pri" id="wSpin" style="font-size:18px;padding:12px 26px">🎡 돌리기</button><button class="btn" id="wShow" disabled>뜻 보기</button></div>
      </div>
    </div>`;
  const cv = $("#wc"), cx = cv.getContext("2d"), R = 370;
  const COLS = ["#ff6b4a","#ffc233","#2bb673","#3d7bff","#8b5cf6","#ff8fb1","#13b5c8","#ff9f43"];
  let ang = 0, spinning = false, cur = null, raf = 0;
  function draw(){
    cx.clearRect(0,0,760,760);
    const n = items.length;
    if(!n){ cx.fillStyle = "#f4ece2"; cx.beginPath(); cx.arc(380,380,R,0,7); cx.fill(); cx.fillStyle="#6e6577"; cx.font="bold 36px system-ui"; cx.textAlign="center"; cx.fillText("모두 나왔어요!",380,250); return; }
    const seg = Math.PI*2/n;
    for(let i=0;i<n;i++){
      const a0 = ang + i*seg - Math.PI/2;
      cx.beginPath(); cx.moveTo(380,380); cx.arc(380,380,R,a0,a0+seg); cx.closePath();
      cx.fillStyle = (n > 1 && i === n-1 && i % COLS.length === 0) ? COLS[3] : COLS[i % COLS.length];
      cx.fill(); cx.strokeStyle = "#fff"; cx.lineWidth = 4; cx.stroke();
      cx.save(); cx.translate(380,380); cx.rotate(a0 + seg/2);
      cx.fillStyle = "#fff"; cx.textAlign = "right"; cx.textBaseline = "middle";
      let fs = Math.min(44, Math.max(20, 300/n + 14)), label = items[i][0];
      cx.font = `800 ${fs}px system-ui, "Malgun Gothic", sans-serif`;
      while(cx.measureText(label).width > R - 100 && fs > 16){ fs -= 2; cx.font = `800 ${fs}px system-ui, "Malgun Gothic", sans-serif`; }
      if(cx.measureText(label).width > R - 100){ while(label.length > 2 && cx.measureText(label + "…").width > R - 100) label = label.slice(0,-1); label += "…"; }
      cx.shadowColor = "rgba(0,0,0,.25)"; cx.shadowBlur = 4;
      cx.fillText(label, R - 24, 0); cx.restore();
    }
    cx.beginPath(); cx.arc(380,380,R,0,Math.PI*2); cx.lineWidth = 10; cx.strokeStyle = "#2a2233"; cx.stroke();
  }
  function spin(){
    if(spinning || !items.length) return;
    if(cur && $("#wRm").checked){ items = items.filter(p => p !== cur); cur = null; draw(); if(!items.length) return; }
    spinning = true; $("#wShow").disabled = true; $("#wMean").textContent = ""; $("#wAsk").textContent = "두근두근…"; $("#wWord").textContent = "🎡";
    const n = items.length, seg = Math.PI*2/n, pick = Math.floor(Math.random()*n);
    // 포인터(위쪽)에 pick 조각 중앙이 오도록: ang + pick*seg + seg/2 ≡ 0 (mod 2π)
    const jitter = (Math.random()-.5)*seg*0.7;
    let target = -(pick*seg + seg/2) + jitter;
    const base = ang - (ang % (Math.PI*2));
    target = base + Math.PI*2*(5 + Math.floor(Math.random()*2)) + ((target % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    const start = ang, dur = 3800, t0 = performance.now(); let lastSeg = -1;
    (function step(now){
      const t = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1-t, 4);
      ang = start + (target - start)*e; draw();
      const s = Math.floor(((-(ang) % (Math.PI*2)) + Math.PI*4) % (Math.PI*2) / seg);
      if(s !== lastSeg){ lastSeg = s; snd("tick"); }
      if(t < 1) raf = requestAnimationFrame(step);
      else { spinning = false; cur = items[pick]; $("#wAsk").textContent = "이 단어의 뜻은?"; $("#wWord").textContent = cur[0]; $("#wShow").disabled = false; snd("ok"); }
    })(t0);
  }
  $("#wSpin").onclick = spin; $("#wHub").onclick = spin;
  $("#wShow").onclick = () => { if(cur){ $("#wMean").textContent = "👉 " + cur[1]; } };
  $("#wRe").onclick = () => gWheel(P, st);
  draw();
  cleanup = () => cancelAnimationFrame(raf);
}

// ---- 3. 빠른 퀴즈 ----
function gQuiz(P, st){
  if(P.length < 4){ st.innerHTML = `<div class="quiz"><div class="big">🧐</div><div class="q-ask">4지선다를 만들려면 짝이 4개 이상 필요해요. (지금 ${P.length}개)</div></div>`; return; }
  let dir = 0; // 0: 단어→뜻, 1: 뜻→단어
  const total = Math.min(10, P.length);
  let qs, qi, score, streak, timer = 0;
  function begin(){ qs = shuffle(P).slice(0, total); qi = 0; score = 0; streak = 0; show(); }
  function show(){
    clearInterval(timer);
    if(qi >= total){
      const pct = Math.round(score/total*100);
      st.innerHTML = `<div class="quiz"><div class="big">${pct >= 80 ? "🏆" : pct >= 50 ? "👏" : "💪"}</div><h2 style="margin:0;font-size:30px">${total}문제 중 ${score}개 정답!</h2>
        <div class="q-ask">${pct >= 80 ? "단어 박사 인정!" : pct >= 50 ? "잘했어요, 조금만 더!" : "한 번 더 도전해 볼까요?"}</div>
        <div class="tools"><button class="btn pri" id="qAgain" style="font-size:18px;padding:12px 24px">다시 도전</button><button class="btn" id="qFlip">방향 바꿔 도전</button></div></div>`;
      $("#qAgain").onclick = begin; $("#qFlip").onclick = () => { dir = 1 - dir; begin(); };
      if(pct >= 80) snd("win");
      return;
    }
    const q = qs[qi], ans = q[1-dir];
    const wrong = shuffle(P.filter(p => p[1-dir] !== ans)).map(p => p[1-dir]).filter((v,i,a) => a.indexOf(v) === i).slice(0,3);
    const opts = shuffle([ans, ...wrong]);
    let sec = 10;
    st.innerHTML = `<div class="bar"><h2>⚡ 빠른 퀴즈</h2><div class="stat"><span class="pill">${qi+1} / ${total}</span><span class="pill">점수 ${score}</span><span class="pill" id="qSec">⏱ ${sec}</span><button class="btn ghost" id="qDir">${dir ? "뜻 → 단어" : "단어 → 뜻"} ⇄</button></div></div>
      <div class="quiz"><div class="q-prog"><i style="width:${qi/total*100}%"></i></div>
      <div class="q-ask">${dir ? "이 뜻에 맞는 단어는?" : "이 단어의 뜻은?"}</div>
      <div class="q-word">${esc(q[dir])}</div>
      <div class="opts">${opts.map(o => `<button class="opt">${esc(o)}</button>`).join("")}</div>
      <div class="fb" id="qFb">${streak >= 2 ? "🔥 " + streak + "연속 정답 중!" : ""}</div></div>`;
    $("#qDir").onclick = () => { dir = 1 - dir; begin(); };
    let done = false;
    const finish = (btn) => {
      if(done) return; done = true; clearInterval(timer);
      const ok = btn && btn.textContent === ans;
      $$(".opt").forEach(b => { b.classList.toggle("dim", b.textContent !== ans); b.classList.toggle("right", b.textContent === ans); });
      if(ok){ score++; streak++; snd("ok"); $("#qFb").textContent = "⭕ 정답!" + (streak >= 3 ? ` 🔥 ${streak}연속` : ""); $("#qFb").style.color = "var(--g)"; }
      else { streak = 0; snd("bad"); $("#qFb").textContent = (btn ? "❌ 아쉬워요! " : "⏰ 시간 초과! ") + "정답: " + ans; $("#qFb").style.color = "var(--pri)"; }
      qi++; setTimeout(show, ok ? 900 : 1700);
    };
    $$(".opt").forEach(b => b.onclick = () => finish(b));
    timer = setInterval(() => { sec--; const el = $("#qSec"); if(el) el.textContent = "⏱ " + sec; if(sec <= 0) finish(null); }, 1000);
  }
  begin();
  cleanup = () => clearInterval(timer);
}

// ---- 시작 ----
loadHash();
renderRows();
const startMode = (location.hash.match(/g=(match|wheel|quiz)/) || [])[1];
if(startMode) $(`#modes .mode[data-g="${startMode}"]`).click(); else startGame();
window.addEventListener("hashchange", () => { if(loadHash()){ renderRows(); startGame(); } });
</script>
