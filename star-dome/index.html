// ---- 천문 계산 ----
function horiz(ra, dec, lst) { // → [동, 북, 위] 단위벡터

{ const aG = 192.85948 * D2R, dG = 27.12825 * D2R, lN = 122.93192 * D2R;

  for (const [n, a] of [['북', 0], ['동', 90], ['남', 180], ['서', 270]]) { const p = project(vecAltAz(-3, a)); if (p && p.z > 0 && p.x > 0 && p.x < W && p.y < H) { ctx.fillStyle = n === '북' ? '#ff9a9a' : '#9fb0ea'; ctx.fillText(n, p.x, Math.min(H - 50, p.y + 6)); } }
  // 목표 방향 화살표
  if (phase === 'play' && cur()) {
    const ce = centroid(cur()), p = project(ce.v);
    const off = !p || p.x < 40 || p.x > W - 40 || p.y < 80 || p.y > H - 60 || p.z < 0;
    if (off) { let dx, dy; if (p && p.z > 0) { dx = p.x - W / 2; dy = p.y - H / 2; } else { const d = ((ce.az - az + 540) % 360) - 180; dx = d; dy = -(ce.alt - alt); } const a = Math.atan2(dy, dx), R = Math.min(W, H) * 0.36, x = W / 2 + Math.cos(a) * R, y = H / 2 + Math.sin(a) * R;
      ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.fillStyle = 'rgba(255,211,107,.9)'; ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(-10, -14); ctx.lineTo(-4, 0); ctx.lineTo(-10, 14); ctx.fill(); ctx.restore();
      ctx.fillStyle = '#ffd36b'; ctx.font = '800 13px system-ui'; ctx.fillText(cur().n + ' 쪽', x, y + 30); }
  }
  // 돔 가장자리
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,8,.6)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}
let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, last ? (ts - last) / 1000 : 0); last = ts;
  if (!manual) { acc += dt; let k = 0; while (acc >= DT && k < 6) { update(); acc -= DT; k++; } if (k) hud(); }
  draw();
}

// ---- 입력 ----
let dragging = false, down = null;
const ptrs = new Map(); let pinch0 = 0, zoom0 = 1;
cv.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = zoom; down = null; return; } down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false }; vaz = valt = 0; look = null; try { cv.setPointerCapture(e.pointerId); } catch (er) {} e.preventDefault(); });
cv.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2 && pinch0) { const [a, b] = [...ptrs.values()]; zoom = clamp(zoom0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch0, 0.7, 2.6); return; }
  if (!down) return;
  if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) { down.moved = true; dragging = true; drags++; }
  if (down.moved) { const k = R2D / scale(); const dx = e.clientX - down.lx, dy = e.clientY - down.ly; az -= dx * k; alt = clamp(alt + dy * k, 2, 85); vaz = -dx * k * 60; valt = dy * k * 60; az = (az + 360) % 360; BS = basis(); }
  down.lx = e.clientX; down.ly = e.clientY;
});
const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (!down) return; if (!down.moved) tapAt(e.clientX, e.clientY); down = null; dragging = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); down = null; dragging = false; });
cv.addEventListener('wheel', e => { zoom = clamp(zoom * (e.deltaY < 0 ? 1.1 : 0.9), 0.7, 2.6); e.preventDefault(); }, { passive: false });
cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
const KM = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd' };
addEventListener('keydown', e => {
  if (KM[e.key]) { keys[KM[e.key]] = 1; e.preventDefault(); }
  else if (e.key === '+' || e.key === '=') zoom = clamp(zoom * 1.15, 0.7, 2.6); else if (e.key === '-') zoom = clamp(zoom / 1.15, 0.7, 2.6);
  else if (e.key === 'Enter' && phase === 'ready') start();
});
addEventListener('keyup', e => { if (KM[e.key]) keys[KM[e.key]] = 0; });
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; down = null; dragging = false; });
for (const b of $$('.season')) b.addEventListener('click', () => { season = b.dataset.s; const c = CONS.find(c => c.s === season), ce = centroid(c); az = ce.az; alt = clamp(ce.alt - 18, 5, 60); zoom = 1; look = null; seasonUI(); hud(); });
$('#start').addEventListener('click', start);
$('#again').addEventListener('click', start);
$('#home').addEventListener('click', home);
$('#hint').addEventListener('click', () => setHint(!hintOn));
$('#look').addEventListener('click', () => { if (phase !== 'play' || !cur()) return; const ce = centroid(cur()); look = { az: ce.az, alt: clamp(ce.alt, 10, 80) }; });
$('#zin').addEventListener('click', () => { zoom = clamp(zoom * 1.25, 0.7, 2.6); });
$('#zout').addEventListener('click', () => { zoom = clamp(zoom / 1.25, 0.7, 2.6); });
$('#snd').addEventListener('click', () => setSound(!sound));
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) $('#fs').hidden = true;
$('#fs').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  try { if (d.fullscreenElement || d.webkitFullscreenElement) { const x = (d.exitFullscreen || d.webkitExitFullscreen).call(d); if (x && x.catch) x.catch(() => {}); }
    else { const x = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (x && x.catch) x.catch(() => {}); } } catch (e) {}
});
addEventListener('resize', resize);

window.__test = {
  manual: v => { manual = !!v; },
  step: (n = 1) => { for (let i = 0; i < n; i++) update(); hud(); },
  altOf: (id, s) => altAz(ST[id][1], ST[id][2], SEASONS[s].lst).alt,
  azOf: (id, s) => altAz(ST[id][1], ST[id][2], SEASONS[s].lst).az,
  starsOf: s => [...new Set(CONS.filter(c => c.s === s).flatMap(c => c.seq.flat()))],
  seqOf: cid => CID[cid].seq.map(a => a.slice()),
  lookAt: cid => { const ce = centroid(CID[cid]); az = ce.az; alt = clamp(ce.alt, 2, 85); vaz = valt = 0; look = null; zoom = 1; BS = basis(); },
  screenOf: id => { BS = basis(); return screenOf(id); },
  state: () => ({ phase, season, az, alt, zoom, target: phase === 'play' && cur() ? cur().n : '', links: totalLinks, wrong, drags, done: sessionDone.slice(), hintOn, sound })
};
resize(); seasonUI(); hud();
{ const ce = centroid(CID.orion); az = (ce.az + 12) % 360; alt = clamp(ce.alt - 18, 5, 60); BS = basis(); }
for (let i = 0; i < 30; i++) update();
requestAnimationFrame(frame);
})();
