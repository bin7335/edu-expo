<html lang="ko">

<meta charset="UTF-8">
<!-- csp:auto --><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><!-- /csp:auto -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자리척척 - 우리 반 자리 배치 생성기</title>
<meta name="description" content="행·열을 정하고 이름을 붙여 넣으면 짝 고정·분리·앞자리 조건을 지켜 자리를 섞어 주는 자리 배치 생성기. 드래그로 자리 바꾸기, 인쇄 지원.">
<style>
  :root{
    --bg:#f4f1ea; --panel:#fff; --ink:#2b2a28; --sub:#6d6a63; --line:#e3ded3;
    --accent:#2f7d6d; --accent2:#e8a33d; --warn:#c8553d; --desk:#fffaf0; --desk-line:#d9cdb4;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--accent);color:#fff}
  header .logo{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:22px;flex:none}
  header h1{margin:0;font-size:22px;letter-spacing:-.5px}
  header p{margin:0;font-size:13px;opacity:.85}
  header .grow{flex:1}
  .btn{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn:hover{filter:brightness(.96)}
  .btn.primary{background:var(--accent2);color:#3a2600;border-color:transparent;font-size:16px;padding:11px 18px}
  .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
  main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px 20px 40px;max-width:1400px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .panel h2{font-size:15px;margin:0 0 8px}
  .side{display:flex;flex-direction:column;gap:12px}
  label.small{display:block;font-size:12px;color:var(--sub);margin:8px 0 4px}
  .row{display:flex;gap:8px;align-items:center}
  input[type=number]{width:64px;padding:7px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;text-align:center}
  textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px;resize:vertical;line-height:1.5}
  .hint{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.4}
  .count{font-size:12px;color:var(--accent);font-weight:600}
  details summary{cursor:pointer;font-weight:700;font-size:14px}
  .stage{display:flex;flex-direction:column;gap:12px;min-width:0}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .toolbar .msg{font-size:13px;color:var(--sub);flex:1;min-width:160px}
  .msg.bad{color:var(--warn);font-weight:600}
  .classroom{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;overflow-x:auto}
  .front{display:flex;justify-content:center;margin-bottom:14px}
  .board-label{font-size:12px;color:var(--sub);text-align:center;margin-bottom:6px}
  .teacher-desk{background:#7a5a3a;color:#fff;border-radius:8px;padding:8px 40px;font-weight:700;font-size:14px;box-shadow:0 3px 0 #5b4127}
  .grid{display:grid;gap:10px 6px;margin:0 auto;width:max-content;min-width:100%}
  .seat{position:relative;background:var(--desk);border:2px solid var(--desk-line);border-radius:10px;height:62px;min-width:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:16px;cursor:grab;user-select:none;touch-action:none;transition:transform .15s, box-shadow .15s, background .2s}
  .seat .no{position:absolute;top:3px;left:6px;font-size:10px;color:#b3a689;font-weight:600}
  .seat .tag{font-size:10px;font-weight:600;color:var(--accent);margin-top:2px}
  .seat.empty{background:repeating-linear-gradient(45deg,#faf7f0,#faf7f0 6px,#f2ede2 6px,#f2ede2 12px);color:#c1b8a5;font-weight:500;font-size:12px}
  .seat.sel{outline:3px solid var(--accent2);outline-offset:2px;transform:translateY(-2px)}
  .seat.over{background:#fff1d6;border-color:var(--accent2)}
  .seat.front-pri{border-color:#9cc7bd}
  .seat.flick{animation:flick .12s linear}
  .seat.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
  .gap-l{margin-left:16px}
  @keyframes flick{from{transform:scale(.94) rotate(-2deg)}to{transform:scale(1) rotate(0)}}
  @keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
  .drag-ghost{position:fixed;pointer-events:none;z-index:50;background:var(--accent2);color:#3a2600;font-weight:700;padding:10px 14px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:translate(-50%,-60%) rotate(-4deg)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
  .back{position:fixed;right:12px;bottom:10px;font-size:12px;color:var(--sub);background:rgba(255,255,255,.85);padding:5px 10px;border-radius:20px;text-decoration:none;border:1px solid var(--line)}
  .print-title{display:none}
  @media (max-width:820px){
    main{grid-template-columns:1fr;padding:12px}
    .stage{order:-1}
    header{padding:10px 12px}
    header p{display:none}
    header h1{font-size:19px}
    .seat{min-width:0;height:52px;font-size:12.5px;letter-spacing:-.5px;border-width:1.5px}
    .seat .no{font-size:9px;left:4px}
    .gap-l{margin-left:6px}
    .grid{gap:8px 3px;width:100%}
    .classroom{padding:10px}
    .teacher-desk{padding:6px 24px}
  }
  @media print{
    @page{size:A4 landscape;margin:12mm}
    body{background:#fff}
    header,.side,.toolbar,.back,.legend{display:none!important}
    main{display:block;padding:0}
    .classroom{border:0;padding:0;overflow:visible}
    .print-title{display:block;text-align:center;font-size:22px;font-weight:800;margin:0 0 10px}
    .seat{border:1.5px solid #333!important;background:#fff!important;height:70px;min-width:110px;font-size:20px;animation:none!important;outline:none!important}
    .seat.empty{color:#aaa}
    .seat .tag{display:none}
    .teacher-desk{background:#fff;color:#000;border:2px solid #000;box-shadow:none}
  }
</style>

<body>
<header>
  <div class="logo" aria-hidden="true">🪑</div>
  <div>
    <h1>자리척척</h1>
    <p>조건은 지키고, 자리는 두근두근 섞기</p>
  </div>
  <div class="grow"></div>
  <button class="btn ghost" id="printBtn" type="button">🖨 인쇄</button>
</header>

<main>
  <section class="side">
    <div class="panel">
      <h2>교실 크기</h2>
      <div class="row">
        <input type="number" id="rows" min="1" max="10" value="5" aria-label="줄(행) 수"> <span>줄 ×</span>
        <input type="number" id="cols" min="1" max="10" value="6" aria-label="분단(열) 수"> <span>칸</span>
      </div>
      <div class="hint">두 칸씩 한 짝(책상 한 쌍)으로 묶여요.</div>
    </div>
    <div class="panel">
      <h2>학생 이름 <span class="count" id="nameCount"></span></h2>
      <textarea id="names" rows="6" aria-label="학생 이름 목록"></textarea>
      <div class="hint">줄바꿈이나 쉼표로 구분해서 붙여 넣으세요. (예시는 가상 이름)</div>
    </div>
    <div class="panel">
      <details open>
        <summary>배치 조건</summary>
        <label class="small" for="fixPairs">💞 짝 고정 (한 줄에 두 명)</label>
        <textarea id="fixPairs" rows="2"></textarea>
        <label class="small" for="sepPairs">↔ 떨어뜨리기 (한 줄에 두 명)</label>
        <textarea id="sepPairs" rows="2"></textarea>
        <label class="small" for="frontList">👓 앞자리 우선 (쉼표로 구분)</label>
        <textarea id="frontList" rows="1"></textarea>
        <div class="hint">앞자리 우선 학생은 앞 두 줄 안에, 떨어뜨리기 학생은 앞뒤·옆·대각선으로 붙지 않게 배치해요.</div>
      </details>
    </div>
  </section>

  <section class="stage">
    <div class="toolbar">
      <button class="btn primary" id="shuffleBtn" type="button">🎲 자리 섞기</button>
      <button class="btn" id="clearSel" type="button" hidden>선택 취소</button>
      <div class="msg" id="msg">자리를 끌어다 놓거나, 두 자리를 차례로 눌러 바꿀 수 있어요.</div>
    </div>
    <div class="classroom" id="classroom">
      <div class="print-title" id="printTitle">우리 반 자리 배치표</div>
      <div class="board-label">칠판</div>
      <div class="front"><div class="teacher-desk">교 탁</div></div>
      <div class="grid" id="grid" aria-label="자리 배치"></div>
    </div>
    <div class="legend">
      <span><i style="background:#9cc7bd"></i>앞자리 우선</span>
      <span>💞 짝 고정</span>
      <span>↔ 떨어뜨리기</span>
    </div>
  </section>
</main>
<a class="back" href="../">← 전체 데모 보기</a>

<script>
(function(){
  'use strict';
  var KEY='seatmaker-v1';
  var SAMPLE_NAMES=['김하늘','이서준','박지호','최민준','정예린','강시우','조하윤','윤도현','장서아','임지안','한유찬','오다은','서준혁','신채원','권태윤','황보람','안지후','송가온','류하람','홍이현','전소율','고은호','문서진','배나래','백시온','허윤슬','남궁별','유하준'];
  var DEFAULT={rows:5,cols:6,names:SAMPLE_NAMES.join(', '),fix:'김하늘, 이서준\n정예린, 조하윤',sep:'박지호, 최민준\n강시우, 윤도현',front:'장서아, 한유찬'};

  var $=function(id){return document.getElementById(id)};
  var el={rows:$('rows'),cols:$('cols'),names:$('names'),fix:$('fixPairs'),sep:$('sepPairs'),front:$('frontList'),grid:$('grid'),msg:$('msg'),count:$('nameCount'),clearSel:$('clearSel')};

  var state={rows:5,cols:6,seats:[]}; // seats: array of name|null
  var selected=-1, animating=false;

  function load(){
    var s=null;
    try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
    s=s||{};
    el.rows.value=s.rows||DEFAULT.rows;
    el.cols.value=s.cols||DEFAULT.cols;
    el.names.value=s.names!=null?s.names:DEFAULT.names;
    el.fix.value=s.fix!=null?s.fix:DEFAULT.fix;
    el.sep.value=s.sep!=null?s.sep:DEFAULT.sep;
    el.front.value=s.front!=null?s.front:DEFAULT.front;
    return s.seats||null;
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify({rows:+el.rows.value,cols:+el.cols.value,names:el.names.value,fix:el.fix.value,sep:el.sep.value,front:el.front.value,seats:state.seats}))}catch(e){}
  }

  function clamp(v,a,b){v=parseInt(v,10);if(isNaN(v))v=a;return Math.max(a,Math.min(b,v))}
  function parseNames(){
    var seen={},out=[];
    el.names.value.split(/[\n,，\t]+/).forEach(function(n){n=n.trim();if(n&&!seen[n]){seen[n]=1;out.push(n)}});
    return out;
  }
  function parsePairs(text){
    return text.split(/\n+/).map(function(l){return l.split(/[,，\-~\/·&\s]+/).map(function(x){return x.trim()}).filter(Boolean)}).filter(function(p){return p.length>=2}).map(function(p){return [p[0],p[1]]});
  }
  function parseList(text){return text.split(/[\n,，\s]+/).map(function(x){return x.trim()}).filter(Boolean)}

  function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function rc(i){return {r:Math.floor(i/state.cols),c:i%state.cols}}
  function near(i,j){var a=rc(i),b=rc(j);return Math.abs(a.r-b.r)<=1&&Math.abs(a.c-b.c)<=1}
  function isDeskPair(i,j){var a=rc(i),b=rc(j);return a.r===b.r&&Math.floor(a.c/2)===Math.floor(b.c/2)&&a.c!==b.c}

  function readConstraints(names){
    var set={};names.forEach(function(n){set[n]=1});
    var unknown=[];
    function chk(n){if(!set[n]&&unknown.indexOf(n)<0)unknown.push(n);return !!set[n]}
    var fix=parsePairs(el.fix.value).filter(function(p){var a=chk(p[0]),b=chk(p[1]);return a&&b&&p[0]!==p[1]});
    var sep=parsePairs(el.sep.value).filter(function(p){var a=chk(p[0]),b=chk(p[1]);return a&&b&&p[0]!==p[1]});
    var front=parseList(el.front.value).filter(chk);
    return {fix:fix,sep:sep,front:front,unknown:unknown};
  }

  function frontRows(){return Math.min(2,state.rows)}

  function attempt(names,cons){
    var total=state.rows*state.cols, seats=new Array(total).fill(null), placed={};
    var frontLimit=frontRows()*state.cols;
    var isFront={};cons.front.forEach(function(n){isFront[n]=1});
    // 1) fixed pairs
    var fixes=shuffleArr(cons.fix.slice());
    for(var k=0;k<fixes.length;k++){
      var p=fixes[k]; if(placed[p[0]]||placed[p[1]]) continue;
      var needFront=isFront[p[0]]||isFront[p[1]];
      var slots=[];
      for(var i=0;i<total;i++){
        var a=rc(i); if(a.c%2!==0||a.c+1>=state.cols) continue;
        if(needFront&&i>=frontLimit) continue;
        if(seats[i]===null&&seats[i+1]===null) slots.push(i);
      }
      if(!slots.length) return null;
      var s=slots[Math.floor(Math.random()*slots.length)];
      var order=Math.random()<.5?[p[0],p[1]]:[p[1],p[0]];
      seats[s]=order[0];seats[s+1]=order[1];placed[p[0]]=placed[p[1]]=1;
    }
    // 2) front priority
    var fr=shuffleArr(cons.front.filter(function(n){return !placed[n]}));
    for(k=0;k<fr.length;k++){
      var empt=[];for(i=0;i<frontLimit;i++) if(seats[i]===null) empt.push(i);
      if(!empt.length) return null;
      seats[empt[Math.floor(Math.random()*empt.length)]]=fr[k];placed[fr[k]]=1;
    }
    // 3) others
    var rest=shuffleArr(names.filter(function(n){return !placed[n]}));
    var empties=[];for(i=0;i<total;i++) if(seats[i]===null) empties.push(i);
    // fill empties so that leftover empty seats are mostly at the back
    empties.sort(function(a,b){return a-b});
    var useSeats=shuffleArr(empties.slice(0,rest.length));
    rest.forEach(function(n,idx){seats[useSeats[idx]]=n});
    // 4) check separation
    var pos={};seats.forEach(function(n,i){if(n)pos[n]=i});
    for(k=0;k<cons.sep.length;k++){var q=cons.sep[k];if(near(pos[q[0]],pos[q[1]])) return null}
    return seats;
  }

  function generate(){
    state.rows=clamp(el.rows.value,1,10);state.cols=clamp(el.cols.value,1,10);
    el.rows.value=state.rows;el.cols.value=state.cols;
    var names=parseNames(), total=state.rows*state.cols;
    var cons=readConstraints(names), notes=[];
    if(names.length>total){notes.push('자리('+total+')보다 학생('+names.length+')이 많아 '+(names.length-total)+'명은 빠졌어요.');names=names.slice(0,total)}
    var result=null;
    for(var t=0;t<3000&&!result;t++) result=attempt(names,cons);
    var ok=!!result;
    if(!result){
      // relax: ignore separation
      for(t=0;t<500&&!result;t++) result=attempt(names,{fix:cons.fix,sep:[],front:cons.front});
      if(!result) result=attempt(names,{fix:[],sep:[],front:[]});
      notes.push('모든 조건을 동시에 지킬 수 없어 일부 조건을 완화했어요.');
    }
    if(cons.unknown.length) notes.push('명단에 없는 이름: '+cons.unknown.join(', '));
    return {seats:result,notes:notes,ok:ok&&!cons.unknown.length};
  }

  function tagsFor(name){
    if(!name) return '';
    var cons=readConstraints(parseNames()),t='';
    if(cons.fix.some(function(p){return p[0]===name||p[1]===name})) t+='💞';
    if(cons.sep.some(function(p){return p[0]===name||p[1]===name})) t+='↔';
    return t;
  }

  function render(popIdx){
    var cols=state.cols, rows=state.rows;
    var tmpl=[];for(var c=0;c<cols;c++) tmpl.push('minmax(0,1fr)');
    el.grid.style.gridTemplateColumns=tmpl.join(' ');
    var cons=readConstraints(parseNames()), fr={};cons.front.forEach(function(n){fr[n]=1});
    var html='';
    for(var i=0;i<rows*cols;i++){
      var n=state.seats[i], c2=i%cols;
      var cls='seat'+(n?'':' empty')+(n&&fr[n]?' front-pri':'')+(c2>0&&c2%2===0?' gap-l':'')+(i===selected?' sel':'');
      var style=popIdx?' style="animation-delay:'+(popIdx[i]||0)+'ms"':'';
      if(popIdx) cls+=' pop';
      html+='<div class="'+cls+'" data-i="'+i+'"'+style+' role="button" tabindex="0" aria-label="'+(i+1)+'번 자리 '+esc(n||'빈자리')+'"><span class="no">'+(i+1)+'</span>'+(n?esc(n):'빈자리')+(n&&tagsFor(n)?'<span class="tag">'+tagsFor(n)+'</span>':'')+'</div>';
    }
    el.grid.innerHTML=html;
    el.count.textContent=parseNames().length+'명 / '+(rows*cols)+'자리';
    var d=new Date();
    $('printTitle').textContent='우리 반 자리 배치표 ('+d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.)';
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function setMsg(t,bad){el.msg.textContent=t;el.msg.className='msg'+(bad?' bad':'')}

  function shuffle(){
    if(animating) return;
    var res=generate();
    if(!res.seats){setMsg('자리를 만들 수 없어요. 칸 수를 늘려 보세요.',true);return}
    animating=true;selected=-1;el.clearSel.hidden=true;
    var names=parseNames(), total=state.rows*state.cols, steps=0;
    var cols=[];for(var c=0;c<state.cols;c++) cols.push('minmax(0,1fr)');
    render();
    var cells=el.grid.children;
    var timer=setInterval(function(){
      steps++;
      for(var i=0;i<cells.length;i++){
        var n=names[Math.floor(Math.random()*names.length)]||'';
        cells[i].lastChild.nodeType===3?cells[i].lastChild.nodeValue=n:cells[i].childNodes[1]&&(cells[i].childNodes[1].nodeValue=n);
        cells[i].classList.remove('flick');void cells[i].offsetWidth;cells[i].classList.add('flick');
        cells[i].classList.remove('empty');
      }
      if(steps>=12){
        clearInterval(timer);
        state.seats=res.seats;
        // pop in from front (teacher desk) to back
        var delays={};for(var j=0;j<total;j++){var p=rc(j);delays[j]=p.r*90+Math.abs(p.c-(state.cols-1)/2)*30}
        render(delays);
        animating=false;save();
        setMsg(res.notes.length?res.notes.join(' '):'✨ 조건을 모두 지켜 배치했어요! 끌어서 자리를 바꿀 수도 있어요.',!res.ok);
      }
    },85);
  }

  function swap(a,b){
    if(a===b) return;
    var t=state.seats[a];state.seats[a]=state.seats[b];state.seats[b]=t;
    selected=-1;el.clearSel.hidden=true;render();save();
    // check constraints after manual swap
    var v=violations();
    setMsg(v.length?'⚠ 확인해 보세요: '+v.join(' / '):'🔁 '+(a+1)+'번과 '+(b+1)+'번 자리를 바꿨어요.',!!v.length);
  }
  function violations(){
    var cons=readConstraints(parseNames()),pos={},out=[];
    state.seats.forEach(function(n,i){if(n)pos[n]=i});
    cons.fix.forEach(function(p){if(pos[p[0]]!=null&&pos[p[1]]!=null&&!isDeskPair(pos[p[0]],pos[p[1]]))out.push(p[0]+'·'+p[1]+' 짝 아님')});
    cons.sep.forEach(function(p){if(pos[p[0]]!=null&&pos[p[1]]!=null&&near(pos[p[0]],pos[p[1]]))out.push(p[0]+'·'+p[1]+' 가까움')});
    cons.front.forEach(function(n){if(pos[n]!=null&&pos[n]>=frontRows()*state.cols)out.push(n+' 뒷자리')});
    return out;
  }

  // pointer drag + tap-to-swap
  var drag=null;
  el.grid.addEventListener('pointerdown',function(e){
    var s=e.target.closest('.seat');if(!s||animating) return;
    drag={from:+s.dataset.i,x:e.clientX,y:e.clientY,moved:false,ghost:null,over:null,id:e.pointerId};
  });
  window.addEventListener('pointermove',function(e){
    if(!drag) return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){
      drag.moved=true;
      var g=document.createElement('div');g.className='drag-ghost';g.textContent=state.seats[drag.from]||'빈자리';document.body.appendChild(g);drag.ghost=g;
    }
    if(drag.moved){
      e.preventDefault();
      drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
      var t=document.elementFromPoint(e.clientX,e.clientY),s=t&&t.closest&&t.closest('.seat');
      if(drag.over&&drag.over!==s) drag.over.classList.remove('over');
      if(s){s.classList.add('over');drag.over=s}else drag.over=null;
    }
  },{passive:false});
  window.addEventListener('pointerup',function(e){
    if(!drag) return;
    var d=drag;drag=null;
    if(d.ghost) d.ghost.remove();
    if(d.over) d.over.classList.remove('over');
    if(d.moved){ if(d.over) swap(d.from,+d.over.dataset.i); return }
    tap(d.from);
  });
  window.addEventListener('pointercancel',function(){if(drag){if(drag.ghost)drag.ghost.remove();drag=null}});
  el.grid.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ') return;
    var s=e.target.closest('.seat');if(!s) return;e.preventDefault();tap(+s.dataset.i);
  });
  function tap(i){
    if(selected<0){selected=i;el.clearSel.hidden=false;render();setMsg((i+1)+'번 자리를 골랐어요. 바꿀 자리를 눌러 주세요.');var s=el.grid.children[i];s&&s.focus()}
    else if(selected===i){selected=-1;el.clearSel.hidden=true;render();setMsg('선택을 취소했어요.')}
    else swap(selected,i);
  }
  el.clearSel.onclick=function(){selected=-1;el.clearSel.hidden=true;render();setMsg('선택을 취소했어요.')};

  $('shuffleBtn').onclick=shuffle;
  $('printBtn').onclick=function(){window.print()};
  ['rows','cols'].forEach(function(k){el[k].addEventListener('change',function(){
    state.rows=clamp(el.rows.value,1,10);state.cols=clamp(el.cols.value,1,10);
    var names=parseNames();state.seats=new Array(state.rows*state.cols).fill(null);
    names.slice(0,state.seats.length).forEach(function(n,i){state.seats[i]=n});
    render();save();setMsg('교실 크기를 바꿨어요. 🎲 자리 섞기를 눌러 보세요.');
  })});
  [el.names,el.fix,el.sep,el.front].forEach(function(t){t.addEventListener('input',function(){el.count.textContent=parseNames().length+'명 / '+(state.rows*state.cols)+'자리';save()})});

  // init
  var saved=load();
  state.rows=clamp(el.rows.value,1,10);state.cols=clamp(el.cols.value,1,10);
  if(saved&&saved.length===state.rows*state.cols){state.seats=saved;render()}
  else{var r=generate();state.seats=r.seats;render();save()}

  window.__seat={state:state,swap:swap,shuffle:shuffle,violations:violations};
})();
</script>
</body>
</html>
