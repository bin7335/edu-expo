<html lang="ko">
<head>
<meta charset="UTF-8">

<title>분리배출 챔피언 - 쓰레기를 알맞은 통에 쏙!</title>
<meta name="description" content="우유팩·페트병·과자 봉지·달걀 껍데기… 나오는 쓰레기를 알맞은 분리배출 통에 넣는 60초 환경 게임. 틀리면 올바른 배출 팁을 알려 줘요.">
<style>
:root{--ink:#1d3a2f;--sub:#5d7a6c;--line:#d5eadf;--g:#1fa565;--r:#e5484d;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:linear-gradient(160deg,#dff6e9,#e6f3ff);min-height:100vh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#22c55e,#0ea5e9);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 0 #148a52;flex-shrink:0}
h1{margin:0;font-size:26px;letter-spacing:-.5px}
header small{display:block;color:var(--sub);font-size:13px}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px}
.btn{border:0;font:inherit;font-weight:900;font-size:17px;padding:12px 18px;border-radius:14px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 4px 0 #b9d6c6;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9d6c6}
.btn.pri{background:var(--g);color:#fff;box-shadow:0 5px 0 #13774a}
.btn.big{font-size:24px;padding:16px 34px;border-radius:18px}
.btn.sm{font-size:14px;padding:7px 12px;box-shadow:0 3px 0 #b9d6c6}
main{flex:1;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;padding:4px 20px 8px}
.stage{position:relative;background:var(--card);border-radius:24px;box-shadow:0 6px 0 #c3e2d2;padding:16px;display:flex;flex-direction:column;align-items:center;min-height:430px;overflow:hidden}
.hud{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:18px;gap:8px}
.hud b{font-size:24px;color:var(--g)}
.bar{width:100%;height:12px;background:#eaf3ee;border-radius:99px;margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#facc15);border-radius:99px;transform-origin:left;transition:transform .2s linear}
.prog{font-size:13px;color:var(--sub);font-weight:700}
.itemZone{flex:1;display:grid;place-items:center;width:100%;perspective:600px}
#item{width:210px;height:210px;border-radius:30px;background:linear-gradient(180deg,#fff,#f2faf6);border:3px solid var(--line);box-shadow:0 10px 0 #cfe6da,0 18px 24px rgba(30,80,60,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:grab;touch-action:none;transform:rotateX(8deg);animation:bob 2.4s ease-in-out infinite}
#item .e{font-size:96px;line-height:1}
#item .n{font-size:22px;font-weight:900}
#item.drag{position:fixed;z-index:50;animation:none;pointer-events:none;cursor:grabbing;margin:0;transform:rotate(-6deg) scale(1.05)}
#item.pop{animation:popIn .35s ease-out}
#item.out{transition:transform .25s,opacity .25s;transform:scale(.3) translateY(80px);opacity:0}
@keyframes bob{50%{transform:rotateX(8deg) translateY(-10px)}}
@keyframes popIn{from{transform:scale(.4) rotate(-10deg);opacity:0}}
.hint{font-size:14px;color:var(--sub);font-weight:700;margin-top:6px;text-align:center}
#fb{min-height:62px;width:100%;border-radius:16px;padding:9px 14px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .15s}
#fb.ok{opacity:1;background:#e3f8ec;color:#11683f}
#fb.no{opacity:1;background:#fff0f0;color:#a1262a}
#fb .t{font-size:30px}
#fb button{margin-left:auto}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:center}
.bin{position:relative;border:0;font:inherit;cursor:pointer;border-radius:12px 12px 22px 22px;padding:22px 6px 10px;color:#fff;background:var(--c);box-shadow:0 7px 0 var(--d),0 12px 16px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:118px;transition:transform .1s;touch-action:manipulation}
.bin::before{content:"";position:absolute;left:-4px;right:-4px;top:-2px;height:14px;border-radius:9px;background:var(--d)}
.bin .e{font-size:38px;line-height:1.1}
.bin .n{font-size:19px;font-weight:900;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.bin .x{font-size:12px;font-weight:700;opacity:.92}
.bin:active,.bin.hov{transform:translateY(4px) scale(1.03)}
.bin.good{animation:good .45s}
.bin.bad{animation:bad .4s}
.bin.ans{outline:5px solid #facc15;outline-offset:3px}
@keyframes good{40%{transform:scale(1.1) translateY(-6px)}}
@keyframes bad{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.plus{position:absolute;left:50%;top:40%;font-size:34px;font-weight:900;color:var(--g);pointer-events:none;animation:up .8s forwards}
@keyframes up{to{transform:translate(-50%,-80px);opacity:0}}
.cover{position:absolute;inset:0;background:rgba(255,255,255,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;border-radius:24px;z-index:5}
.cover h2{margin:0;font-size:34px}
.cover p{margin:0;color:var(--sub);font-weight:700;line-height:1.5}
.parade{display:flex;gap:10px;font-size:46px}
.parade span{display:inline-block;animation:bob2 1.8s ease-in-out infinite}
.parade span:nth-child(2){animation-delay:.2s}.parade span:nth-child(3){animation-delay:.4s}.parade span:nth-child(4){animation-delay:.6s}.parade span:nth-child(5){animation-delay:.8s}
@keyframes bob2{50%{transform:translateY(-12px) rotate(8deg)}}
.hide{display:none!important}
.modal{position:fixed;inset:0;background:rgba(20,50,40,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:60}
.modal.on{display:flex}
.box{background:#fff;border-radius:26px;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto;text-align:center;animation:popIn .35s}
.box h2{margin:4px 0;font-size:30px}
.grade{font-size:64px;line-height:1.1}
.stats{display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.stats div{background:#f1f8f4;border-radius:14px;padding:8px 14px;font-weight:700;color:var(--sub);font-size:13px}
.stats b{display:block;font-size:24px;color:var(--ink)}
.rev{text-align:left;font-size:14px;margin:8px 0 14px;padding:0;list-style:none}
.rev li{background:#fff6f6;border-radius:10px;padding:7px 10px;margin:5px 0}
.newbest{color:#d97706;font-weight:900}
footer{text-align:right;padding:0 20px 10px;font-size:13px}
footer a{color:var(--sub);text-decoration:none}
@media (max-width:820px){
  main{grid-template-columns:1fr;padding:4px 10px 8px;gap:12px}
  header{padding:8px 10px}
  h1{font-size:21px}
  .stage{min-height:360px;padding:12px}
  #item{width:160px;height:160px}
  #item .e{font-size:72px}
  .bins{gap:9px}
  .bin{min-height:96px;padding:18px 2px 8px}
  .bin .e{font-size:30px}.bin .n{font-size:16px}.bin .x{font-size:10px}
  .cover h2{font-size:26px}
}
</style>

<body>
<header>
  <div class="logo">♻️</div>
  <div><h1>분리배출 챔피언</h1><small>쓰레기를 알맞은 통에 쏙! 탭하거나 끌어다 놓아요</small></div>
  <div class="hr"><span class="pill" id="bestPill">🏆 최고 0점</span><button class="btn sm" id="snd" aria-label="소리 켜기/끄기">🔊 소리</button></div>
</header>
<main>
  <section class="stage" id="stage">
    <div class="hud"><span>⏱ <b id="time">60</b>초</span><span id="combo"></span><span>점수 <b id="score">0</b></span></div>
    <div class="bar"><i id="tbar"></i></div>
    <div class="prog" id="prog">0 / 15</div>
    <div class="itemZone"><div id="item"><div class="e">🥛</div><div class="n">우유팩</div></div></div>
    <div class="hint">아래 통을 누르거나, 쓰레기를 통으로 끌어다 놓아요</div>
    <div id="fb"></div>
    <div class="cover" id="cover">
      <div class="parade"><span>🥛</span><span>🧴</span><span>🥫</span><span>🍿</span><span>🍌</span></div>
      <h2>이 쓰레기는 어디로?</h2>
      <p>60초 동안 15개 쓰레기를 9개 통에 나눠 담아요.<br>헷갈리는 달걀 껍데기·영수증도 나와요!</p>
      <button class="btn pri big" id="start">▶ 시작하기</button>
    </div>
  </section>
  <section class="bins" id="bins"></section>
</main>
<footer><a href="../">← 전체 데모 보기</a></footer>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
// 분리배출 통 (환경부 「재활용품 분리배출 가이드라인」 기준)
const BINS=[
 ['paper','📄','종이','신문·상자·책','#3b82f6','#2563eb'],
 ['pack','🧃','종이팩','우유·주스팩','#06b6d4','#0891b2'],
 ['plastic','🧴','플라스틱','병·용기','#f59e0b','#d97706'],
 ['can','🥫','캔·고철','캔·냄비','#64748b','#475569'],
 ['glass','🍾','유리병','음료·잼 병','#10b981','#059669'],
 ['vinyl','🛍️','비닐','봉지·포장','#a855f7','#9333ea'],
 ['foam','🧊','스티로폼','완충재·상자','#94a3b8','#64748b'],
 ['food','🍎','음식물','먹을 수 있던 것','#84cc16','#65a30d'],
 ['general','🗑️','일반쓰레기','종량제 봉투','#78716c','#57534e']
];
const BN=Object.fromEntries(BINS.map(b=>[b[0],b[2]]));
const ITEMS=[
 ['📰','신문지','paper','신문지는 물기 없이 펴서 차곡차곡 묶어 종이류로!'],
 ['📦','택배 상자','paper','테이프·송장을 떼고 납작하게 펴서 종이류로!'],
 ['📒','다 쓴 공책','paper','스프링·비닐 표지는 빼고 종이류로 내요.'],
 ['🥛','우유팩','pack','우유팩은 헹궈 펼쳐 말린 뒤, 일반 종이와 따로 종이팩으로!'],
 ['🧃','주스 팩','pack','빨대는 빼고 헹궈서 종이팩으로 따로 모아요.'],
 ['🧴','투명 페트병','plastic','라벨 떼고 헹궈 찌그러뜨린 뒤 뚜껑 닫아 플라스틱으로(투명 페트병 전용함이 있으면 거기로).'],
 ['🍱','플라스틱 도시락 용기','plastic','음식물을 씻어 내고 플라스틱으로. 안 씻기는 건 일반쓰레기!'],
 ['🥤','플라스틱 음료 컵','plastic','음료를 비우고 헹궈 플라스틱으로. 빨대는 일반쓰레기!'],
 ['🥫','통조림 캔','can','내용물을 비우고 헹궈 캔류로. 뚜껑 모서리 조심!'],
 ['🍳','낡은 프라이팬','can','프라이팬·냄비는 캔·고철로 내요.'],
 ['🔩','못과 나사','can','작은 쇠붙이는 모아서 캔·고철로!'],
 ['🍾','음료 유리병','glass','뚜껑을 빼고 헹궈 유리병으로. 깨지지 않게 살살!'],
 ['🍯','잼 유리병','glass','속을 씻고 금속 뚜껑은 따로(캔·고철) 빼서 유리병으로.'],
 ['🍿','과자 봉지','vinyl','과자 봉지는 안을 털어 비닐류로! 은색 안쪽도 비닐이에요.'],
 ['🛍️','비닐봉지','vinyl','이물질을 털고 비닐류로 모아요.'],
 ['🍜','라면 봉지','vinyl','라면·스프 봉지는 털어서 비닐류로!'],
 ['🧊','스티로폼 상자','foam','테이프·송장을 떼고 깨끗한 스티로폼만 따로 내요.'],
 ['🍌','바나나 껍질','food','바나나 껍질은 물기를 빼서 음식물로.'],
 ['🍉','수박 껍질','food','수박 껍질은 잘게 잘라 물기 빼고 음식물로.'],
 ['🍚','남은 밥','food','남은 밥은 물기를 빼서 음식물로!'],
 ['🧻','쓴 휴지','general','휴지는 재활용이 안 돼요 → 일반쓰레기(종량제 봉투).'],
 ['🧾','영수증','general','영수증(감열지)은 종이로 재활용이 안 돼요 → 일반쓰레기.'],
 ['🥚','달걀 껍데기','general','달걀 껍데기는 음식물이 아니라 일반쓰레기예요!'],
 ['🍗','치킨 뼈','general','닭 뼈 같은 동물 뼈는 일반쓰레기예요.'],
 ['🍑','복숭아 씨','general','복숭아 씨처럼 단단한 씨는 일반쓰레기!'],
 ['🖊️','다 쓴 볼펜','general','볼펜은 여러 재질이 섞여 일반쓰레기예요.'],
 ['🪥','헌 칫솔','general','칫솔은 여러 재질이 섞여 일반쓰레기예요.'],
 ['🍽️','깨진 사기그릇','general','깨진 그릇·도자기는 유리병이 아니에요. 신문지에 싸서 종량제 봉투(또는 불연성 마대)로!'],
 ['🧅','양파 껍질','general','양파·마늘 껍질은 음식물이 아니라 일반쓰레기예요.']
];
const N=15, LIMIT=60000, KEY='edu-expo-recycle-sort-v1';
let seed=Date.now()%2147483647, off=0, delay=1700;
const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const now=()=>performance.now()+off;
let best={score:0,acc:0};try{best=Object.assign(best,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
best.score=+best.score||0;best.acc=+best.acc||0;
let soundOn=localStorage.getItem(KEY+'-snd')!=='0', ac=null;
const S={on:false,list:[],i:0,score:0,ok:0,combo:0,wrong:[],t0:0,lock:false,timer:0};
const item=$('#item');

// 소리 (사용자 동작 때만 만들기)
function tone(f,d,type,when){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sGood=()=>{tone(660,.12);tone(990,.18,'sine',.09)}, sBad=()=>tone(180,.3,'square'), sEnd=()=>[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',i*.12));
function drawSnd(){$('#snd').textContent=soundOn?'🔊 소리':'🔇 소리'}
$('#snd').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem(KEY+'-snd',soundOn?'1':'0')}catch(e){}drawSnd();tone(880,.1)};
drawSnd();

$('#bins').innerHTML=BINS.map(b=>`<button class="bin" data-bin="${b[0]}" style="--c:${b[4]};--d:${b[5]}"><span class="e">${b[1]}</span><span class="n">${b[2]}</span><span class="x">${b[3]}</span></button>`).join('');
$('#bins').addEventListener('click',e=>{const b=e.target.closest('.bin');if(b)answer(b.dataset.bin)});
function drawBest(){$('#bestPill').textContent=`🏆 최고 ${best.score}점`}
drawBest();

function start(){
  $('#modal').classList.remove('on');$('#cover').classList.add('hide');
  const pool=ITEMS.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  Object.assign(S,{on:true,list:pool.slice(0,N),i:0,score:0,ok:0,combo:0,wrong:[],t0:now(),lock:false});
  $('#fb').className='';$('#fb').innerHTML='';
  show();clearInterval(S.timer);S.timer=setInterval(tick,100);tick();tone(523,.1);
}
function show(){
  const it=S.list[S.i];item.className='';void item.offsetWidth;item.classList.add('pop');
  item.innerHTML=`<div class="e">${it[0]}</div><div class="n">${esc(it[1])}</div>`;item.dataset.bin=it[2];
  $('#prog').textContent=`${S.i+1} / ${N}`;$('#score').textContent=S.score;
  $('#combo').textContent=S.combo>=2?`🔥 ${S.combo}연속`:'';
  document.querySelectorAll('.bin.ans').forEach(b=>b.classList.remove('ans'));
}
function tick(){
  if(!S.on)return;const left=Math.max(0,LIMIT-(now()-S.t0));
  $('#time').textContent=Math.ceil(left/1000);$('#tbar').style.transform=`scaleX(${left/LIMIT})`;
  if(left<=0)finish();
}
function answer(bin){
  if(!S.on||S.lock)return;
  const it=S.list[S.i],btn=document.querySelector(`.bin[data-bin="${bin}"]`),fb=$('#fb');
  btn.classList.remove('good','bad');void btn.offsetWidth;
  if(bin===it[2]){
    S.ok++;S.combo++;const p=10+(S.combo>=3?5:0);S.score+=p;btn.classList.add('good');sGood();
    const pl=document.createElement('div');pl.className='plus';pl.textContent='+'+p;btn.appendChild(pl);setTimeout(()=>pl.remove(),800);
    fb.className='ok';fb.innerHTML=`<span class="t">✅</span><span>정답! ${esc(it[3])}</span>`;
    next(delay>0?350:0);
  }else{
    S.combo=0;btn.classList.add('bad');sBad();S.wrong.push(it);
    document.querySelector(`.bin[data-bin="${it[2]}"]`).classList.add('ans');
    fb.className='no';fb.innerHTML=`<span class="t">❌</span><span>${esc(it[1])}은(는) <b>${esc(BN[it[2]])}</b>! ${esc(it[3])}</span><button class="btn sm" id="skip">다음 ▶</button>`;
    $('#skip').onclick=()=>{if(S.lock&&S.pend){clearTimeout(S.pend);S.pend=0;go()}};
    next(delay);
  }
}
function next(ms){S.lock=true;item.classList.add('out');$('#score').textContent=S.score;S.pend=setTimeout(go,ms)}
function go(){S.pend=0;if(!S.on)return;S.lock=false;S.i++;if(S.i>=N)finish();else show()}
function grade(acc){return acc>=90?['🌍','지구 수호 챔피언']:acc>=70?['🌳','초록 지킴이']:acc>=50?['🌱','분리배출 새싹']:['🐣','연습생 — 한 번 더!']}
function finish(){
  if(!S.on)return;S.on=false;clearInterval(S.timer);clearTimeout(S.pend);S.lock=false;
  const acc=Math.round(S.ok/N*100);
  const [ge,gn]=grade(acc),isBest=S.score>best.score;
  if(isBest)best={score:S.score,acc};else if(S.score===best.score&&acc>best.acc)best.acc=acc;
  try{localStorage.setItem(KEY,JSON.stringify(best))}catch(e){}
  drawBest();sEnd();
  const left=Math.max(0,Math.ceil((LIMIT-(now()-S.t0))/1000));
  $('#mbox').innerHTML=`<div class="grade">${ge}</div><h2>${gn}</h2>
   ${isBest&&S.score>0?'<div class="newbest">🎉 새 최고 기록!</div>':''}
   <div class="stats"><div>정답률<b id="rAcc">${acc}%</b></div><div>맞힌 개수<b>${S.ok} / ${N}</b></div><div>점수<b id="rScore">${S.score}</b></div><div>남은 시간<b>${left}초</b></div><div>최고 기록<b id="rBest">${best.score}</b></div></div>
   ${S.wrong.length?`<div style="font-weight:900;text-align:left">📝 다시 기억해요</div><ul class="rev">${S.wrong.map(w=>`<li>${w[0]} <b>${esc(w[1])}</b> → ${esc(BN[w[2]])}: ${esc(w[3])}</li>`).join('')}</ul>`:'<p>모두 정확해요! 진짜 분리배출 고수 👏</p>'}
   <button class="btn pri big" id="again">↻ 다시 하기</button>`;
  $('#modal').classList.add('on');$('#again').onclick=start;
}
$('#start').onclick=start;

// 끌어다 놓기
let drag=null;
item.addEventListener('pointerdown',e=>{
  if(!S.on||S.lock)return;const r=item.getBoundingClientRect();
  drag={x:e.clientX,y:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,moved:false,id:e.pointerId};
  try{item.setPointerCapture(e.pointerId)}catch(_){}
});
let hov=null;
function binAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.bin'):null}
item.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
  if(!drag.moved){drag.moved=true;item.classList.add('drag');item.style.width=item.style.height=drag.w+'px'}
  item.style.left=(e.clientX-drag.dx)+'px';item.style.top=(e.clientY-drag.dy)+'px';
  const b=binAt(e.clientX,e.clientY);if(hov!==b){hov&&hov.classList.remove('hov');hov=b;b&&b.classList.add('hov')}
});
function endDrag(e){
  if(!drag)return;const m=drag.moved;drag=null;
  item.classList.remove('drag');item.style.left=item.style.top=item.style.width=item.style.height='';
  hov&&hov.classList.remove('hov');hov=null;
  if(m&&e.type==='pointerup'){const b=binAt(e.clientX,e.clientY);if(b)answer(b.dataset.bin)}
}
item.addEventListener('pointerup',endDrag);item.addEventListener('pointercancel',endDrag);

// 테스트용 고리
window.__test={pool:ITEMS.length,bins:BINS.map(b=>b[0]),setSeed:n=>{seed=n%2147483647||1},setDelay:ms=>{delay=ms},skip:ms=>{off+=ms;tick()},current:()=>S.on?{name:S.list[S.i][1],bin:S.list[S.i][2]}:null,state:()=>({on:S.on,i:S.i,ok:S.ok,score:S.score,lock:S.lock})};
})();
</script>
</body>
