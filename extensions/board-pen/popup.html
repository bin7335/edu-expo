<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>투명 판서판</title>
<style>
  body{margin:0;width:270px;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1c1e26;background:#f6f7fb}
  .wrap{padding:16px;display:flex;flex-direction:column;gap:10px}
  h1{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
  h1 img{width:28px;height:28px}
  p{margin:0;font-size:12.5px;color:#5b6070;line-height:1.5}
  button{border:0;font:inherit;font-size:16px;font-weight:800;padding:12px;border-radius:12px;background:#1f7a5a;color:#fff;cursor:pointer;box-shadow:0 3px 0 #145a41}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #145a41}
  kbd{background:#fff;border:1px solid #d6d9e3;border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11.5px}
  .err{color:#c62828;font-weight:700;display:none}
  ul{margin:0;padding-left:16px;font-size:12px;color:#5b6070;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="icon48.png" alt="">투명 판서판</h1>
  <p>지금 보고 있는 페이지 위에 투명한 판서막을 씌워요.</p>
  <button id="go">✏️ 판서 켜기 / 끄기</button>
  <p>단축키 <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>D</kbd></p>
  <ul>
    <li>P 펜 · H 형광펜 · E 지우개 · L 레이저</li>
    <li>A 화살표 · R 네모 · S 조명 · V 통과</li>
    <li>Ctrl+Z 되돌리기 · Esc 통과/끄기</li>
  </ul>
  <p class="err" id="err">이 페이지(크롬 설정·웹스토어 등)에서는 쓸 수 없어요.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
