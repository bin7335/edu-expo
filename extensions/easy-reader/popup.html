<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>술술 읽기</title>
<style>
  body{margin:0;width:270px;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#2b2620;background:#fffdf7}
  .wrap{padding:16px;display:flex;flex-direction:column;gap:10px}
  h1{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
  h1 img{width:28px;height:28px}
  p{margin:0;font-size:12.5px;color:#6b5f4c;line-height:1.5}
  button{border:0;font:inherit;font-size:16px;font-weight:800;padding:12px;border-radius:12px;background:#ff8a3d;color:#fff;cursor:pointer;box-shadow:0 3px 0 #d0672a}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #d0672a}
  kbd{background:#fff;border:1px solid #e3d6b4;border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11.5px}
  ul{margin:0;padding-left:16px;font-size:12px;color:#6b5f4c;line-height:1.6}
  .err{color:#c62828;font-weight:700;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="icon48.png" alt="">술술 읽기</h1>
  <p>지금 보고 있는 페이지에 읽기 도우미 패널을 띄워요.</p>
  <button id="go">📖 읽기 도우미 켜기 / 끄기</button>
  <p>단축키 <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd></p>
  <ul>
    <li>글자 크기 · 줄 간격 · 글자 간격 · 글꼴</li>
    <li>줄 가리개 · 크림/어두움 배경</li>
    <li>글을 골라 소리 내어 읽기(단어 따라가기)</li>
  </ul>
  <p>설정은 이 컴퓨터에만 저장돼요.</p>
  <p class="err" id="err">이 페이지(크롬 설정·웹스토어 등)에서는 쓸 수 없어요.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
