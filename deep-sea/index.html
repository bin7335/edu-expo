  for (const z of ZONES.slice(1)) { const zy = wy(z.y0); if (zy > 0 && zy < H) { ctx.strokeStyle = 'rgba(160,220,255,.25)'; ctx.setLineDash([8, 10]); ctx.beginPath(); ctx.moveTo(60, zy); ctx.lineTo(W, zy); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = 'rgba(160,220,255,.7)'; ctx.font = '700 13px system-ui'; ctx.textAlign = 'right'; ctx.fillText(z.a.toLocaleString('en-US') + 'm · ' + z.n + ' 시작', W - 14, zy - 6); } }
  for (const c of C) drawCreature(c);
  drawDark(phase === 'ready' ? 1 : lightAt(dm));
  drawGlows();
  drawSub();
  for (const c of C) if (c.scan > 0 && !found.includes(c.id)) { const x = wx(c.ax), y = wy(c.ay); ctx.strokeStyle = '#6fd3ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 50, -1.57, -1.57 + 6.283 * c.scan / 0.6); ctx.stroke(); }
  if (joy.on) { ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, 6.283); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.arc(joy.ox + clamp(joy.x - joy.ox, -50, 50), joy.oy + clamp(joy.y - joy.oy, -50, 50), 20, 0, 6.283); ctx.fill(); }
  drawGauge();
}
let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, last ? (ts - last) / 1000 : 0); last = ts;
  if (!manual) { acc += dt; let k = 0; while (acc >= DT && k < 6) { update(); acc -= DT; k++; } if (k) hud(); }
  draw();
}

// ---- 입력 ----
cv.addEventListener('pointerdown', e => { if (phase !== 'dive' || joy.on) return; if (e.pointerType === 'mouse') { mouse = { x: e.clientX, y: e.clientY }; } joy.on = true; joy.id = e.pointerId; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY; try { cv.setPointerCapture(e.pointerId); } catch (er) {} e.preventDefault(); });
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') mouse = { x: e.clientX, y: e.clientY }; if (joy.on && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
const up = e => { if (e.pointerId === joy.id) { joy.on = false; joy.id = -1; } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
const KM = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd' };
addEventListener('keydown', e => {
  if (KM[e.key]) { keys[KM[e.key]] = 1; if (phase === 'dive') { e.preventDefault(); mouse = null; } }
  else if ((e.key === 'Enter' || e.key === ' ') && phase === 'ready') { e.preventDefault(); start(); }
  else if ((e.key === 'f' || e.key === 'F' || e.key === 'l' || e.key === 'L') && phase === 'dive') { setLamp(!lamp); sfx.click(); }
});
addEventListener('keyup', e => { if (KM[e.key]) keys[KM[e.key]] = 0; });
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; joy.on = false; });
$('#start').addEventListener('click', start);
$('#again').addEventListener('click', start);
$('#home').addEventListener('click', home);
$('#lamp').addEventListener('click', () => { setLamp(!lamp); sfx.click(); });
$('#dexBtn').addEventListener('click', () => { fillDex($('#dexGrid'), phase === 'dive' ? [...new Set([...found, ...rec.dex])] : rec.dex); $('#dex').classList.add('on'); });
$('#dexClose').addEventListener('click', () => $('#dex').classList.remove('on'));
$('#snd').addEventListener('click', () => setSound(!sound));
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) $('#fs').hidden = true;
$('#fs').setAttribute('aria-label', '전체화면');
$('#fs').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  try { if (d.fullscreenElement || d.webkitFullscreenElement) { const x = (d.exitFullscreen || d.webkitExitFullscreen).call(d); if (x && x.catch) x.catch(() => {}); }
    else { const x = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (x && x.catch) x.catch(() => {}); } } catch (e) {}
});
addEventListener('resize', resize);

window.__test = {
  manual: v => { manual = !!v; },
  step: (n = 1) => { for (let i = 0; i < n; i++) update(); hud(); },
  input: o => { forced = o ? { x: clamp(o.x || 0, -1, 1), y: clamp(o.y || 0, -1, 1) } : null; },
  aim: a => { forcedAim = a === null || a === undefined ? null : a; },
  place: (x, y) => { sx = x; sy = y; vx = vy = 0; camX = x; camY = y; },
  setPower: p => { power = p; },
  yAt, zoneAt,
  info: () => ({ creatures: C.map(c => ({ id: c.id, name: c.name, x: c.x, y: c.y, depth: c.d, min: c.min, max: c.max, zone: c.zone })) }),
  state: () => ({ phase, x: sx, y: sy, vx, vy, depth: depth(), light: phase === 'ready' ? 1 : lightAt(depth()), power, lamp, found: found.slice(), sound, anim: C[0].ax + C[2].ay })
};
resize(); hud(); follow(1);
for (let i = 0; i < 30; i++) update();
requestAnimationFrame(frame);
})();
</script>
