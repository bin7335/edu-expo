<meta charset="UTF-8">
<!-- csp:auto --><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><!-- /csp:auto -->

<title>교구 대장 - 교구·물품 수량, 대여·반납, 재물조사표</title>
<meta name="description" content="교구·물품의 분류·위치·수량·최소 수량을 대장으로 관리하고, 대여·반납을 기록하면 남은 수량이 자동 계산됩니다. 부족·반납 지연 강조, 엑셀 붙여넣기 일괄 등록, 검색·분류 필터, CSV 내보내기, 재물조사표 인쇄.">
<style>
  :root{--bg:#f7f3ec;--panel:#fff;--ink:#2a2620;--sub:#6b6357;--line:#e6ddcf;--brand:#a0522d;--brand2:#d08a4f;--soft:#fbf1e6;--ok:#2f855a;--mid:#b7791f;--bad:#c53030}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;flex-wrap:wrap}
  .logo{width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:22px;flex:none}
  header h1{margin:0;font-size:22px;letter-spacing:-.5px}
  header p{margin:0;font-size:13px;opacity:.92}
  .grow{flex:1}
  .lock{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#6b2f12;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
  .wipe{font:inherit;font-size:12px;font-weight:700;border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:4px 10px;cursor:pointer}
  .wrap{max-width:1400px;margin:0 auto;padding:10px 20px 50px}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .summary div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--sub);font-weight:700}
  .summary b{display:block;font-size:24px;color:var(--ink)}
  .summary .low b,.summary .late b{color:var(--bad)}
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:12px 0 10px;overflow-x:auto}
  .tab{font:inherit;font-size:14.5px;font-weight:800;border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand)}
  .view{display:none}.view.on{display:block}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
  .panel h2{font-size:15px;margin:0 0 8px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .bar input[type=search]{flex:1 1 180px}
  .btn{border-radius:10px;padding:7px 12px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--line);white-space:nowrap}
  .btn:hover{filter:brightness(.96)}
  .btn.primary{background:var(--brand);color:#fff;border-color:transparent}
  input,select,textarea{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
  label.f{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:7px 0 3px}
  .panel input:not([type=search]),.panel select.w,.panel textarea{width:100%}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tw{overflow-x:auto}
  table.t{width:100%;border-collapse:collapse;font-size:13.5px}
  .t th{background:var(--soft);color:var(--sub);font-size:12.5px;text-align:left;padding:7px 8px;white-space:nowrap}
  .t td{border-top:1px solid var(--line);padding:6px 8px;vertical-align:middle}
  .t td.n{text-align:right;font-variant-numeric:tabular-nums}
  .t .nm{font-weight:800}
  .t tr.low td{background:#fff5f5}
  .t tr.late td{background:#fff8eb}
  .badge{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 7px;background:#e6f4ea;color:var(--ok);white-space:nowrap}
  .badge.low{background:#fde2e2;color:var(--bad)} .badge.late{background:#ffefd5;color:#9a5b00}
  .avail{font-weight:900;font-size:15px}
  tr.low .avail{color:var(--bad)}
  .act{white-space:nowrap}
  .act button{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 7px;cursor:pointer}
  .hint{font-size:12px;color:var(--sub);line-height:1.5}
  #bulk{min-height:160px;font-family:ui-monospace,Consolas,"Malgun Gothic",monospace;font-size:13px;white-space:pre;overflow:auto}
  #bulkPreview tr.err td{background:#fff5f5;color:var(--bad)}
  .empty{color:var(--sub);font-size:14px;padding:18px;text-align:center}
  #printArea{display:none}
  .back{position:fixed;right:12px;bottom:10px;font-size:12px;color:var(--sub);background:rgba(255,255,255,.92);padding:5px 10px;border-radius:20px;text-decoration:none;border:1px solid var(--line);z-index:30}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2620;color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:80;max-width:90vw}
  .toast.on{opacity:1}
  @media (max-width:900px){
    .cols{grid-template-columns:1fr}
    .wrap{padding:10px}
    .summary{grid-template-columns:repeat(2,1fr)}
    header{padding:10px 12px} header p{display:none} header h1{font-size:19px}
    .lock{font-size:11.5px;padding:5px 9px}
  }
  @media print{
    body>*:not(#printArea){display:none!important}
    body{background:#fff}
    #printArea{display:block!important;font-size:10.5pt}
    #printArea h2{font-size:17pt;margin:0 0 4px;text-align:center}
    #printArea p{margin:0 0 8px}
    #printArea table{width:100%;border-collapse:collapse}
    #printArea th,#printArea td{border:1px solid #333;padding:5px;text-align:center}
    #printArea th{background:#eee}
    #printArea td.l{text-align:left}
    #printArea .sign{margin-top:24px;text-align:right;line-height:2.2}
  }
</style>

<body>
<header>
  <div class="logo" aria-hidden="true">🧪</div>
  <div>
    <h1>교구 대장</h1>
    <p>교구·물품 수량과 대여·반납을 한 장에 · 남은 수량 자동 · 부족·미반납 한눈에</p>
  </div>
  <div class="grow"></div>
  <span class="lock" title="대장은 이 브라우저에만 저장됩니다">🔒 이 PC에만 저장 · 외부 전송 없음</span>
  <button type="button" class="wipe" id="wipeAll" title="대여자 이름 등 이 PC의 기록을 모두 지워요">🧹 이 PC 기록 모두 지우기</button>
</header>
<div class="wrap">
  <div class="summary" id="summary"></div>
  <div class="tabs" id="tabs">
    <button type="button" class="tab on" data-tab="ledger">📦 대장</button>
    <button type="button" class="tab" data-tab="loan">🔄 대여·반납</button>
    <button type="button" class="tab" data-tab="bulk">📥 엑셀 붙여넣기 등록</button>
  </div>
  <div class="view on" id="v-ledger">
    <div class="cols">
      <section class="panel">
        <div class="bar">
          <input type="search" id="q" placeholder="🔍 품명·위치·비고 검색" aria-label="검색">
          <select id="cat" aria-label="분류"></select>
          <select id="flt" aria-label="상태"><option value="">모든 상태</option><option value="low">⚠ 부족만</option><option value="out">대여 중인 것</option><option value="late">⏰ 반납 지연</option></select>
          <button type="button" class="btn" id="exportCsv">📊 CSV</button>
          <button type="button" class="btn" id="printBtn">🖨 재물조사표</button>
        </div>
        <div class="tw"><table class="t" id="ledger"></table></div>
      </section>
      <aside class="panel">
        <h2 id="iTitle">➕ 물품 추가</h2>
        <label class="f" for="iName">품명</label><input id="iName" placeholder="예: 비커 500mL">
        <div class="two">
          <div><label class="f" for="iCat">분류</label><input id="iCat" list="catList" placeholder="예: 과학"><datalist id="catList"></datalist></div>
          <div><label class="f" for="iLoc">위치</label><input id="iLoc" placeholder="예: 과학실 A장"></div>
        </div>
        <div class="two">
          <div><label class="f" for="iQty">총 수량</label><input id="iQty" type="number" min="0" step="1" value="1"></div>
          <div><label class="f" for="iMin">최소 수량</label><input id="iMin" type="number" min="0" step="1" value="0"></div>
        </div>
        <label class="f" for="iNote">비고</label><input id="iNote" placeholder="예: 2025년 구입">
        <div class="bar" style="margin-top:10px"><button type="button" class="btn primary" id="iSave">저장</button><button type="button" class="btn" id="iNew">새로 쓰기</button></div>
        <p class="hint">남은 수량 = 총 수량 − 대여 중. 남은 수량이 최소 수량보다 적으면 <b style="color:#c53030">부족</b>으로 표시돼요.</p>
      </aside>
    </div>
  </div>
  <div class="view" id="v-loan">
    <div class="cols">
      <section class="panel">
        <h2>📤 대여 중</h2>
        <div class="tw"><table class="t" id="loans"></table></div>
        <h2 style="margin-top:14px">📚 최근 반납</h2>
        <div class="tw"><table class="t" id="history"></table></div>
      </section>
      <aside class="panel">
        <h2>🔄 빌려주기</h2>
        <label class="f" for="lItem">물품</label><select id="lItem" class="w"></select>
        <label class="f" for="lWho">누가 (학년반·이름)</label><input id="lWho" placeholder="예: 5-1 김선생">
        <label class="f" for="lN">개수</label><input id="lN" type="number" min="1" step="1" value="1">
        <div class="two">
          <div><label class="f" for="lDate">빌린 날</label><input id="lDate" type="date"></div>
          <div><label class="f" for="lDue">반납 예정일</label><input id="lDue" type="date"></div>
        </div>
        <div class="bar" style="margin-top:10px"><button type="button" class="btn primary" id="lSave">대여 기록</button></div>
      </aside>
    </div>
  </div>
  <div class="view" id="v-bulk">
    <section class="panel">
      <h2>📥 엑셀에서 복사해 붙여넣기</h2>
      <p class="hint">열 순서: <b>품명 · 분류 · 위치 · 수량 · 최소 수량 · 비고</b> (첫 줄이 제목이면 자동으로 건너뛰어요). 품명과 위치가 같은 물품은 새로 만들지 않고 수량·분류를 고쳐요.</p>
      <textarea id="bulk" aria-label="붙여 넣을 표" placeholder="품명	분류	위치	수량	최소 수량&#10;리트머스 종이	과학	과학실 B장	20	5"></textarea>
      <div class="bar" style="margin-top:8px"><button type="button" class="btn primary" id="bulkAdd">등록</button><span class="hint" id="bulkInfo"></span></div>
      <div class="tw"><table class="t" id="bulkPreview"></table></div>
    </section>
  </div>
</div>
<div id="printArea"></div>
<a class="back" href="../">← 전체 데모 보기</a>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  'use strict';
  var KEY = 'edu-expo.stock-ledger.v1';
  var $ = function(s){ return document.querySelector(s); }, $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var pad = function(n){ return String(n).padStart(2, '0'); };
  var ymd = function(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parse = function(s){ return new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10), 12); };
  var validDate = function(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && ymd(parse(s)) === s; };
  var today = function(){ return ymd(new Date()); };
  var addDays = function(s, n){ var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  var dayDiff = function(a, b){ return Math.round((parse(b) - parse(a)) / 864e5); };
  var md = function(s){ var d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate(); };
  var uid = function(){ return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
  var str = function(v, n){ return typeof v === 'string' ? v.trim().slice(0, n) : ''; };
  var intOk = function(v){ return typeof v === 'number' && isFinite(v) && v >= 0 && Math.floor(v) === v && v <= 999999; };
  var toInt = function(s){ s = String(s == null ? '' : s).replace(/[,\s개]/g, ''); return /^\d+$/.test(s) ? +s : NaN; };

  function sample(){
    var T = today();
    var it = [['비커 500mL', '과학', '과학실 A장', 24, 10, ''], ['알코올램프', '과학', '과학실 A장', 12, 8, '심지 교체 필요'], ['현미경', '과학', '과학실 준비실', 8, 6, '2024년 구입'], ['전자저울', '과학', '과학실 준비실', 6, 2, ''],
      ['피구공', '체육', '체육창고 1번', 10, 4, ''], ['줄넘기(긴 줄)', '체육', '체육창고 2번', 6, 2, ''], ['훌라후프', '체육', '체육창고 2번', 30, 10, ''], ['태블릿', '정보', '컴퓨터실 충전함', 30, 25, '충전함 번호 1-30'],
      ['리코더', '음악', '음악실 서랍', 20, 5, '대여용'], ['각도기(칠판용)', '수학', '수학 교구실', 4, 1, '']].map(function(a){ return {id: uid(), name: a[0], cat: a[1], loc: a[2], qty: a[3], min: a[4], note: a[5]}; });
    var by = function(n){ return it.find(function(x){ return x.name === n; }).id; };
    var ln = function(n, who, k, d, due, ret){ return {id: uid(), itemId: by(n), who: who, n: k, date: addDays(T, d), due: addDays(T, due), ret: ret == null ? '' : addDays(T, ret)}; };
    return {items: it, loans: [
      ln('비커 500mL', '5-2 박선생', 16, -2, 3), ln('알코올램프', '6-1 최선생', 6, -1, 1), ln('피구공', '4-3 정선생', 3, -9, -2), ln('태블릿', '3-1 한선생', 8, 0, 0),
      ln('현미경', '6-2 이선생', 2, -12, -5, -6), ln('리코더', '3-2 강선생', 4, -20, -10, -10)
    ]};
  }
  function cleanData(st){
    var items = (Array.isArray(st.items) ? st.items : []).filter(function(i){ return i && str(i.name, 60) && intOk(i.qty) && intOk(i.min); })
      .map(function(i){ return {id: str(i.id, 40) || uid(), name: str(i.name, 60), cat: str(i.cat, 20), loc: str(i.loc, 40), qty: i.qty, min: i.min, note: str(i.note, 100)}; });
    var ids = {}; items.forEach(function(i){ ids[i.id] = 1; });
    var loans = (Array.isArray(st.loans) ? st.loans : []).filter(function(l){ return l && ids[l.itemId] && str(l.who, 40) && intOk(l.n) && l.n > 0 && validDate(l.date) && validDate(l.due); })
      .map(function(l){ return {id: str(l.id, 40) || uid(), itemId: l.itemId, who: str(l.who, 40), n: l.n, date: l.date, due: l.due, ret: validDate(l.ret) ? l.ret : ''}; });
    return {items: items, loans: loans};
  }
  var state = sample();
  try { var st = JSON.parse(localStorage.getItem(KEY) || 'null'); if (st && Array.isArray(st.items)) state = cleanData(st); } catch(e){}
  var editId = null;

  var toastT;
  function toast(m){ var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 2400); }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast('저장 공간이 부족해요'); } }
  function active(){ return state.loans.filter(function(l){ return !l.ret; }); }
  function info(it){
    var T = today(), out = 0, late = 0;
    active().forEach(function(l){ if (l.itemId === it.id) { out += l.n; if (l.due < T) late++; } });
    var avail = it.qty - out, low = avail < it.min;
    var label = low && late ? '부족·반납 지연' : low ? '부족' : late ? '반납 지연' : '정상';
    return {out: out, avail: avail, low: low, late: late, label: label};
  }
  function itemById(id){ return state.items.find(function(i){ return i.id === id; }); }
  function cats(){ var o = {}; state.items.forEach(function(i){ if (i.cat) o[i.cat] = 1; }); return Object.keys(o).sort(function(a, b){ return a.localeCompare(b, 'ko'); }); }
  function filtered(){
    var q = $('#q').value.trim().toLowerCase(), c = $('#cat').value, f = $('#flt').value;
    return state.items.filter(function(it){
      var x = info(it);
      if (c && it.cat !== c) return false;
      if (f === 'low' && !x.low) return false;
      if (f === 'late' && !x.late) return false;
      if (f === 'out' && !x.out) return false;
      if (q && (it.name + ' ' + it.cat + ' ' + it.loc + ' ' + it.note).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function(a, b){ return (a.cat + '\u0001' + a.name).localeCompare(b.cat + '\u0001' + b.name, 'ko'); });
  }
  function render(){
    var T = today(), act = active();
    var lowN = state.items.filter(function(i){ return info(i).low; }).length, lateN = act.filter(function(l){ return l.due < T; }).length;
    $('#summary').innerHTML = '<div data-k="items">📦 물품<b>' + state.items.length + '</b></div><div data-k="out">📤 대여 중<b>' + act.length + '</b></div><div class="low" data-k="low">⚠ 부족<b>' + lowN + '</b></div><div class="late" data-k="late">⏰ 반납 지연<b>' + lateN + '</b></div>';
    var cs = cats(), cur = $('#cat').value;
    $('#cat').innerHTML = '<option value="">모든 분류</option>' + cs.map(function(c){ return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
    if (cs.indexOf(cur) >= 0) $('#cat').value = cur;
    $('#catList').innerHTML = cs.map(function(c){ return '<option value="' + esc(c) + '"></option>'; }).join('');
    var list = filtered();
    $('#ledger').innerHTML = '<thead><tr><th>품명</th><th>분류</th><th>위치</th><th>총</th><th>대여 중</th><th>남은</th><th>최소</th><th>상태</th><th></th></tr></thead><tbody>'
      + (list.length ? list.map(function(it){ var x = info(it); return '<tr class="' + (x.low ? 'low' : x.late ? 'late' : '') + '"><td><span class="nm">' + esc(it.name) + '</span>' + (it.note ? '<br><span class="hint">' + esc(it.note) + '</span>' : '') + '</td><td>' + esc(it.cat || '-') + '</td><td>' + esc(it.loc || '-') + '</td>'
        + '<td class="n" data-k="qty">' + it.qty + '</td><td class="n" data-k="out">' + x.out + '</td><td class="n avail" data-k="avail">' + x.avail + '</td><td class="n" data-k="min">' + it.min + '</td>'
        + '<td><span class="badge' + (x.low ? ' low' : x.late ? ' late' : '') + '" data-k="state">' + x.label + '</span></td>'
        + '<td class="act"><button type="button" data-lend="' + esc(it.id) + '">빌려주기</button> <button type="button" data-edit="' + esc(it.id) + '">수정</button> <button type="button" data-del="' + esc(it.id) + '">삭제</button></td></tr>'; }).join('')
        : '<tr><td colspan="9" class="empty">조건에 맞는 물품이 없어요.</td></tr>') + '</tbody>';
    // 대여
    var curItem = $('#lItem').value;
    $('#lItem').innerHTML = state.items.slice().sort(function(a, b){ return a.name.localeCompare(b.name, 'ko'); }).map(function(it){ return '<option value="' + esc(it.id) + '">' + esc(it.name) + ' (남은 ' + info(it).avail + '개)</option>'; }).join('');
    if (itemById(curItem)) $('#lItem').value = curItem;
    var al = act.slice().sort(function(a, b){ return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
    $('#loans').innerHTML = '<thead><tr><th>물품</th><th>누가</th><th>개수</th><th>빌린 날</th><th>반납 예정</th><th>상태</th><th></th></tr></thead><tbody>'
      + (al.length ? al.map(function(l){ var it = itemById(l.itemId), d = dayDiff(l.due, T);
        return '<tr class="' + (d > 0 ? 'late' : '') + '"><td class="nm">' + esc(it ? it.name : '') + '</td><td>' + esc(l.who) + '</td><td class="n">' + l.n + '</td><td>' + md(l.date) + '</td><td>' + md(l.due) + '</td>'
          + '<td>' + (d > 0 ? '<span class="badge late">' + d + '일 지남</span>' : d === 0 ? '<span class="badge">오늘 반납</span>' : '<span class="badge">D-' + (-d) + '</span>') + '</td><td class="act"><button type="button" data-ret="' + esc(l.id) + '">✔ 반납</button></td></tr>'; }).join('')
        : '<tr><td colspan="7" class="empty">대여 중인 물품이 없어요.</td></tr>') + '</tbody>';
    var hist = state.loans.filter(function(l){ return l.ret; }).sort(function(a, b){ return a.ret < b.ret ? 1 : -1; }).slice(0, 30);
    $('#history').innerHTML = '<thead><tr><th>물품</th><th>누가</th><th>개수</th><th>빌린 날</th><th>반납한 날</th></tr></thead><tbody>'
      + (hist.length ? hist.map(function(l){ var it = itemById(l.itemId); return '<tr><td>' + esc(it ? it.name : '') + '</td><td>' + esc(l.who) + '</td><td class="n">' + l.n + '</td><td>' + md(l.date) + '</td><td>' + md(l.ret) + (l.ret > l.due ? ' <span class="badge late">늦음</span>' : '') + '</td></tr>'; }).join('')
        : '<tr><td colspan="5" class="empty">반납 기록이 없어요.</td></tr>') + '</tbody>';
  }
  // 물품 추가·수정
  function resetForm(){ editId = null; $('#iName').value = ''; $('#iCat').value = ''; $('#iLoc').value = ''; $('#iQty').value = '1'; $('#iMin').value = '0'; $('#iNote').value = ''; $('#iTitle').textContent = '➕ 물품 추가'; }
  $('#iSave').addEventListener('click', function(){
    var name = str($('#iName').value, 60), qty = toInt($('#iQty').value), min = toInt($('#iMin').value || '0');
    if (!name) return toast('품명을 적어 주세요');
    if (isNaN(qty) || isNaN(min)) return toast('수량은 0 이상의 정수로 적어 주세요');
    var rec = {name: name, cat: str($('#iCat').value, 20), loc: str($('#iLoc').value, 40), qty: qty, min: min, note: str($('#iNote').value, 100)};
    var it = editId && itemById(editId);
    if (it) { Object.assign(it, rec); toast('수정했어요'); }
    else { rec.id = uid(); state.items.push(rec); toast(name + '을(를) 추가했어요'); }
    resetForm(); save(); render();
  });
  $('#iNew').addEventListener('click', resetForm);
  $('#ledger').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    var id = b.getAttribute('data-edit') || b.getAttribute('data-del') || b.getAttribute('data-lend'), it = itemById(id); if (!it) return;
    if (b.hasAttribute('data-edit')) { editId = id; $('#iName').value = it.name; $('#iCat').value = it.cat; $('#iLoc').value = it.loc; $('#iQty').value = String(it.qty); $('#iMin').value = String(it.min); $('#iNote').value = it.note; $('#iTitle').textContent = '✏️ 물품 수정'; $('#iName').focus(); return; }
    if (b.hasAttribute('data-lend')) { showTab('loan'); $('#lItem').value = id; $('#lWho').focus(); return; }
    var n = state.loans.filter(function(l){ return l.itemId === id; }).length;
    if (!confirm('"' + it.name + '"을(를) 대장에서 지울까요?' + (n ? '\n대여 기록 ' + n + '건도 함께 지워져요.' : ''))) return;
    state.items = state.items.filter(function(x){ return x.id !== id; });
    state.loans = state.loans.filter(function(l){ return l.itemId !== id; });
    if (editId === id) resetForm();
    save(); render(); toast('지웠어요');
  });
  ['#q', '#cat', '#flt'].forEach(function(s){ $(s).addEventListener('input', render); $(s).addEventListener('change', render); });
  // 대여·반납
  $('#lSave').addEventListener('click', function(){
    var it = itemById($('#lItem').value), who = str($('#lWho').value, 40), n = toInt($('#lN').value), d = $('#lDate').value, due = $('#lDue').value;
    if (!it) return toast('물품을 골라 주세요');
    if (!who) return toast('누가 빌리는지 적어 주세요');
    if (isNaN(n) || n < 1) return toast('개수는 1 이상으로 적어 주세요');
    if (!validDate(d) || !validDate(due)) return toast('날짜를 확인해 주세요');
    if (due < d) return toast('반납 예정일이 빌린 날보다 앞이에요');
    var av = info(it).avail;
    if (n > av) return toast('남은 수량 ' + av + '개보다 많이 빌릴 수 없어요');
    state.loans.push({id: uid(), itemId: it.id, who: who, n: n, date: d, due: due, ret: ''});
    $('#lWho').value = ''; $('#lN').value = '1';
    save(); render(); toast(it.name + ' ' + n + '개 대여 기록 (남은 ' + (av - n) + '개)');
  });
  $('#loans').addEventListener('click', function(e){
    var b = e.target.closest('[data-ret]'); if (!b) return;
    var l = state.loans.find(function(x){ return x.id === b.getAttribute('data-ret'); }); if (!l || l.ret) return;
    l.ret = today(); save(); render(); toast('반납 처리했어요');
  });
  // 일괄 등록
  function parseBulk(){
    var lines = $('#bulk').value.replace(/\r\n?/g, '\n').split('\n').filter(function(l){ return l.trim(); });
    var rows = [];
    lines.forEach(function(l, i){
      var c = l.split(l.indexOf('\t') >= 0 ? '\t' : ',').map(function(x){ return x.trim(); });
      if (i === 0 && isNaN(toInt(c[3])) && /품명|물품|이름|수량/.test(l)) return;
      var r = {name: (c[0] || '').slice(0, 60), cat: (c[1] || '').slice(0, 20), loc: (c[2] || '').slice(0, 40), qty: toInt(c[3]), min: c[4] ? toInt(c[4]) : 0, note: (c[5] || '').slice(0, 100), err: ''};
      if (!r.name) r.err = '품명 없음'; else if (isNaN(r.qty)) r.err = '수량이 숫자가 아님'; else if (isNaN(r.min)) r.err = '최소 수량이 숫자가 아님';
      rows.push(r);
    });
    return rows;
  }
  function findSame(r){ return state.items.find(function(i){ return i.name === r.name && i.loc === r.loc; }); }
  function renderBulk(){
    var rows = parseBulk(), ok = rows.filter(function(r){ return !r.err; });
    $('#bulkAdd').textContent = ok.length + '개 등록';
    $('#bulkInfo').textContent = rows.length ? '정상 ' + ok.length + '줄' + (rows.length - ok.length ? ' · 오류 ' + (rows.length - ok.length) + '줄(건너뜀)' : '') : '';
    $('#bulkPreview').innerHTML = rows.length ? '<thead><tr><th>품명</th><th>분류</th><th>위치</th><th>수량</th><th>최소</th><th>처리</th></tr></thead><tbody>' + rows.map(function(r){
      return '<tr class="' + (r.err ? 'err' : 'ok') + '"><td>' + esc(r.name) + '</td><td>' + esc(r.cat) + '</td><td>' + esc(r.loc) + '</td><td class="n">' + (isNaN(r.qty) ? '?' : r.qty) + '</td><td class="n">' + (isNaN(r.min) ? '?' : r.min) + '</td><td>' + (r.err ? '⚠ ' + esc(r.err) : findSame(r) ? '갱신' : '추가') + '</td></tr>';
    }).join('') + '</tbody>' : '';
  }
  $('#bulk').addEventListener('input', renderBulk);
  $('#bulkAdd').addEventListener('click', function(){
    var rows = parseBulk(), add = 0, upd = 0, bad = 0;
    rows.forEach(function(r){
      if (r.err) { bad++; return; }
      var same = findSame(r);
      if (same) { same.cat = r.cat || same.cat; same.qty = r.qty; same.min = r.min; if (r.note) same.note = r.note; upd++; }
      else { state.items.push({id: uid(), name: r.name, cat: r.cat, loc: r.loc, qty: r.qty, min: r.min, note: r.note}); add++; }
    });
    if (!add && !upd) return toast(rows.length ? '등록할 줄이 없어요 (오류 ' + bad + '줄)' : '엑셀에서 복사한 표를 붙여 넣어 주세요');
    save(); render(); renderBulk();
    toast('추가 ' + add + ' · 갱신 ' + upd + (bad ? ' · 오류 ' + bad + '줄 건너뜀' : ''));
  });
  // 탭
  function showTab(n){ $$('#tabs .tab').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-tab') === n); }); $$('.view').forEach(function(v){ v.classList.toggle('on', v.id === 'v-' + n); }); }
  $('#tabs').addEventListener('click', function(e){ var b = e.target.closest('.tab'); if (b) showTab(b.getAttribute('data-tab')); });
  // CSV·인쇄
  var csvCell = function(v){ v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  function csv(){ return ['품명,분류,위치,총 수량,대여 중,남은 수량,최소 수량,상태,비고'].concat(filtered().map(function(it){ var x = info(it); return [it.name, it.cat, it.loc, it.qty, x.out, x.avail, it.min, x.label, it.note].map(csvCell).join(','); })).join('\n'); }
  $('#exportCsv').addEventListener('click', function(){
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv()], {type: 'text/csv;charset=utf-8'}));
    a.download = '교구대장_' + today() + '.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast('CSV로 내보냈어요 (엑셀에서 열기)');
  });
  $('#printBtn').addEventListener('click', function(){
    var list = filtered().sort(function(a, b){ return (a.loc + '\u0001' + a.name).localeCompare(b.loc + '\u0001' + b.name, 'ko'); });
    if (!list.length) return toast('인쇄할 물품이 없어요');
    var c = $('#cat').value;
    $('#printArea').innerHTML = '<h2>교구·물품 재물조사표</h2><p>햇살초등학교' + (c ? ' · 분류: ' + esc(c) : '') + ' · 조사일: ' + today() + ' · ' + list.length + '종</p><table><thead><tr><th>번호</th><th>품명</th><th>분류</th><th>위치</th><th>대장 수량</th><th>대여 중</th><th>실재 수량</th><th>차이</th><th>비고</th></tr></thead><tbody>'
      + list.map(function(it, i){ return '<tr><td>' + (i + 1) + '</td><td class="l">' + esc(it.name) + '</td><td>' + esc(it.cat) + '</td><td class="l">' + esc(it.loc) + '</td><td>' + it.qty + '</td><td>' + info(it).out + '</td><td></td><td></td><td class="l">' + esc(it.note) + '</td></tr>'; }).join('')
      + '</tbody></table><div class="sign">조사자: ____________ (인)　　확인자: ____________ (인)</div>';
    window.print();
  });
  $('#wipeAll').addEventListener('click', function(){
    if (!confirm('이 PC에 저장된 교구 대장과 대여 기록을 모두 지울까요? 되돌릴 수 없어요.\n(필요하면 먼저 CSV로 내보내세요)')) return;
    try { localStorage.setItem(KEY, JSON.stringify({items: [], loans: []})); } catch(e){}
    location.reload();
  });
  window.__stock = {state: function(){ return state; }, csv: csv, setData: function(d){ state = cleanData(d || {}); save(); render(); }};
  $('#lDate').value = today(); $('#lDue').value = addDays(today(), 7);
  render();
})();
</script>
</body>
</html>
