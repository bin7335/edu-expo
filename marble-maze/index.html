<style>
:root{--ink:#22304d;--sub:#5f6b85;--line:#e2e7f1}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f3f7ff;color:var(--ink);display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation}
header{display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#7ec8ff 30%,#1f6fd6 70%,#0d3b8a);box-shadow:3px 5px 0 rgba(0,0,0,.15);flex-shrink:0}
.ttl{min-width:0}
h1{margin:0;font-size:24px;letter-spacing:-.5px}
header small{display:block;color:var(--sub);font-size:13px}
.lvs{margin-left:auto;display:flex;gap:5px}
.lv{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 10px;font-weight:900;color:var(--ink);line-height:1.15;min-width:52px}
.lv small{display:block;font-size:11px;color:#e0a100;letter-spacing:-1px}
.lv.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lv:disabled{opacity:.45;cursor:default}
.tool{border:0;background:#e9eef8;border-radius:12px;padding:9px 12px;font-weight:800;color:var(--sub)}
main{flex:1;display:flex;flex-direction:column;gap:6px;padding:0 16px 4px;min-height:0}
.hud{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:2px solid var(--line);border-radius:99px;padding:3px 12px;font-weight:800;color:var(--sub);font-size:14px;white-space:nowrap}
.pill b{color:var(--ink);font-size:19px;margin-left:3px;display:inline-block}
.tb{flex:1;min-width:60px;height:14px;background:#e3e9f5;border-radius:99px;overflow:hidden}
.tb i{display:block;height:100%;background:linear-gradient(90deg,#2fbf7d,#9be15d);transform-origin:left}
.tb.low i{background:linear-gradient(90deg,#ff5d5d,#ffa043)}
.ib{border:2px solid var(--line);background:#fff;border-radius:99px;width:44px;height:36px;font-size:16px}
.ib:disabled{opacity:.4;cursor:default}
.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.4)}}
.stage{position:relative;flex:1;min-height:330px;border-radius:22px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:radial-gradient(ellipse at 40% 30%,#e8f4ff,#bfd9f2)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px}
.ov.on{display:flex}
.ov.dim{background:rgba(20,30,50,.4)}
#ready{justify-content:flex-end;padding-right:3%}
.card{background:rgba(255,255,255,.96);border-radius:24px;padding:20px 24px;max-width:390px;width:100%;box-shadow:0 8px 0 rgba(0,0,0,.08);text-align:center}

.card p{margin:4px 0;color:var(--sub);font-weight:700}
.how{list-style:none;padding:0;margin:12px 0;text-align:left;display:grid;gap:7px}
.how li{background:#f4f7fd;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}
.how b{color:#1f6fd6}
.big{border:0;background:linear-gradient(#3d8bff,#1f6fd6);color:#fff;font-weight:900;font-size:21px;padding:12px 26px;border-radius:16px;box-shadow:0 5px 0 #154f9e;margin:6px 3px 0}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #154f9e}
.big.alt{background:#eef1f8;color:var(--ink);box-shadow:0 5px 0 #c9d0e0}
.stars{font-size:44px;letter-spacing:4px;color:#ffc21a;text-shadow:0 3px 0 #e59a00;margin:2px 0}
.stars i{font-style:normal;color:#d8dee9;text-shadow:none}
.rtime{font-size:40px;font-weight:900;margin:2px 0}
.newrec{display:inline-block;background:#fff1b8;color:#9a6400;font-weight:900;border-radius:99px;padding:5px 14px;margin:4px 0}

  h1{font-size:21px}

  .card{padding:14px}

<body>

<main>
  <div class="hud">

    <div class="ov on" id="ready">
      <div class="card">

        <p id="rdSub">1단계 · 첫 굴리기</p>
        <ul class="how">

      </div>
    </div>
  </div>
</main>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const KEY = 'edu-expo-marble-maze-v1';
let store = null;
try { store = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!store || typeof store !== 'object') store = {};
if (!store.best || typeof store.best !== 'object') store.best = {};
if (!store.stars || typeof store.stars !== 'object') store.stars = {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const bestOf = i => { const v = +store.best[i]; return v > 0 && v < 1e4 ? v : 0; };
const starsOf = i => Math.max(0, Math.min(3, Math.floor(+store.stars[i] || 0)));
let soundOn = store.sound !== false;

// # 벽 · 바닥 O 구멍 S 출발 C 체크포인트 G 깃발
const LV = [
  { name: '첫 굴리기', limit: 60, t3: 11, t2: 18, map: ['#############', '#S..........#', '#...........#', '#########...#', '#...........#', '#..........O#', '#...#########', '#..........G#', '#############'] },
  { name: '구멍 조심', limit: 60, t3: 9, t2: 15, map: ['#############', '#S...#......#', '#....#..O...#', '#.O..#......#', '#....#..##..#', '#....C..#O..#', '#.O.....#...#', '#....O..#..G#', '#############'] },
  { name: '구멍 사이로', limit: 75, t3: 8, t2: 14, map: ['#############', '#S..O...O...#', '#...O.O.O.O.#', '#.....O.C.O.#', '#OOO..O.O.O.#', '#...O...O...#', '#...O.OOOOO.#', '#...O......G#', '#############'] },
  { name: '꼬불꼬불 숲', limit: 90, t3: 13, t2: 21, map: ['#############', '#S#.....#...#', '#.#.###.#.#.#', '#.#.#O..#.#.#', '#...#.###.#.#', '###.#...C.#.#', '#O..###.#O#.#', '#.......#..G#', '#############'] },
  { name: '마지막 관문', limit: 90, t3: 8, t2: 14, map: ['#############', '#S..O...O..G#', '#.O...O...O.#', '#...O.#.O...#', '##O.#...#.O##', '#...O.#.O...#', '#.O...O...O.#', '#.....C.....#', '#############'] }
];
const DT = 1 / 60, CS = 48, R = 14, HR = 19, FR = 16, ACC = 900, DAMP = 1.4, MAXV = 520, REST = 0.5, AIV = 230;

const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
const bcv = document.createElement('canvas'), bctx = bcv.getContext('2d');
let cw = 1, ch = 1, dpr = 1, scale = 1, ox = 0, oy = 0, oxCur = null, orient = 0, L = null, lvI = 0;
let phase = 'title', manual = false, g = null, testIn = null, rnd = Math.random;
const kb = { l: 0, r: 0, u: 0, d: 0 }, joy = { on: false, id: null, x0: 0, y0: 0, x: 0, y: 0 }, tilt = { on: false, x: 0, y: 0, b0: null };
if (Object.prototype.hasOwnProperty.call(store, 'level') && +store.level >= 0 && +store.level < LV.length) lvI = Math.floor(+store.level);

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---- 단계 만들기 (세로 화면이면 판을 돌려 크게) ----
function build(i, tr) {
  const m = LV[i].map, rows = tr ? m[0].length : m.length, cols = tr ? m.length : m[0].length;
  const at = (c, r) => tr ? m[c][r] : m[r][c];
  const o = { cols, rows, W: cols * CS, H: rows * CS, cell: [], holes: [], cps: [], goal: null, start: null };
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const ch2 = at(c, r), p = { x: c * CS + CS / 2, y: r * CS + CS / 2, c, r };
    o.cell.push(ch2);
    if (ch2 === 'O') o.holes.push(p); else if (ch2 === 'C') o.cps.push(p); else if (ch2 === 'G') o.goal = p; else if (ch2 === 'S') o.start = p;
  }
  return o;
}
const cellAt = (c, r) => (c < 0 || r < 0 || c >= L.cols || r >= L.rows) ? '#' : L.cell[r * L.cols + c];

function fresh(demo, i) {
  lvI = i; L = build(i, orient);
  const s = L.start;
  g = { demo, lv: i, t: 0, falls: 0, bounces: 0, cp: { x: s.x, y: s.y }, cpOn: {}, parts: [], pops: [], shake: 0, sndT: 0, beepS: 99, resetT: 0, done: false,
    m: { x: s.x, y: s.y, px: s.x, py: s.y, vx: 0, vy: 0, sq: 0, sqa: 0, fall: 0, fx: 0, fy: 0, ra: 0, rb: 0 }, ai: { path: null, i: 0 } };
  drawBoard();
}
function setOrient(tr) {
  if (tr === orient || !g) { orient = tr; return; }
  orient = tr; const sw = p => { const t = p.x; p.x = p.y; p.y = t; };
  L = build(lvI, orient); const m = g.m;
  sw(m); let t = m.vx; m.vx = m.vy; m.vy = t; m.px = m.x; m.py = m.y; sw(g.cp);
  for (const p of g.parts) { sw(p); t = p.vx; p.vx = p.vy; p.vy = t; }
  for (const p of g.pops) sw(p);
  const k = {}; for (const key in g.cpOn) { const [c, r] = key.split(',').map(Number); k[r + ',' + c] = 1; } g.cpOn = k;
  g.ai.path = null; drawBoard();
}

// ---- 소리 ----
let ac = null;
function ensureAudio() {
  if (!ac) { try { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') { try { ac.resume().catch(() => {}); } catch (e) {} }
}
function tone(f, d, type, vol, slide, delay) {
  if (!soundOn || !ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), gn = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f * slide), t + d);
    gn.gain.setValueAtTime(vol || 0.06, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}

// ---- 길 찾기 (첫 화면 데모 구슬·테스트용) ----
function findPath(x, y) {
  const n = L.cols * L.rows, dist = new Array(n).fill(Infinity), prev = new Array(n).fill(-1), done = new Uint8Array(n);
  const s = Math.floor(y / CS) * L.cols + Math.floor(x / CS), goal = L.goal.r * L.cols + L.goal.c;
  const free = (c, r) => { const k = cellAt(c, r); return k !== '#' && k !== 'O'; };
  const nearHole = (c, r) => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => cellAt(c + a, r + b) === 'O');
  dist[s] = 0;
  for (;;) {
    let u = -1, best = Infinity;
    for (let i = 0; i < n; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
    if (u < 0 || u === goal) break;
    done[u] = 1; const c = u % L.cols, r = (u - c) / L.cols;
    for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const c2 = c + a, r2 = r + b; if (!free(c2, r2)) continue;
      const v = r2 * L.cols + c2, nd = dist[u] + 1 + (nearHole(c2, r2) ? 2 : 0);
      if (nd < dist[v]) { dist[v] = nd; prev[v] = u; }
    }
  }
  if (!isFinite(dist[goal])) return [];
  const cells = []; for (let v = goal; v !== -1 && v !== s; v = prev[v]) cells.unshift(v);
  const pts = cells.map(v => ({ x: (v % L.cols) * CS + CS / 2, y: Math.floor(v / L.cols) * CS + CS / 2 }));
  // 꺾이는 곳만 남긴다
  return pts.filter((p, i) => { if (i === pts.length - 1) return true; const a = i ? pts[i - 1] : { x: Math.floor(x / CS) * CS + CS / 2, y: Math.floor(y / CS) * CS + CS / 2 }, b = pts[i + 1]; return (p.x - a.x) * (b.y - p.y) !== (p.y - a.y) * (b.x - p.x); });
}
function steer(m, st) {
  if (!st.path) { st.path = findPath(m.x, m.y); st.i = 0; }
  let tg = st.path[st.i]; if (!tg) return [0, 0];
  let dx = tg.x - m.x, dy = tg.y - m.y, d = Math.hypot(dx, dy);
  if (d < 12 && st.i < st.path.length - 1) { st.i++; tg = st.path[st.i]; dx = tg.x - m.x; dy = tg.y - m.y; d = Math.hypot(dx, dy); }
  const sp = Math.min(AIV, 50 + d * 2.2), k = d || 1;
  const cl = v => Math.max(-1, Math.min(1, v));
  return [cl((dx / k * sp - m.vx) / 150), cl((dy / k * sp - m.vy) / 150)];
}

// ---- 한 프레임 ----
function part(x, y, vx, vy, life, col, r, sq) { if (g.parts.length < 110) g.parts.push({ x, y, vx, vy, life, max: life, col, r, sq }); }
function pop(x, y, txt, col) { if (g.pops.length < 8) g.pops.push({ x, y, txt, col, life: 1 }); }
function inputVec() {
  if (testIn) return testIn;
  let x = kb.r - kb.l, y = kb.d - kb.u;
  if (joy.on) { x += (joy.x - joy.x0) / 50; y += (joy.y - joy.y0) / 50; }
  if (tilt.on) { x += tilt.x; y += tilt.y; }
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  return { x, y };
}
function bump(imp, nx, ny) {
  const m = g.m;
  if (imp < 45) return;
  g.bounces++;
  m.sq = Math.min(0.32, imp / 1400); m.sqa = Math.atan2(ny, nx);
  g.shake = Math.max(g.shake, Math.min(7, imp / 75));
  const n = Math.min(6, 1 + Math.floor(imp / 90));
  for (let i = 0; i < n; i++) part(m.x - nx * R, m.y - ny * R, nx * 120 + (rnd() - .5) * 200, ny * 120 + (rnd() - .5) * 200, 0.3, i % 2 ? '#fff' : '#ffe27a', 2.5);
  if (g.sndT <= 0) { tone(240 + Math.min(500, imp), 0.06, 'triangle', Math.min(0.12, 0.02 + imp / 4000)); g.sndT = 0.05; }
}
function collide(m) {
  const c0 = Math.floor((m.x - R) / CS), c1 = Math.floor((m.x + R) / CS), r0 = Math.floor((m.y - R) / CS), r1 = Math.floor((m.y + R) / CS);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (cellAt(c, r) !== '#') continue;
    const nx = Math.max(c * CS, Math.min(m.x, c * CS + CS)), ny = Math.max(r * CS, Math.min(m.y, r * CS + CS));
    let dx = m.x - nx, dy = m.y - ny; const d2 = dx * dx + dy * dy;
    if (d2 >= R * R) continue;
    let d = Math.sqrt(d2);
    if (d < 1e-3) { m.x = m.px; m.y = m.py; m.vx *= -REST; m.vy *= -REST; continue; }
    dx /= d; dy /= d; m.x += dx * (R - d); m.y += dy * (R - d);
    const vn = m.vx * dx + m.vy * dy;
    if (vn < 0) { m.vx -= (1 + REST) * vn * dx; m.vy -= (1 + REST) * vn * dy; m.vx *= 0.97; m.vy *= 0.97; bump(-vn, dx, dy); }
  }
}
function tick() {
  if (!g || phase === 'paused' || phase === 'result') return;
  const m = g.m;
  for (const p of g.parts) { p.life -= DT; p.x += p.vx * DT; p.y += p.vy * DT; p.vx *= 0.96; p.vy *= 0.96; if (p.sq) p.vy += 300 * DT; }

  } catch (e) {}
});

$('#start').addEventListener('click', () => startLevel());
$('#again').addEventListener('click', () => startLevel(lvI));
$('#next').addEventListener('click', () => startLevel(Math.min(LV.length - 1, lvI + 1)));
$('#home').addEventListener('click', goHome);
$('#resume').addEventListener('click', resume);
$('#pauseBtn').addEventListener('click', pause);
$('#lvs').addEventListener('click', e => {
  const b = e.target.closest('.lv'); if (!b || b.disabled) return;
  lvI = +b.dataset.l; store.level = lvI; save(); goHome();
});
$('#snd').addEventListener('click', () => { ensureAudio(); soundOn = !soundOn; store.sound = soundOn; save(); setSnd(); tone(660, 0.08, 'square', 0.05); });

// ---- 루프 ----
let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let e = (now - lastT) / 1000; lastT = now;
  if (e > 0.1) e = 0.1; if (e < 0) e = 0;
  if (!manual) { acc += e; let n = 0; while (acc >= DT && n < 6) { tick(); acc -= DT; n++; } if (n >= 6) acc = 0; }
  render(manual ? 1 : Math.min(1, acc / DT)); hudSet();
}
const r0 = stage.getBoundingClientRect(); orient = r0.height > r0.width * 1.08 ? 1 : 0;
fresh(true, lvI);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else addEventListener('resize', resize);
resize(); setLvBtns(); setSnd(); hudSet();
requestAnimationFrame(frame);

// ---- 테스트 훅 ----
window.__test = {
  seed(n) { rnd = mulberry(n); manual = true; },
  level(n) { startLevel(n - 1); },
  step(n) { for (let i = 0; i < (n || 1); i++) tick(); hudSet(); render(); },
  input(o) { testIn = o ? { x: +o.x || 0, y: +o.y || 0 } : null; },
  place(x, y) { const m = g.m; m.x = m.px = x; m.y = m.py = y; m.vx = m.vy = 0; },
  cell(c, r) { return { x: c * CS + CS / 2, y: r * CS + CS / 2 }; },
  path() { return findPath(g.m.x, g.m.y); },
  info() { return { orient, cols: L.cols, rows: L.rows, holes: L.holes.map(h => ({ x: h.x, y: h.y })), cps: L.cps.map(h => ({ x: h.x, y: h.y })), goal: { x: L.goal.x, y: L.goal.y }, start: { x: L.start.x, y: L.start.y }, limit: LV[lvI].limit, t3: LV[lvI].t3, t2: LV[lvI].t2 }; },
  state() { const m = g.m; return { phase, level: lvI + 1, demo: g.demo, x: m.x, y: m.y, vx: m.vx, vy: m.vy, t: g.t, falls: g.falls, bounces: g.bounces, shake: g.shake, falling: m.fall > 0, cp: { x: g.cp.x, y: g.cp.y }, stars: g.stars || 0, best: bestOf(lvI), sound: soundOn }; }
};
})();
